<!doctype html>
<!--
  grasp.alsouq.tech/k/?c=<code> — a coach's invite to a client, sent from the
  app (owner, 2026-10-31).

  Says which coach, with a button that opens Grasp at grasp://k/<code> (the
  app's screen where the client agrees, and sees exactly what the coach will
  see) and the store badges for anyone who does not have the app yet.

  The coach's name is read through public.coach_invite with the publishable
  key; it is written with textContent, never as HTML.

  Hand-written, not generated: build/build.py does not touch this folder.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your coach on Grasp</title>
    <meta name="description" content="Your coach invited you to Grasp, the free workout app." />
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Your coach invited you to Grasp 💪" />
    <meta property="og:description" content="Get your program from your coach on Grasp, and let them follow your training. Free on iPhone and Android." />
    <meta property="og:image" content="https://grasp.alsouq.tech/img/screens/en/home.webp" />
    <link rel="icon" href="/favicon.png" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .f { min-height: 100vh; display: grid; place-items: start center; padding: 56px 16px 40px; }
      .f-card { display: grid; gap: 22px; width: 100%; max-width: 28rem; text-align: center; justify-items: center; }
      .f-avatar { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center;
        background: var(--accent, #c6f432); color: var(--on-accent, #0d0e10); font-size: 2.2rem; font-weight: 800; }
      .f-card h1 { margin: 0; font-size: 1.7rem; line-height: 1.25; overflow-wrap: anywhere; }
      .f-card p { margin: 0; color: var(--muted, #8a8f95); }
      .f-open { display: block; width: 100%; text-align: center; padding: 15px 18px; border-radius: 999px; font-weight: 700;
        text-decoration: none; background: var(--accent, #c6f432); color: var(--on-accent, #0d0e10); }
      .f-steps { display: grid; gap: 10px; width: 100%; }
      .f-badges { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
      .f-badges img { height: 50px; width: auto; }
      .f-badges .play img { height: 74px; margin: -12px; }
      .f-note { font-size: 0.85rem; }
      [hidden] { display: none !important; }
    </style>
    <script>
      (function () {
        if (/^ar\b/i.test(navigator.language || '')) {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      })();
    </script>
    <script src="/theme.js"></script>
  </head>
  <body>
    <main class="f">
      <div class="f-card">
        <div class="f-avatar" id="initial" aria-hidden="true">G</div>
        <h1 id="title" data-en="Your coach invited you to Grasp" data-ar="مدربك يدعوك لـ Grasp">Your coach invited you to Grasp</h1>
        <p data-en="Get your program from your coach and let them follow your workouts. They never see your body weight or photos, and you can stop any time."
           data-ar="يوصلك برنامجك من مدربك ويتابع تمارينك. ما يشوف وزن جسمك ولا صورك، وتقدر توقف متى ما بغيت.">Get your program from your coach and let them follow your workouts. They never see your body weight or photos, and you can stop any time.</p>

        <a class="f-open" id="open" href="#" hidden data-en="Open in Grasp" data-ar="افتح Grasp">Open in Grasp</a>

        <div class="f-steps">
          <p data-en="Don't have Grasp yet? Get it, sign in, then come back to this link."
             data-ar="ما عندك Grasp؟ حمّله وسجّل دخولك، وبعدين ارجع لهالرابط.">Don't have Grasp yet? Get it, sign in, then come back to this link.</p>
          <div class="f-badges">
            <a class="store-badge" id="ios" href="https://apps.apple.com/app/id6804474068" aria-label="Download Grasp on the App Store"><img src="/img/app-store-badge.svg" alt="Download on the App Store" width="180" height="60" /></a>
            <a class="store-badge play" id="android" href="https://play.google.com/store/apps/details?id=com.graspapp.mobile" aria-label="Get Grasp on Google Play"><img src="/img/google-play-badge.png" alt="Get it on Google Play" width="231" height="89" /></a>
          </div>
        </div>
        <p class="f-note" id="msg" hidden></p>
      </div>
    </main>
    <script>
      (function () {
        var ar = document.documentElement.lang === 'ar';
        if (ar) {
          document.querySelectorAll('[data-ar]').forEach(function (el) {
            el.textContent = el.getAttribute('data-ar');
          });
        }

        // Only the store for this phone, when we can tell which phone it is.
        var ua = navigator.userAgent || '';
        var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        var android = /Android/i.test(ua);
        if (ios) document.getElementById('android').hidden = true;
        if (android) document.getElementById('ios').hidden = true;

        var msg = document.getElementById('msg');
        var code = (new URLSearchParams(location.search).get('c') || '').toLowerCase();
        if (!/^[a-f0-9]{10}$/.test(code)) {
          msg.textContent = ar ? 'هذا الرابط ناقص.' : 'This link is incomplete.';
          msg.hidden = false;
          return;
        }

        var open = document.getElementById('open');
        open.href = 'grasp://k/' + code;
        open.hidden = false;

        fetch('https://krwwhpdetdcqimaqwphd.supabase.co/rest/v1/rpc/coach_invite', {
          method: 'POST',
          headers: {
            apikey: 'sb_publishable__b43F0Q1LeDY5eWRQPxAOw_-aAi59eD',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ p_code: code }),
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (invite) {
            var name = invite && typeof invite.name === 'string' ? invite.name : '';
            if (!name.trim()) {
              open.hidden = true;
              msg.textContent = ar ? 'هذه الدعوة لم تعد تعمل. اطلب رابط جديد.' : 'This invite does not work any more. Ask for a new link.';
              msg.hidden = false;
              return;
            }
            name = name.trim();
            document.getElementById('initial').textContent = name.charAt(0).toUpperCase();
            document.getElementById('title').textContent = ar ? name + ' يبي يصير مدربك على Grasp' : name + ' wants to be your coach on Grasp';
            document.title = name + ' · Grasp';
          })
          .catch(function () {});
      })();
    </script>
    <script src="/hit.js"></script>
  </body>
</html>
