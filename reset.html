<!doctype html>
<!--
  Setting a new password, here rather than in the app.

  The first version of this page tried to hand off to `grasp://` and let the
  app take over. That was the wrong shape: a reset link arrives by email and
  email gets read on laptops, on other people's phones, and on devices that
  have never had Grasp installed. Requiring the app to finish made the one
  thing a locked-out person needs depend on the one thing they may not have.

  So the reset completes here. The token is in the URL fragment, which never
  leaves the browser and is never sent to this server; the password goes
  straight from this page to Supabase over TLS. Afterwards they sign in to the
  app normally, with no link and no deep link involved.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set a new password — Grasp</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <script src="theme.js"></script>
    <style>
      .field {
        display: block;
        width: 100%;
        max-width: 420px;
        padding: 14px 16px;
        margin: 8px 0 4px;
        font: inherit;
        font-size: 17px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .field:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .note {
        color: var(--muted);
        font-size: 15px;
      }
      .bad {
        color: #d24b4b;
      }
    </style>
  </head>
  <body>
    <header class="site">
      <div class="wrap">
        <a href="index.html" aria-label="Grasp home">
          <svg
            class="lockup"
            viewBox="-4 25 264 50"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Grasp"
          >
            <g stroke="currentColor" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="10" y1="30" x2="10" y2="70" />
              <line x1="25" y1="30" x2="25" y2="70" />
              <line x1="40" y1="30" x2="40" y2="70" />
              <line x1="55" y1="30" x2="55" y2="70" />
              <path d="M 112 30 L 93 30 L 93 70 L 112 70 L 112 52 L 103 52" />
              <path d="M 129 70 L 129 30 L 147 30 L 147 48 L 129 48" />
              <path d="M 137 48 L 148 70" />
              <path d="M 165 70 L 165 38 L 174 30 L 183 38 L 183 70" />
              <path d="M 165 54 L 183 54" />
              <path d="M 220 30 L 201 30 L 201 50 L 219 50 L 219 70 L 200 70" />
              <path d="M 237 70 L 237 30 L 255 30 L 255 50 L 237 50" />
            </g>
            <line
              x1="1"
              y1="64"
              x2="64"
              y2="36"
              stroke="var(--accent)"
              stroke-width="8.5"
              stroke-linecap="round"
            />
          </svg>
        </a>
        <nav>
          <a href="index.html">Home</a>
          <a href="privacy.html">Privacy</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <h1 id="heading">Set a new password</h1>
      <p id="message">Choose something you have not used elsewhere.</p>

      <form id="form" hidden>
        <label for="password" class="note">NEW PASSWORD</label>
        <input
          class="field"
          id="password"
          type="password"
          autocomplete="new-password"
          placeholder="At least 8 characters"
          minlength="8"
          required
        />
        <p class="note" id="hint">At least 8 characters.</p>
        <p class="bad" id="error" hidden></p>
        <p><button class="cta" id="submit" type="submit">Save password</button></p>
      </form>
    </main>

    <script>
      (function () {
        var PROJECT = 'https://krwwhpdetdcqimaqwphd.supabase.co';
        // The publishable key. It ships inside every copy of the app already
        // and is designed to be public; it identifies the project and grants
        // nothing on its own. The bearer token below is what authorises this.
        var KEY = 'sb_publishable__b43F0Q1LeDY5eWRQPxAOw_-aAi59eD';
        var MIN = 8;

        var params = new URLSearchParams(window.location.hash.slice(1));
        var heading = document.getElementById('heading');
        var message = document.getElementById('message');
        var form = document.getElementById('form');
        var error = document.getElementById('error');
        var submit = document.getElementById('submit');
        var password = document.getElementById('password');

        var failure = params.get('error_description') || params.get('error');
        if (failure) {
          // Expired links come back this way rather than as a failed request.
          heading.textContent = 'That link has expired';
          message.textContent =
            'Reset links can only be used once, and they do not last long. Open Grasp and ask ' +
            'for a new one from the sign-in screen.';
          return;
        }

        var token = params.get('access_token');
        if (!token) {
          heading.textContent = 'Nothing to reset';
          message.textContent =
            'This page is the last step of a password reset. Open Grasp and ask for a link from ' +
            'the sign-in screen.';
          return;
        }

        // The token is in the address bar. Taking it out of the URL means a
        // shoulder-surfer or a shared screenshot does not hand it over, and
        // the page keeps its own copy in memory.
        history.replaceState(null, '', window.location.pathname);
        form.hidden = false;

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          error.hidden = true;

          if (password.value.length < MIN) {
            error.textContent = 'Passwords need to be at least eight characters.';
            error.hidden = false;
            return;
          }

          submit.disabled = true;
          submit.textContent = 'Saving…';

          fetch(PROJECT + '/auth/v1/user', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              apikey: KEY,
              Authorization: 'Bearer ' + token,
            },
            body: JSON.stringify({ password: password.value }),
          })
            .then(function (response) {
              return response.json().then(function (body) {
                return { ok: response.ok, body: body };
              });
            })
            .then(function (result) {
              if (!result.ok) {
                throw new Error(
                  (result.body && (result.body.msg || result.body.message)) ||
                    'That did not work. Ask for a new link and try again.'
                );
              }
              heading.textContent = 'Password changed';
              message.textContent =
                'Open Grasp and sign in with your new password. Everything you have logged is ' +
                'where you left it.';
              form.hidden = true;
            })
            .catch(function (failed) {
              error.textContent = failed.message;
              error.hidden = false;
              submit.disabled = false;
              submit.textContent = 'Save password';
            });
        });
      })();
    </script>

    <footer class="site">
      <div class="wrap">
        <span>© 2026 Grasp</span>

          <a href="privacy.html">Privacy</a> · <a href="support.html">Support</a> ·

        </span>
      </div>
    </footer>
  </body>
</html>
