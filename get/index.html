<!doctype html>
<!--
  grasp.alsouq.tech/get — one link for both stores, for posts and bios.

  On an iPhone or iPad it goes straight to the App Store, on Android straight
  to Google Play; anywhere else it shows both badges. The view is counted by
  /hit.js like any other page (a ?ref= tag, e.g. /get?ref=linkedin, names the
  source on the dashboard), then the redirect happens.

  Hand-written, not generated: build/build.py does not touch this folder.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get Grasp</title>
    <meta name="description" content="Grasp plans your workout and works out your weights. Free on iPhone and Android, no ads, works offline." />
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Grasp: your workout, planned" />
    <meta property="og:description" content="Free on iPhone and Android. No ads, works offline, in 15 languages." />
    <meta property="og:image" content="https://grasp.alsouq.tech/img/screens/en/home.webp" />
    <link rel="canonical" href="https://grasp.alsouq.tech/" />
    <link rel="icon" href="/favicon.png" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .get {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding-inline: 16px;
        padding-block: 40px;
        text-align: center;
      }
      .get-card { display: grid; gap: 18px; justify-items: center; max-width: 30rem; }
      .get-card img.icon { width: 88px; height: 88px; border-radius: 22px; }
      .get-card h1 { margin: 0; font-size: 2rem; line-height: 1.25; text-wrap: balance; }
      .get-card p { margin: 0; color: var(--muted, #8a8f95); }
      .get-badges { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
      .get-badges img { height: 54px; width: auto; }
      .get-badges .play img { height: 80px; margin: -13px; }
      .get-home { font-size: 0.95rem; }
    </style>
    <script>
      // Arabic readers get Arabic text; everyone else English. Set before
      // hit.js runs, so the view is counted under the right language.
      (function () {
        var ar = /^ar\b/i.test(navigator.language || '');
        if (ar) {
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      })();
    </script>
    <script src="/theme.js"></script>
  </head>
  <body>
    <main class="get">
      <div class="get-card">
        <img class="icon" src="/favicon.png" alt="" width="88" height="88" />
        <h1 data-en="Grasp plans your workout" data-ar="Grasp يخطط تمارينك">Grasp plans your workout</h1>
        <p data-en="Free on iPhone and Android. No ads, works offline."
           data-ar="مجاني على آيفون وأندرويد. بدون إعلانات، ويشتغل بدون نت.">Free on iPhone and Android. No ads, works offline.</p>
        <div class="get-badges">
          <a class="store-badge" id="ios" href="https://apps.apple.com/app/id6804474068" aria-label="Download Grasp on the App Store"><img src="/img/app-store-badge.svg" alt="Download on the App Store" width="180" height="60" /></a>
          <a class="store-badge play" id="android" href="https://play.google.com/store/apps/details?id=com.graspapp.mobile" aria-label="Get Grasp on Google Play"><img src="/img/google-play-badge.png" alt="Get it on Google Play" width="231" height="89" /></a>
        </div>
        <a class="get-home" href="/" data-en="More about Grasp" data-ar="المزيد عن Grasp">More about Grasp</a>
      </div>
    </main>
    <script>
      (function () {
        if (document.documentElement.lang !== 'ar') return;
        document.querySelectorAll('[data-ar]').forEach(function (el) {
          el.textContent = el.getAttribute('data-ar');
        });
        var home = document.querySelector('.get-home');
        if (home) home.setAttribute('href', '/ar/');
      })();
    </script>
    <!-- Counted first (sendBeacon survives the page leaving), then sent on. -->
    <script src="/hit.js"></script>
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        var android = /Android/i.test(ua);
        var target = ios ? 'ios' : android ? 'android' : '';
        if (target) location.replace(document.getElementById(target).href);
      })();
    </script>
  </body>
</html>
