            var path = svg('path', { d: arcPath(64, 40, 60, a, a1), fill: it.color, stroke: 'var(--surface)', 'stroke-width': items.length > 1 ? 2 : 0 });
            bindTip(path, function () {
              return { title: it.label, rows: [{ color: it.color, value: fmtN(it.value), label: pctS(it.value, total) }] };
            });
            root.appendChild(path);
            a = a1;
          });
          root.appendChild(svgText({ x: 64, y: 66, 'text-anchor': 'middle', class: 'tot' }, fmtN(total)));
          root.appendChild(svgText({ x: 64, y: 80, 'text-anchor': 'middle', class: 'totl' }, (centerLabel || 'TOTAL').toUpperCase()));
          wrap.appendChild(root);
          var ul = el('ul', 'dl');
          items.forEach(function (it) {
            var li = el('li');
            var sw = el('i', 'sw'); sw.style.background = it.color;
            li.appendChild(sw);
            li.appendChild(el('span', null, it.label));
            li.appendChild(el('span', 'v', fmtN(it.value)));
            li.appendChild(el('span', 'p', pctS(it.value, total)));
            ul.appendChild(li);
          });
          wrap.appendChild(ul);
          box.appendChild(wrap);
        }

        /* Horizontal bars in HTML: labels wrap, values align, rows can be buttons. */
        function hbars(box, rows, o) {
          o = o || {};
          if (!rows.length) { box.appendChild(el('p', 'empty', o.emptyText || 'Nothing in this range.')); return; }
          var max = o.max || Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([1]));
          var ul = el('ul', 'bars');
          rows.forEach(function (r) {
            var li = el('li', r.onClick ? 'click' : null);
            li.appendChild(el('span', 'l', r.label));
            var b = el('span', 'b');
            var i = el('i');
            i.style.width = Math.max(0, Math.min(100, (r.value / max) * 100)) + '%';
            if (r.color) i.style.background = r.color;
            b.appendChild(i);
            li.appendChild(b);
            var v = el('span', 'v', r.display != null ? r.display : fmtN(r.value));
            if (r.sub) v.appendChild(el('span', null, r.sub));
            li.appendChild(v);
            if (r.onClick) {
              li.tabIndex = 0;
              li.setAttribute('role', 'button');
              li.addEventListener('click', r.onClick);
              li.addEventListener('keydown', function (ev) {
                if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); r.onClick(); }
              });
            }
            if (r.title) li.title = r.title;
            ul.appendChild(li);
          });
          box.appendChild(ul);
        }

        function heatmap(box, matrix, o) {
          deferred(box, function (holder) { heatmapNow(holder, matrix, o); });
        }

        function heatmapNow(box, matrix, o) {
          var W = boxWidth(box);
          var labW = 34, padB = 20;
          var cw = (W - labW) / 24;
          var ch = Math.max(14, Math.min(26, cw * 0.8));
          var H = ch * 7 + padB;
          var max = 0;
          matrix.forEach(function (row) { row.forEach(function (v) { if (v > max) max = v; }); });
          var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart', role: 'img' });
          root.setAttribute('aria-label', o.label || 'Heatmap');
          var order = [1, 2, 3, 4, 5, 6, 0]; /* Monday first */
          order.forEach(function (wd, r) {
            root.appendChild(svgText({ x: 0, y: r * ch + ch / 2 + 4 }, WD[wd]));
            for (var h = 0; h < 24; h++) {
              var v = matrix[wd][h];
              var rect = svg('rect', {
                x: labW + h * cw + 1, y: r * ch + 1, width: Math.max(1, cw - 2), height: ch - 2, rx: 2,
                fill: v ? 'var(--accent)' : 'var(--raised)',
              });
              if (v) rect.setAttribute('fill-opacity', (0.14 + 0.86 * (v / max)).toFixed(3));
              (function (wd2, h2, v2) {
                bindTip(rect, function () {
                  return {
                    title: WD_LONG[wd2] + ', ' + pad2(h2) + ':00–' + pad2((h2 + 1) % 24) + ':00',
                    rows: [{ color: 'var(--accent)', value: fmtN(v2), label: plural(v2, o.unit || 'workout') }],
                  };
                });
              }(wd, h, v));
              root.appendChild(rect);
            }
          });
          var hstep = cw * 3 >= 26 ? 3 : 6;
          for (var hh = 0; hh < 24; hh += hstep) {
            root.appendChild(svgText({ x: labW + hh * cw + 1, y: H - 5 }, pad2(hh)));
          }
          box.appendChild(root);
        }
        function pad2(n) { return (n < 10 ? '0' : '') + n; }

        function spark(values, color) {
          var W = 120, H = 30;
          var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'spark', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
          var vals = values.map(function (v) { return v == null ? 0 : v; });
          if (vals.length < 2) return root;
          var max = Math.max.apply(null, vals.concat([1]));
          var pts = vals.map(function (v, i) {
            return [(i / (vals.length - 1)) * W, H - 2 - (v / max) * (H - 4)];
          });
          var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join('');
          root.appendChild(svg('path', { d: line + 'L' + W + ',' + H + 'L0,' + H + 'Z', fill: color || 'var(--accent)', 'fill-opacity': 0.12, stroke: 'none' }));
          root.appendChild(svg('path', { d: line, fill: 'none', stroke: color || 'var(--accent)', 'stroke-width': 1.5, 'vector-effect': 'non-scaling-stroke', 'stroke-linejoin': 'round' }));
          return root;
        }

        function featIcons(u) {
          var span = el('span', 'feats');
          var names = [];
          FEATURES.forEach(function (f) {
            if (!u.feat[f.id] || f.id === 'warmups' || f.id === 'cardio') return;
            names.push(f.name);
            var s = svg('svg', { viewBox: '0 0 16 16', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' });
            s.appendChild(svg('path', { d: ICONS[f.id] }));
            span.appendChild(s);
          });
          if (names.length) { span.title = names.join(', '); span.setAttribute('aria-label', names.join(', ')); }
          return span;
        }

        /* ---- page furniture ---- */

        function card(parent, title, note, extra) {
          var c = el('div', 'card');
          if (title) {
            var h = el('div', 'ch');
            h.appendChild(el('h3', null, title));
            if (note) h.appendChild(el('span', 'note', note));
            if (extra) { extra.classList.add('end'); h.appendChild(extra); }
            c.appendChild(h);
          }
          parent.appendChild(c);
          return c;
        }
        function row(parent, cls) { var r = el('div', cls || 'pair'); parent.appendChild(r); return r; }
        function segmented(options, value, onPick, labelText) {
          var g = el('div', 'seg');
          g.setAttribute('role', 'group');
          if (labelText) g.setAttribute('aria-label', labelText);
          options.forEach(function (op) {
            var b = el('button', null, op[1]);
            b.type = 'button';
            b.setAttribute('aria-pressed', op[0] === value ? 'true' : 'false');
            b.addEventListener('click', function () { onPick(op[0]); });
            g.appendChild(b);
          });
          return g;
        }
        function tile(parent, k, v, d, o) {
          o = o || {};
          var t = el('div', 'tile' + (o.lead ? ' lead' : ''));
          t.appendChild(el('span', 'k', k));
          var vv = el('span', 'v', v);
          if (o.unit) vv.appendChild(el('small', null, o.unit));
          t.appendChild(vv);
          if (d) t.appendChild(el('span', 'd' + (o.dir ? ' ' + o.dir : ''), d));
          if (o.spark) t.appendChild(o.spark);
          parent.appendChild(t);
          return t;
        }

        /* =================================================================
           Shared computations.
           ================================================================= */

        var FUNNEL = [
          ['Created account', 'account', function () { return true; }],
          ['Finished onboarding', 'onboarding', function (u) { return u.onboarded != null; }],
          ['Started a workout', 'first workout', function (u) { return u.firstStart != null || u.nDone > 0; }],
          ['Finished 1', 'first finish', function (u) { return u.nDone >= 1; }],
          ['Finished 2', 'second workout', function (u) { return u.nDone >= 2; }],
          ['Finished 5', 'fifth workout', function (u) { return u.nDone >= 5; }],
        ];
        function funnelOf(users) {
          return FUNNEL.map(function (f) {
            var by = { ios: 0, android: 0, unknown: 0 }, n = 0;
            users.forEach(function (u) { if (f[2](u)) { n++; by[u.platform]++; } });
            return { stage: f[0], short: f[1], people: n, by: by };
          });
        }
        function worstStep(steps) {
          var worst = -1, lost = 0;
          steps.forEach(function (s, i) {
            if (!i) return;
            var l = steps[i - 1].people - s.people;
            if (l > lost) { lost = l; worst = i; }
          });
          return worst;
        }

        function doneIn(S, fn) {
          var out = [];
          S.sessions.forEach(function (s) { if (s.done && S.inR(s.fDay)) out.push(s); });
          return fn ? out.filter(fn) : out;
        }

        function heatOf(sessions) {
          var m = [];
          for (var w = 0; w < 7; w++) m.push(zeros(24));
          sessions.forEach(function (s) { if (s.wd != null) m[s.wd][s.hour]++; });
          return m;
        }

        function goPeople(filter) {
          ui.peopleFilter = filter;
          ui.peopleQuick = 'all';
          ui.peopleLimit = 100;
          selectTab('people', true);
        }

        /* =================================================================
           1. Overview
           ================================================================= */

        function rOverview(p, S) {
          var mode = autoMode(S.len);
          var B = buckets(S.start, S.end, mode);
          var n = B.list.length;
          function per(d) { return d == null ? -1 : d >= S.start && d <= S.end ? 0 : d >= S.pstart && d <= S.pend ? 1 : -1; }

          var k = { neu: [0, 0], act: [0, 0], au: [new Set(), new Set()], wo: [0, 0], sets: [0, 0], vol: [0, 0], mins: [[], []], cr: [0, 0] };
          var sp = { neu: zeros(n), act: zeros(n), au: [], wo: zeros(n), sets: zeros(n), vol: zeros(n), mins: [], cr: zeros(n) };
          for (var i = 0; i < n; i++) { sp.au.push(new Set()); sp.mins.push([]); }

          S.users.forEach(function (u) {
            var w = per(u.cDay);
            if (w >= 0) { k.neu[w]++; if (!w) sp.neu[B.index(u.cDay)]++; }
            w = per(u.fdDay);
            if (w >= 0) { k.act[w]++; if (!w) sp.act[B.index(u.fdDay)]++; }
          });
          S.sessions.forEach(function (s) {
            if (!s.done) return;
            var w = per(s.fDay);
            if (w < 0) return;
            k.au[w].add(s.u); k.wo[w]++; k.sets[w] += s.sets; k.vol[w] += s.vol;
            if (s.mins != null) k.mins[w].push(s.mins);
            if (!w) {
              var j = B.index(s.fDay);
              sp.au[j].add(s.u); sp.wo[j]++; sp.sets[j] += s.sets; sp.vol[j] += s.vol;
              if (s.mins != null) sp.mins[j].push(s.mins);
            }
          });
          S.crashes.forEach(function (c) {
            var w = per(c.day);
            if (w >= 0) { k.cr[w]++; if (!w) sp.cr[B.index(c.day)]++; }
          });
          /*
            Downloads, as the App Store and Google Play report them: the
            complete number, about a day late. The platform filter picks the
            store. The countries tile counts where they came from.
          */
          k.dl = [0, 0]; sp.dl = zeros(n);
          var places = [new Set(), new Set()], firstSeen = {};
          M.store.forEach(function (r) {
            if (ctl.platform === 'ios' && r.source !== 'apple') return;
            if (ctl.platform === 'android' && r.source !== 'google') return;
            if (ctl.platform === 'unknown') return;
            var w = per(r.day);
            if (w < 0) return;
            k.dl[w] += r.n;
            if (r.country && r.country !== 'ZZ') places[w].add(r.country);
            if (!w) { var j = B.index(r.day); sp.dl[j] += r.n; firstSeen[r.country] = Math.min(firstSeen[r.country] == null ? j : firstSeen[r.country], j); }
          });
          /* Countries reached so far, bucket by bucket. */
          sp.pl = zeros(n);
          Object.keys(firstSeen).forEach(function (cc) { for (var j = firstSeen[cc]; j < n; j++) sp.pl[j]++; });
          var storeNote = M.store.length ? null : { text: 'stores not connected', dir: null };

          var showDelta = ctl.range !== 'all';
          function delta(cur, prev, isMinutes) {
            if (!showDelta) return { text: 'all time', dir: null };
            if (isMinutes) {
              if (cur == null || prev == null) return { text: prev == null ? 'nothing before' : '—', dir: null };
              var dm = Math.round(cur - prev);
              return { text: (dm > 0 ? '+' : dm < 0 ? '−' : '±') + Math.abs(dm) + ' min vs previous', dir: null };
            }
            if (!prev && !cur) return { text: 'none either period', dir: null };
            if (!prev) return { text: 'none in previous period', dir: null };
            var c = Math.round(((cur - prev) / prev) * 100);
            return { text: Math.abs(c) + '% vs previous', dir: c > 0 ? 'up' : c < 0 ? 'down' : null };
          }

          var grid = el('div', 'tiles kpis');
          p.appendChild(grid);
          var kpis = [
            ['Downloads', M.store.length ? fmtN(k.dl[0]) : '—', storeNote || delta(k.dl[0], k.dl[1]), sp.dl, true],
            ['Countries', M.store.length ? fmtN(places[0].size) : '—', storeNote || { text: places[1].size + ' in previous period', dir: null }, sp.pl],
            ['New accounts', fmtN(k.neu[0]), delta(k.neu[0], k.neu[1]), sp.neu],
            ['Activated', fmtN(k.act[0]), delta(k.act[0], k.act[1]), sp.act],
            ['Active users', fmtN(k.au[0].size), delta(k.au[0].size, k.au[1].size), sp.au.map(function (s) { return s.size; })],
            ['Workouts finished', fmtN(k.wo[0]), delta(k.wo[0], k.wo[1]), sp.wo],
            ['Sets logged', fmtN(k.sets[0]), delta(k.sets[0], k.sets[1]), sp.sets],
            ['Volume lifted', fmt1(k.vol[0] / 1000), delta(k.vol[0], k.vol[1]), sp.vol, false, 't'],
            ['Median workout', k.mins[0].length ? fmtN(median(k.mins[0])) : '—', delta(median(k.mins[0]), median(k.mins[1]), true), sp.mins.map(median), false, k.mins[0].length ? 'min' : ''],
            ['Crashes', fmtN(k.cr[0]), delta(k.cr[0], k.cr[1]), sp.cr],
          ];
          kpis.forEach(function (x) {
            tile(grid, x[0], x[1], x[2].text, { lead: x[4], unit: x[5], dir: x[2].dir, spark: spark(x[3]) });
          });

          mapBox(p, S);

          var c = card(p, 'Insights');
          var list = insights(S, k);
          if (!list.length) c.appendChild(el('p', 'empty', 'Nothing stands out for these filters.'));
          else {
            var ul = el('ul', 'insights');
            list.forEach(function (it) { ul.appendChild(el('li', it.warn ? 'warn' : null, it.text)); });
            c.appendChild(ul);
          }
        }

        function insights(S, k) {
          var out = [];
          var period = ctl.range === 'all' ? 'overall' : 'in this period';

          var stale = S.users.filter(noOta).length;
          if (stale) {
            out.push({
              warn: true,
              text: stale === 1
                ? '1 iPhone user is on a build that can\'t receive over-the-air updates (build 12 or older)'
                : stale + ' iPhone users are on builds that can\'t receive over-the-air updates (build 12 or older)',
            });
          }

          var lost = S.sessions.filter(function (s) { return s.lost && S.inR(s.dDay); }).length;
          if (lost) out.push({ warn: true, text: lost + ' ' + plural(lost, 'workout') + ' in progress ' + (lost === 1 ? 'was' : 'were') + ' lost ' + period });
          else if (S.end >= FIX_DAY && S.start >= FIX_DAY && k.wo[0] > 0) out.push({ text: 'No in-progress workouts lost since 0.3.1' });

          var stuck = S.sessions.filter(function (s) { return s.abandoned && S.inR(s.sDay); }).length;
          if (stuck) out.push({ text: stuck + ' ' + plural(stuck, 'workout') + ' started ' + period + ' ' + (stuck === 1 ? 'was' : 'were') + ' never finished' });

          var J = S.joined;
          if (J.length >= 5) {
            var steps = funnelOf(J);
            var w = worstStep(steps);
            if (w > 0) {
              var a = steps[w - 1], b = steps[w];
              out.push({ text: 'Biggest drop-off: ' + a.short + ' → ' + b.short + ' (' + pct(a.people - b.people, a.people) + '% of ' + a.people + ' stop)' });
            }
            var act = J.filter(function (u) { return u.nDone > 0; }).length;
            out.push({ text: pct(act, J.length) + '% of new accounts have finished a workout' });
            if (ctl.platform === 'all') {
              var by = { ios: 0, android: 0, unknown: 0 };
              J.forEach(function (u) { by[u.platform]++; });
              var top = PLATS.slice().sort(function (x, y) { return by[y] - by[x]; })[0];
              if (top !== 'unknown') out.push({ text: PLAT[top].name + ' is ' + pct(by[top], J.length) + '% of new accounts ' + period });
            }
          }

          if (showDeltaOK() && k.au[1].size >= 5) {
            var ch = Math.round(((k.au[0].size - k.au[1].size) / k.au[1].size) * 100);
            if (Math.abs(ch) >= 20) out.push({ text: 'Active users ' + (ch > 0 ? 'up ' : 'down ') + Math.abs(ch) + '% on the previous ' + S.len + ' days' });
          }

          var done = doneIn(S);
          if (done.length >= 10) {
            var wdc = zeros(7), hc = zeros(24);
            done.forEach(function (s) { if (s.wd != null) { wdc[s.wd]++; hc[s.hour]++; } });
            var bw = wdc.indexOf(Math.max.apply(null, wdc));
            var bh = hc.indexOf(Math.max.apply(null, hc));
            out.push({ text: 'Busiest day: ' + WD_LONG[bw] + ' · busiest hour: ' + pad2(bh) + ':00–' + pad2((bh + 1) % 24) + ':00 (' + tzShort() + ')' });
          }

          var crashes = S.crashes.filter(function (c) { return S.inR(c.day); });
          if (crashes.length) {
            var vers = {};
            crashes.forEach(function (c) { var v = c.ver || 'unknown'; vers[v] = (vers[v] || 0) + 1; });
            var tv = Object.keys(vers).sort(function (x, y) { return vers[y] - vers[x]; })[0];
            out.push({ warn: true, text: crashes.length + ' ' + plural(crashes.length, 'crash', 'crashes') + ' ' + period + ', most on version ' + tv });
          }

          var inst = { apple: 0, google: 0 };
          M.store.forEach(function (r) { if (S.inR(r.day) && inst[r.source] != null) inst[r.source] += r.n; });
          if (inst.apple + inst.google) {
            out.push({ text: fmtN(inst.apple + inst.google) + ' ' + plural(inst.apple + inst.google, 'download') + ' ' + period + ' (App Store ' + fmtN(inst.apple) + ' · Google Play ' + fmtN(inst.google) + ')' });
          }
          if (!M.store.length) out.push({ text: 'Store downloads aren\'t connected' });
          return out;
        }
        function showDeltaOK() { return ctl.range !== 'all'; }

        /* =================================================================
           2. Growth
           ================================================================= */

        function rGrowth(p, S) {
          var mode = ui.growthMode || autoMode(S.len);
          var B = buckets(S.start, S.end, mode);
          var n = B.list.length;
          var by = { ios: zeros(n), android: zeros(n), unknown: zeros(n) };
          var base = 0;
          S.users.forEach(function (u) {
            if (u.cDay == null) return;
            if (u.cDay < S.start) { base++; return; }
            var i = B.index(u.cDay);
            if (i >= 0) by[u.platform][i]++;
          });
          var cum = [], run = base;
          for (var i = 0; i < n; i++) { run += by.ios[i] + by.android[i] + by.unknown[i]; cum.push(run); }

          var toggle = segmented([['day', 'Daily'], ['week', 'Weekly']], mode, function (v) { ui.growthMode = v; renderActive(); }, 'Granularity');
          var c = card(p, 'New accounts', fmtN(S.joined.length) + ' in range', toggle);
          plot(c, {
            buckets: B.list,
            series: PLATS.map(function (pl) { return { name: PLAT[pl].name, color: PLAT[pl].color, values: by[pl], keep: true }; }),
            right: { name: 'Total accounts', color: 'var(--text)', values: cum, opacity: 0.6, width: 1.6, axisNote: 'right axis' },
            label: 'New accounts per ' + (mode === 'week' ? 'week' : 'day') + ' by platform',
            onClick: function (j) {
              var b = B.list[j];
              goPeople({
                label: 'Joined ' + (b.a === b.b ? dayLabel(b.a) : dayLabel(b.a) + '–' + dayLabel(b.b)),
                test: function (u) { return u.cDay != null && u.cDay >= b.a && u.cDay <= b.b; },
              });
            },
          });

          var r1 = row(p);
          var c1 = card(r1, 'Platform', 'new accounts');
          var pc = { ios: 0, android: 0, unknown: 0 };
          S.joined.forEach(function (u) { pc[u.platform]++; });
          donut(c1, PLATS.map(function (pl) { return { label: PLAT[pl].name, value: pc[pl], color: PLAT[pl].color }; }), 'accounts');

          var c2 = card(r1, 'Sign-in method', 'new accounts');
          var prov = {};
          S.joined.forEach(function (u) { prov[u.provider] = (prov[u.provider] || 0) + 1; });
          var provColors = { google: 'var(--k5)', apple: 'var(--text)', email: 'var(--k4)' };
          donut(c2, Object.keys(prov).sort(function (a, b) { return prov[b] - prov[a]; }).map(function (pv) {
            return { label: label(pv), value: prov[pv], color: provColors[pv] || 'var(--other)' };
          }), 'accounts');

          var r2 = row(p);
          var c3 = card(r2, 'Activation funnel', 'accounts created in range');
          funnelBox(c3, S.joined);

          var c4 = card(r2, 'Heard about us', 'new accounts');
          var heard = {};
          S.joined.forEach(function (u) {
            String(u.heard || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (h) {
              heard[h] = (heard[h] || 0) + 1;
            });
          });
          var answered = S.joined.filter(function (u) { return u.heard; }).length;
          hbars(c4, Object.keys(heard).sort(function (a, b) { return heard[b] - heard[a]; }).map(function (h) {
            return { label: SOURCE_NAMES[h] || label(h), value: heard[h], sub: pctS(heard[h], answered) };
          }), { emptyText: 'No answers in this range.' });

          var c5 = card(p, 'Time to first workout', 'new accounts');
          var TT = [['< 1 hour', HOUR], ['1–24 hours', DAY], ['1–3 days', 3 * DAY], ['3–7 days', 7 * DAY], ['1–2 weeks', 14 * DAY], ['2–4 weeks', 28 * DAY], ['4 weeks +', Infinity]];
          var tt = zeros(TT.length + 1);
          S.joined.forEach(function (u) {
            if (u.firstDone == null || u.created == null) { tt[TT.length]++; return; }
            var dt = u.firstDone - u.created;
            for (var j = 0; j < TT.length; j++) if (dt < TT[j][1]) { tt[j]++; break; }
          });
          if (!S.joined.length) c5.appendChild(el('p', 'empty', 'Nobody joined in this range.'));
          else {
            hbars(c5, TT.map(function (t, j) { return { label: t[0], value: tt[j], sub: pctS(tt[j], S.joined.length) }; })
              .concat([{ label: 'Not yet', value: tt[TT.length], sub: pctS(tt[TT.length], S.joined.length), color: 'var(--other)' }]));
          }

          storeBox(p, S);
        }

        /*
          Where installs come from, on a map.

          Downloads as the App Store and Google Play report them, about a day
          late. The platform filter picks the store: iPhone means the App
          Store, Android Google Play.
        */
        var WORLD = null, WORLD_LOADING = null;
        function loadWorld() {
          if (WORLD) return Promise.resolve(WORLD);
          if (!WORLD_LOADING) {
            WORLD_LOADING = fetch('world.json').then(function (r) { return r.json(); })
              .then(function (w) { WORLD = w; return w; })
              .catch(function () { WORLD_LOADING = null; return null; });
          }
          return WORLD_LOADING;
        }

        function mapCounts(S) {
          var by = {}, split = {};
          function add(cc, n, part) {
            if (!cc || cc === '??' || cc === 'ZZ') cc = '??';
            by[cc] = (by[cc] || 0) + n;
            if (!split[cc]) split[cc] = { a: 0, b: 0 };
            split[cc][part] += n;
          }
          M.store.forEach(function (r) {
            if (!S.inR(r.day)) return;
            if (ctl.platform === 'ios' && r.source !== 'apple') return;
            if (ctl.platform === 'android' && r.source !== 'google') return;
            if (ctl.platform === 'unknown') return;
            add(String(r.country || '').toUpperCase(), r.n, r.source === 'apple' ? 'a' : 'b');
          });
          return { by: by, split: split };
        }

        function mapBox(p, S) {
          var data = mapCounts(S);
          var total = 0, places = 0;
          Object.keys(data.by).forEach(function (k) { total += data.by[k]; if (k !== '??') places++; });

          var c = card(p, 'Installs around the world',
            total ? fmtN(total) + ' ' + plural(total, 'download') + ' · ' + places + ' ' + plural(places, 'country', 'countries') : '');

          var tools = el('div', 'map-tools');
          tools.appendChild(segmented([['world', 'World'], ['me', 'Middle East'], ['eu', 'Europe'], ['am', 'Americas'], ['as', 'Asia'], ['af', 'Africa']], ui.mapRegion, function (v) { ui.mapRegion = v; renderActive(); }, 'Region'));
          c.appendChild(tools);

          if (!M.store.length) {
            c.appendChild(el('p', 'said', 'Store downloads are not connected yet.'));
          } else if (!total) {
            c.appendChild(el('p', 'said', 'None in this range.'));
          }

          var wrap = el('div', 'map-wrap');
          c.appendChild(wrap);
          var listBox = el('div');
          listBox.style.marginTop = '14px';
          c.appendChild(listBox);

          var max = 0;
          Object.keys(data.by).forEach(function (k) { if (k !== '??' && data.by[k] > max) max = data.by[k]; });
          var partA = 'App Store', partB = 'Google Play';

          function tipFor(cc) {
            var n = data.by[cc] || 0, sp = data.split[cc] || { a: 0, b: 0 };
            var rows = [{ value: fmtN(n), label: (n ? pctS(n, total) + ' of all' : 'none in this range') }];
            if (n && ctl.platform === 'all') {
              rows.push({ color: 'var(--ios)', value: fmtN(sp.a), label: partA });
              rows.push({ color: 'var(--android)', value: fmtN(sp.b), label: partB });
            }
            return { title: countryName(cc), rows: rows };
          }

          var paths = {};
          function pick(cc) {
            ui.mapPick = ui.mapPick === cc ? null : cc;
            Object.keys(paths).forEach(function (k) { paths[k].classList.toggle('on', k === ui.mapPick); });
          }

          loadWorld().then(function (w) {
            if (!w) { wrap.appendChild(el('p', 'said', 'The map did not load.')); return; }
            var vb = ui.mapRegion !== 'world' && w.r[ui.mapRegion] ? w.r[ui.mapRegion] : [0, 0, w.w, w.h];
            var root = svg('svg', { viewBox: vb.join(' '), class: 'map', role: 'img',
              'aria-label': 'Map of store downloads by country' });
            Object.keys(w.c).forEach(function (cc) {
              var n = data.by[cc] || 0;
              var path = svg('path', { d: w.c[cc] });
              /* Square root, so one big country does not wash every other one out. */
              path.style.fill = n ? 'var(--accent)' : 'var(--raised)';
              if (n) path.style.fillOpacity = String(0.28 + 0.72 * Math.sqrt(n / max));
              if (cc === ui.mapPick) path.classList.add('on');
              bindTip(path, function () { return tipFor(cc); });
              path.addEventListener('click', function () { pick(cc); });
              paths[cc] = path;
              root.appendChild(path);
            });
            wrap.appendChild(root);
            var sc = el('div', 'map-scale');
            sc.appendChild(el('i', 'zero'));
            sc.appendChild(el('span', null, 'none'));
            [0.35, 0.65, 1].forEach(function (o) { var i = el('i'); i.style.opacity = String(o); sc.appendChild(i); });
            sc.appendChild(el('span', null, max ? 'up to ' + fmtN(max) : ''));
            wrap.appendChild(sc);
          });

          var keys = Object.keys(data.by).sort(function (a, b) { return data.by[b] - data.by[a]; });
          if (keys.length) {
            hbars(listBox, keys.slice(0, 12).map(function (cc) {
              var sp = data.split[cc] || { a: 0, b: 0 };
              return {
                label: cc === '??' ? 'Unknown' : countryName(cc), value: data.by[cc], sub: pctS(data.by[cc], total),
                title: ctl.platform === 'all' ? partA + ' ' + sp.a + ' · ' + partB + ' ' + sp.b : null,
                onClick: cc === '??' ? null : function () { pick(cc); },
              };
            }));
          }
        }

        function funnelBox(box, users) {
          if (!users.length) { box.appendChild(el('p', 'empty', 'Nobody joined in this range.')); return; }
          var steps = funnelOf(users);
          var top = steps[0].people;
          var worst = worstStep(steps);
          steps.forEach(function (s, i) {
            if (i > 0) {
              var prev = steps[i - 1].people, lost = prev - s.people;
              if (lost > 0) {
                var g = el('div', 'gap' + (i === worst ? ' worst' : ''));
                g.appendChild(el('b', null, '−' + lost));
                g.appendChild(el('span', null, pct(lost, prev) + '% drop'));
                box.appendChild(g);
              }
            }
            var rung = el('div', 'rung');
            var r = el('div', 'row');
            r.appendChild(el('span', 'nm', s.stage));
            if (ctl.platform === 'all' && top) {
              r.appendChild(el('span', 'split', 'iPhone ' + s.by.ios + ' · Android ' + s.by.android + (s.by.unknown ? ' · Unknown ' + s.by.unknown : '')));
            }
            r.appendChild(el('span', 'n', fmtN(s.people)));
            r.appendChild(el('span', 'pc', pctS(s.people, top)));
            rung.appendChild(r);
            var track = el('div', 'track');
            var fill = el('i');
            fill.style.width = (top ? (s.people / top) * 100 : 0) + '%';
            track.appendChild(fill);
            rung.appendChild(track);
            box.appendChild(rung);
          });
        }

        function storeBox(p, S) {
          var c = card(p, 'Store downloads');
          if (!M.store.length) {
            c.appendChild(el('p', 'said', 'Not connected yet. The App Store needs a vendor number; Google Play needs a service account.'));
            var sync = M.storeSync || [];
            if (sync.length) {
              c.appendChild(el('p', 'said', sync.map(function (s) {
                var who = s.source === 'apple' ? 'App Store' : 'Play';
                if (s.last_error) return who + ': failing — ' + s.last_error;
                if (!s.last_ok_at) return who + ': never succeeded';
                return who + ': last ok ' + dayLabelY(Math.floor(parseT(s.last_ok_at) / DAY));
              }).join('  ·  ')));
            }
            return;
          }
          var mode = autoMode(S.len);
          var B = buckets(S.start, S.end, mode);
          var apple = zeros(B.list.length), google = zeros(B.list.length);
          var countries = {};
          M.store.forEach(function (r) {
            var i = B.index(r.day);
            if (i < 0) return;
            if (r.source === 'apple') apple[i] += r.n; else google[i] += r.n;
            countries[r.country] = (countries[r.country] || 0) + r.n;
          });
          plot(c, {
            buckets: B.list,
            series: [{ name: 'App Store', color: 'var(--ios)', values: apple, keep: true }, { name: 'Google Play', color: 'var(--android)', values: google, keep: true }],
            label: 'Store downloads',
          });
          var top = Object.keys(countries).sort(function (a, b) { return countries[b] - countries[a]; }).slice(0, 10);
          if (top.length) {
            var g = el('div', 'grp');
            g.style.marginTop = '14px';
            g.appendChild(el('div', 'gh', 'Countries'));
            c.appendChild(g);
            hbars(g, top.map(function (cc) { return { label: countryName(cc), value: countries[cc] }; }));
          }
        }

        /* =================================================================
           3. Activity
           ================================================================= */

        function rActivity(p, S) {
          var mode = autoMode(S.len);
          var B = buckets(S.start, S.end, mode);
          var n = B.list.length;
          var done = doneIn(S);

          /* Active trainers: distinct people per bucket, plus a 7-day rolling mean of the daily count. */
          var sets = [];
          for (var i = 0; i < n; i++) sets.push(new Set());
          done.forEach(function (s) { sets[B.index(s.fDay)].add(s.u); });
          var counts = sets.map(function (s) { return s.size; });
          var lines = [{ name: mode === 'week' ? 'Active per week' : 'Active per day', color: 'var(--accent)', values: counts, width: 1.4, opacity: mode === 'week' ? 1 : 0.55 }];
          if (mode === 'day') {
            var daily = new Map();
            S.sessions.forEach(function (s) {
              if (!s.done || s.fDay < S.start - 6 || s.fDay > S.end) return;
              var set = daily.get(s.fDay);
              if (!set) { set = new Set(); daily.set(s.fDay, set); }
              set.add(s.u);
            });
            var roll = [];
            for (i = 0; i < n; i++) {
              var t = 0;
              for (var d = B.list[i].a - 6; d <= B.list[i].a; d++) { var st = daily.get(d); t += st ? st.size : 0; }
              roll.push(Math.round((t / 7) * 10) / 10);
            }
            lines.push({ name: '7-day average', color: 'var(--text)', values: roll, width: 2, opacity: 0.75, fmt: fmt1 });
          }
          var c1 = card(p, 'Active trainers', 'people who finished a workout');
          plot(c1, { buckets: B.list, lines: lines, label: 'Active trainers over time' });

          var byKind = KGROUPS.map(function () { return zeros(n); });
          done.forEach(function (s) { byKind[s.kg][B.index(s.fDay)]++; });
          var c2 = card(p, 'Workouts finished', fmtN(done.length) + ' in range');
          plot(c2, {
            buckets: B.list,
            series: KGROUPS.map(function (g, j) { return { name: g.name, color: g.color, values: byKind[j] }; }),
            label: 'Workouts finished by kind',
          });

          var c3 = card(p, 'When people train', tzShort());
          if (!done.length) c3.appendChild(el('p', 'empty', 'No workouts in this range.'));
          else heatmap(c3, heatOf(done), { label: 'Workouts by weekday and hour' });

          var r1 = row(p);
          var c4 = card(r1, 'Workout length', 'active minutes');
          var LB = [[15, '<15'], [30, '15–30'], [45, '30–45'], [60, '45–60'], [75, '60–75'], [90, '75–90'], [120, '90–120'], [Infinity, '120+']];
          var lh = zeros(LB.length);
          var withMins = 0;
          done.forEach(function (s) {
            if (s.mins == null) return;
            withMins++;
            for (var j = 0; j < LB.length; j++) if (s.mins < LB[j][0]) { lh[j]++; break; }
          });
          if (!withMins) c4.appendChild(el('p', 'empty', 'No timed workouts in this range.'));
          else plot(c4, {
            buckets: LB.map(function (b) { return { label: b[1] + ' min', short: b[1] }; }),
            series: [{ name: 'Workouts', color: 'var(--accent)', values: lh }],
            height: 180, label: 'Workout length histogram',
          });

          var c5 = card(r1, 'Sets per workout');
          var SB = [[1, '0'], [6, '1–5'], [11, '6–10'], [16, '11–15'], [21, '16–20'], [26, '21–25'], [31, '26–30'], [Infinity, '31+']];
          var sh = zeros(SB.length);
          done.forEach(function (s) { for (var j = 0; j < SB.length; j++) if (s.sets < SB[j][0]) { sh[j]++; break; } });
          if (!done.length) c5.appendChild(el('p', 'empty', 'No workouts in this range.'));
          else plot(c5, {
            buckets: SB.map(function (b) { return { label: b[1] + ' sets', short: b[1] }; }),
            series: [{ name: 'Workouts', color: 'var(--accent)', values: sh }],
            height: 180, label: 'Sets per workout histogram',
          });

          var r2 = row(p);
          var c6 = card(r2, 'What happens to started workouts', 'started in range');
          var flow = { finished: 0, abandoned: 0, lost: 0, discarded: 0, open: 0 };
          S.sessions.forEach(function (s) {
            if (!S.inR(s.sDay)) return;
            if (s.done) flow.finished++;
            else if (s.lost) flow.lost++;
            else if (s.discarded) flow.discarded++;
            else if (s.abandoned) flow.abandoned++;
            else if (s.open) flow.open++;
          });
          var FL = [
            ['finished', 'Finished', 'var(--accent)'],
            ['abandoned', 'Abandoned (open > 24h)', 'var(--k4)'],
            ['lost', 'Lost (deleted with sets)', 'var(--bad)'],
            ['discarded', 'Discarded empty', 'var(--other)'],
            ['open', 'In progress now', 'var(--k3)'],
          ];
          var started = sum(FL.map(function (f) { return flow[f[0]]; }));
          if (!started) c6.appendChild(el('p', 'empty', 'No workouts started in this range.'));
          else {
            var bar = el('div', 'flow');
            FL.forEach(function (f) {
              if (!flow[f[0]]) return;
              var seg = el('i');
              seg.style.width = (flow[f[0]] / started) * 100 + '%';
              seg.style.background = f[2];
              bindTip(seg, function () { return { title: f[1], rows: [{ color: f[2], value: fmtN(flow[f[0]]), label: pctS(flow[f[0]], started) }] }; });
              bar.appendChild(seg);
            });
            c6.appendChild(bar);
            hbars(c6, FL.filter(function (f) { return flow[f[0]] || f[0] === 'finished'; }).map(function (f) {
              return { label: f[1], value: flow[f[0]], sub: pctS(flow[f[0]], started), color: f[2] };
            }), { max: started });
          }

          var c7 = card(r2, 'Last workout', 'accounts, as of range end');
          var RB = [['≤ 7 days', 0, 7], ['8–14 days', 8, 14], ['15–30 days', 15, 30], ['30+ days', 31, Infinity]];
          var pool = S.users.filter(function (u) { return u.cDay != null && u.cDay <= S.end; });
          var lastBy = new Map();
          S.sessions.forEach(function (s) {
            if (!s.done || s.fDay > S.end) return;
            var prev = lastBy.get(s.u);
            if (prev == null || s.fDay > prev) lastBy.set(s.u, s.fDay);
          });
          var rows = RB.map(function (b) {
            var test = function (u) { var l = lastBy.get(u); if (l == null) return false; var a = S.end - l; return a >= b[1] && a <= b[2]; };
            var cnt = pool.filter(test).length;
            return { label: b[0], value: cnt, sub: pctS(cnt, pool.length), onClick: function () { goPeople({ label: 'Last workout ' + b[0] + ' before ' + dayLabel(S.end), test: test }); } };
          });
          var never = function (u) { return !lastBy.has(u); };
          var nv = pool.filter(never).length;
          rows.push({ label: 'Never', value: nv, sub: pctS(nv, pool.length), color: 'var(--other)', onClick: function () { goPeople({ label: 'Never finished a workout', test: never }); } });
          hbars(c7, rows, { max: Math.max(1, pool.length) });
        }

        /* =================================================================
           4. Training
           ================================================================= */

        function rTraining(p, S) {
          var c = card(p, 'Top exercises', 'all time · all accounts');
          var tool = el('div', 'tool');
          var q = el('input');
          q.type = 'search'; q.placeholder = 'Search exercises'; q.value = ui.exQuery;
          q.setAttribute('aria-label', 'Search exercises');
          tool.appendChild(q);
          var count = el('span', 'count num');
          tool.appendChild(count);
          c.appendChild(tool);
          var tb = el('div', 'tablebox');
          c.appendChild(tb);
          var moreBox = el('div', 'more');
          c.appendChild(moreBox);
          var COLS = [
            { key: 'name', name: 'Exercise', get: function (r) { return r.name.toLowerCase(); } },
            { key: 'sets', name: 'Sets', n: true, get: function (r) { return r.sets; } },
            { key: 'people', name: 'People', n: true, get: function (r) { return r.people; } },
            { key: 'workouts', name: 'Workouts', n: true, get: function (r) { return r.workouts; } },
            { key: 'last', name: 'Last done', n: true, get: function (r) { return r.last || 0; } },
          ];
          var maxSets = Math.max.apply(null, M.exercises.map(function (r) { return r.sets; }).concat([1]));
          function draw() {
            clear(tb); clear(moreBox);
            var qq = ui.exQuery.trim().toLowerCase();
            var rows = M.exercises.filter(function (r) { return !qq || r.name.toLowerCase().indexOf(qq) >= 0 || r.slug.indexOf(qq) >= 0; });
            count.textContent = rows.length + ' of ' + M.exercises.length;
            if (!M.exercises.length) { tb.appendChild(el('p', 'empty', 'No exercises logged yet.')); return; }
            var col = COLS.filter(function (x) { return x.key === ui.exSort.key; })[0] || COLS[1];
            rows.sort(function (a, b) { var x = col.get(a), y = col.get(b); return (x < y ? -1 : x > y ? 1 : 0) * ui.exSort.dir; });
            var all = rows.length;
            if (!ui.exAll && !qq) rows = rows.slice(0, 25);
            if (rows.length < all) {
              var more = el('button', 'refresh', 'Show all ' + all);
              more.type = 'button';
              more.addEventListener('click', function () { ui.exAll = true; draw(); });
              moreBox.appendChild(more);
            }
            tb.appendChild(table(COLS, ui.exSort, rows, function (r) {
              var tr = el('tr');
              var td = el('td');
              td.appendChild(el('span', null, r.name));
              if (/^custom_/.test(r.slug)) td.appendChild(el('span', 'flag', 'own'));
              var bar = el('span', 'exbar');
              bar.style.width = Math.max(1, (r.sets / maxSets) * 100) + '%';
              td.appendChild(bar);
              tr.appendChild(td);
              tr.appendChild(el('td', 'n', fmtN(r.sets)));
              tr.appendChild(el('td', 'n', fmtN(r.people)));
              tr.appendChild(el('td', 'n', fmtN(r.workouts)));
              tr.appendChild(el('td', 'n nowrap', r.last ? dayLabelY(Math.floor(r.last / DAY)) : '—'));
              return tr;
            }, function (key) {
              ui.exSort = { key: key, dir: ui.exSort.key === key ? -ui.exSort.dir : (key === 'name' ? 1 : -1) };
              draw();
            }));
          }
          q.addEventListener('input', function () { ui.exQuery = q.value; draw(); });
          draw();

          var mode = autoMode(S.len);
          var B = buckets(S.start, S.end, mode);
          var done = doneIn(S);
          var vol = zeros(B.list.length);
          done.forEach(function (s) { vol[B.index(s.fDay)] += s.vol / 1000; });
          var c2 = card(p, 'Volume lifted', fmt1(sum(vol)) + ' t in range');
          plot(c2, {
            buckets: B.list, integer: false, yFmt: function (v) { return fmtTick(v) + ' t'; },
            series: [{ name: 'Tonnes', color: 'var(--accent)', values: vol, fmt: function (v) { return fmt1(v) + ' t'; } }],
            label: 'Volume lifted over time',
          });

          var r1 = row(p);
          var c3 = card(r1, 'Set types', 'workouts in range');
          var tot = { sets: 0, warm: 0, drops: 0, fails: 0, rated: 0 }, used = { warm: 0, drops: 0, fails: 0, rated: 0 };
          done.forEach(function (s) {
            tot.sets += s.sets; tot.warm += s.warm; tot.drops += s.drops; tot.fails += s.fails; tot.rated += s.rated;
            if (s.warm) used.warm++; if (s.drops) used.drops++; if (s.fails) used.fails++; if (s.rated) used.rated++;
          });
          if (!done.length) c3.appendChild(el('p', 'empty', 'No workouts in this range.'));
          else {
            hbars(c3, [
              { label: 'Warm-up sets', value: used.warm, display: pctS(used.warm, done.length), sub: fmtN(tot.warm) + ' sets', title: 'Share of workouts with at least one warm-up set' },
              { label: 'Drop sets', value: used.drops, display: pctS(used.drops, done.length), sub: fmtN(tot.drops) + ' sets' },
              { label: 'To failure', value: used.fails, display: pctS(used.fails, done.length), sub: fmtN(tot.fails) + ' sets' },
              { label: 'Effort rated', value: used.rated, display: pctS(used.rated, done.length), sub: pctS(tot.rated, tot.sets) + ' of sets' },
            ], { max: done.length });
            c3.appendChild(el('p', 'said', 'Share of workouts using each'));
            c3.lastChild.style.marginTop = '10px';
          }

          var c4 = card(r1, 'Supersets');
          var withSS = done.filter(function (s) { return s.ss > 0; });
          var ssTiles = el('div', 'tiles');
          c4.appendChild(ssTiles);
          tile(ssTiles, 'Workouts with', pctS(withSS.length, done.length), fmtN(withSS.length) + ' of ' + fmtN(done.length));
          tile(ssTiles, 'Per such workout', withSS.length ? fmt1(sum(withSS.map(function (s) { return s.ss; })) / withSS.length) : '—', 'supersets on average');
          var ssPeople = new Set(withSS.map(function (s) { return s.u; })).size;
          var activePeople = new Set(done.map(function (s) { return s.u; })).size;
          tile(ssTiles, 'People using', pctS(ssPeople, activePeople), fmtN(ssPeople) + ' of ' + fmtN(activePeople) + ' active');

          var c5 = card(p, 'Onboarding answers', 'onboarded accounts created in range');
          var ob = S.joined.filter(function (u) { return u.onboarded != null; });
          if (!ob.length) { c5.appendChild(el('p', 'empty', 'Nobody finished onboarding in this range.')); return; }
          var year = new Date(M.now).getUTCFullYear();
          var Q = [
            ['Goal', function (u) { return label(u.goal); }],
            ['Experience', function (u) { return label(u.exp); }],
            ['Split', function (u) { return label(u.split); }],
            ['Days per week', function (u) { return u.days == null ? 'Not answered' : u.days + ' ' + plural(+u.days, 'day'); }],
            ['Session length', function (u) { return u.minutes == null ? 'Not answered' : u.minutes + ' min'; }],
            ['Units', function (u) { return label(u.units); }],
            ['Sex', function (u) { return label(u.sex); }],
            ['Age', function (u) {
              if (!u.born) return 'Not answered';
              var a = year - u.born;
              return a < 18 ? 'Under 18' : a < 25 ? '18–24' : a < 35 ? '25–34' : a < 45 ? '35–44' : a < 55 ? '45–54' : '55+';
            }],
            ['Warm-ups', function (u) { return u.warmups ? 'On' : 'Off'; }],
            ['Cardio', function (u) { return label(u.cardio || 'off'); }],
          ];
          var groups = el('div', 'groups');
          c5.appendChild(groups);
          var ORDERED = { 'Days per week': true, 'Session length': true, Age: true };
          Q.forEach(function (qq) {
            var cnt = {};
            ob.forEach(function (u) { var v = qq[1](u); cnt[v] = (cnt[v] || 0) + 1; });
            var keys = Object.keys(cnt);
            if (ORDERED[qq[0]]) keys.sort(function (a, b) { return (parseInt(a.replace(/\D+/, ''), 10) || 999) - (parseInt(b.replace(/\D+/, ''), 10) || 999) || (a < b ? -1 : 1); });
            else keys.sort(function (a, b) { return cnt[b] - cnt[a]; });
            var g = el('div', 'grp');
            g.appendChild(el('div', 'gh', qq[0]));
            hbars(g, keys.map(function (kk) {
              return { label: kk, value: cnt[kk], sub: pctS(cnt[kk], ob.length), color: kk === 'Not answered' ? 'var(--other)' : null };
            }), { max: ob.length });
            groups.appendChild(g);
          });
        }

        function table(cols, sortState, rows, makeRow, onSort) {
          var t = el('table');
          var thead = el('thead');
          var hr = el('tr');
          cols.forEach(function (c) {
            var th = el('th', c.n ? 'n' : null);
            th.setAttribute('scope', 'col');
            if (c.sortable === false || !onSort) th.textContent = c.name;
            else {
              var b = el('button', null, c.name);
              b.type = 'button';
              b.addEventListener('click', function () { onSort(c.key); });
              th.appendChild(b);
              if (sortState && sortState.key === c.key) th.setAttribute('aria-sort', sortState.dir > 0 ? 'ascending' : 'descending');
            }
            hr.appendChild(th);
          });
          thead.appendChild(hr);
          t.appendChild(thead);
          var tb = el('tbody');
          rows.forEach(function (r) { tb.appendChild(makeRow(r)); });
          t.appendChild(tb);
          return t;
        }

        /* =================================================================
           5. Features
           ================================================================= */

        function rFeatures(p, S) {
          var base = S.users.filter(function (u) { return u.onboarded != null && u.cDay != null && u.cDay <= S.end; });
          var c = card(p, 'Feature adoption', fmtN(base.length) + ' onboarded accounts that joined by ' + dayLabel(S.end));
          if (!base.length) { c.appendChild(el('p', 'empty', 'No onboarded accounts for these filters.')); return; }
          var rows = FEATURES.map(function (f) {
            var cnt = base.filter(function (u) { return u.feat[f.id]; }).length;
            return { f: f, cnt: cnt };
          }).sort(function (a, b) { return b.cnt - a.cnt; });
          hbars(c, rows.map(function (r) {
            return {
              label: r.f.name, value: r.cnt, display: pctS(r.cnt, base.length), sub: fmtN(r.cnt),
              onClick: function () {
                goPeople({ label: r.f.name, test: function (u) { return u.onboarded != null && u.feat[r.f.id]; } });
              },
            };
          }), { max: base.length });

          var r1 = row(p);
          var c2 = card(r1, 'Features per account');
          var dist = zeros(6);
          base.forEach(function (u) {
            var nf = FEATURES.filter(function (f) { return f.id !== 'warmups' && f.id !== 'cardio' && u.feat[f.id]; }).length;
            dist[Math.min(5, nf)]++;
          });
          plot(c2, {
            buckets: ['0', '1', '2', '3', '4', '5+'].map(function (x) { return { label: x + ' features', short: x }; }),
            series: [{ name: 'Accounts', color: 'var(--accent)', values: dist }],
            height: 170, label: 'Number of features used per account',
          });

          var c3 = card(r1, 'Depth', 'among accounts using it');
          function avg(field) {
            var us = base.filter(function (u) { return u[field] > 0; });
            return us.length ? fmt1(sum(us.map(function (u) { return u[field]; })) / us.length) : '—';
          }
          var tl = el('div', 'tiles');
          c3.appendChild(tl);
          tile(tl, 'Routines', avg('routines'), 'per person');
          tile(tl, 'Folders', avg('folders'), 'per person');
          tile(tl, 'Own exercises', avg('custom'), 'per person');
          tile(tl, 'Exercise notes', avg('xnotes'), 'per person');
        }

        /* =================================================================
           6. Retention
           ================================================================= */

        function rRetention(p, S) {
          var J = S.joined;
          var tiles = el('div', 'tiles');
          p.appendChild(tiles);
          [1, 7, 30].forEach(function (nd) {
            var eligible = J.filter(function (u) { return M.today - u.cDay >= nd; });
            var kept = eligible.filter(function (u) {
              return u.sess.some(function (s) { return s.done && s.fDay - u.cDay >= nd; });
            });
            tile(tiles, 'Day ' + nd, eligible.length ? pct(kept.length, eligible.length) + '%' : '—',
              eligible.length ? fmtN(kept.length) + ' of ' + fmtN(eligible.length) + ' trained on day ' + nd + '+' : 'nobody old enough yet', { lead: nd === 7 });
          });

          var c = card(p, 'Weekly cohorts', '% of each sign-up week that finished a workout in week n');
          if (!J.length) { c.appendChild(el('p', 'empty', 'Nobody joined in this range.')); return; }
          var COLN = 9;
          var cohorts = new Map();
          J.forEach(function (u) {
            var w = weekOf(u.cDay);
            var co = cohorts.get(w);
            if (!co) { co = { w: w, users: 0, cols: [] }; for (var i = 0; i < COLN; i++) co.cols.push(new Set()); cohorts.set(w, co); }
            co.users++;
            u.sess.forEach(function (s) {
              if (!s.done || s.fDay == null) return;
              var off = weekOf(s.fDay) - w;
              if (off < 0) return;
              co.cols[Math.min(off, COLN - 1)].add(u);
            });
          });
          var list = Array.from(cohorts.values()).sort(function (a, b) { return b.w - a.w; });
          var nowW = weekOf(M.today);
          var tb = el('div', 'tablebox');
          var t = el('table', 'cohort');
          var thead = el('thead'), hr = el('tr');
          hr.appendChild(el('th', null, 'Week of'));
          hr.appendChild(el('th', 'n', 'People'));
          for (var i = 0; i < COLN; i++) hr.appendChild(el('th', null, i === COLN - 1 ? (COLN - 1) + '+' : String(i)));
          thead.appendChild(hr); t.appendChild(thead);
          var body = el('tbody');
          list.forEach(function (co) {
            var tr = el('tr');
            tr.appendChild(el('td', null, dayLabelY(weekStart(co.w))));
            tr.appendChild(el('td', 'n', fmtN(co.users)));
            for (var j = 0; j < COLN; j++) {
              var td = el('td');
              if (co.w + j > nowW) { tr.appendChild(td); continue; }
              var cnt = co.cols[j].size;
              var share = cnt / co.users;
              var cell = el('span', 'cell' + (cnt ? '' : ' dim'), cnt ? Math.round(share * 100) + '%' : '0');
              if (cnt) {
                var mix = Math.round(14 + share * 86);
                cell.style.background = 'color-mix(in srgb, var(--accent) ' + mix + '%, transparent)';
                if (mix > 55) cell.style.color = 'var(--on-accent)';
              }
              (function (co2, j2, cnt2) {
                bindTip(cell, function () {
                  return {
                    title: 'Joined week of ' + dayLabel(weekStart(co2.w)) + ' · week ' + (j2 === COLN - 1 ? (COLN - 1) + ' or later' : j2),
                    rows: [{ color: 'var(--accent)', value: fmtN(cnt2) + ' of ' + fmtN(co2.users), label: 'trained' }],
                  };
                });
              }(co, j, cnt));
              td.appendChild(cell);
              tr.appendChild(td);
            }
            body.appendChild(tr);
          });
          t.appendChild(body);
          tb.appendChild(t);
          c.appendChild(tb);
        }

        /* =================================================================
           7. People
           ================================================================= */

        var PCOLS = [
          { key: 'k', name: 'Key', get: function (u) { return u.k; } },
          { key: 'joined', name: 'Joined', get: function (u) { return u.created || 0; } },
          { key: 'platform', name: 'Platform', get: function (u) { return u.platform + (u.build != null ? pad2(u.build) : ''); } },
          { key: 'provider', name: 'Sign-in', get: function (u) { return u.provider; } },
          { key: 'onboarded', name: 'Onboarded', get: function (u) { return u.onboarded ? 1 : 0; } },
          { key: 'workouts', name: 'Workouts', n: true, get: function (u) { return u.nDone; } },
          { key: 'sets', name: 'Sets', n: true, get: function (u) { return u.sets; } },
          { key: 'last', name: 'Last workout', get: function (u) { return u.lastDone || 0; } },
          { key: 'seen', name: 'Last seen', get: function (u) { return u.seen || 0; } },
          { key: 'goal', name: 'Goal', get: function (u) { return u.goal || ''; } },
          { key: 'feat', name: 'Features', get: function (u) { return u.featCount; } },
        ];

        function rPeople(p, S) {
          var c = card(p);
          var tool = el('div', 'tool');
          var q = el('input');
          q.type = 'search'; q.placeholder = 'Search key, goal, platform'; q.value = ui.peopleQuery;
          q.setAttribute('aria-label', 'Search people');
          tool.appendChild(q);
          var trainedIn = new Set();
          S.sessions.forEach(function (s) { if (s.done && S.inR(s.fDay)) trainedIn.add(s.u); });
          var QUICK = {
            all: ['All', function () { return true; }],
            joined: ['Joined in range', function (u) { return S.inR(u.cDay); }],
            trained: ['Trained in range', function (u) { return trainedIn.has(u); }],
            stale: ['No OTA', noOta],
            lost: ['Lost a workout', function (u) { return u.lost > 0; }],
          };
          tool.appendChild(segmented(Object.keys(QUICK).map(function (k) { return [k, QUICK[k][0]]; }), ui.peopleQuick, function (v) {
            ui.peopleQuick = v; ui.peopleLimit = 100; renderActive();
          }, 'Quick filter'));
          if (ui.peopleFilter) {
            var chip = el('span', 'chip', ui.peopleFilter.label);
            var x = el('button', null, '×');
            x.type = 'button';
            x.setAttribute('aria-label', 'Clear filter');
            x.addEventListener('click', function () { ui.peopleFilter = null; renderActive(); });
            chip.appendChild(x);
            tool.appendChild(chip);
          }
          var count = el('span', 'count num');
          tool.appendChild(count);
          c.appendChild(tool);
          var tb = el('div', 'tablebox');
          c.appendChild(tb);
          var moreBox = el('div', 'more');
          c.appendChild(moreBox);

          function draw() {
            clear(tb); clear(moreBox);
            var qq = ui.peopleQuery.trim().toLowerCase();
            var quick = (QUICK[ui.peopleQuick] || QUICK.all)[1];
            var f = ui.peopleFilter;
            var rows = S.users.filter(function (u) {
              if (!quick(u)) return false;
              if (f && !f.test(u)) return false;
              if (!qq) return true;
              return (u.k + ' ' + label(u.goal) + ' ' + PLAT[u.platform].name + ' ' + u.provider + (u.build != null ? ' build ' + u.build : '')).toLowerCase().indexOf(qq) >= 0;
            });
            var col = PCOLS.filter(function (x2) { return x2.key === ui.peopleSort.key; })[0] || PCOLS[1];
            rows.sort(function (a, b) { var x1 = col.get(a), y1 = col.get(b); return (x1 < y1 ? -1 : x1 > y1 ? 1 : 0) * ui.peopleSort.dir; });
            count.textContent = fmtN(rows.length) + ' ' + plural(rows.length, 'account');
            if (!rows.length) { tb.appendChild(el('p', 'empty', 'Nobody matches.')); return; }
            var shown = rows.slice(0, ui.peopleLimit);
            tb.appendChild(table(PCOLS, ui.peopleSort, shown, personRow, function (key) {
              ui.peopleSort = { key: key, dir: ui.peopleSort.key === key ? -ui.peopleSort.dir : (key === 'k' || key === 'goal' || key === 'provider' || key === 'platform' ? 1 : -1) };
              draw();
            }));
            if (rows.length > shown.length) {
              var more = el('button', 'refresh', 'Show ' + Math.min(200, rows.length - shown.length) + ' more');
              more.type = 'button';
              more.addEventListener('click', function () { ui.peopleLimit += 200; draw(); });
              moreBox.appendChild(more);
            }
          }
          q.addEventListener('input', function () { ui.peopleQuery = q.value; ui.peopleLimit = 100; draw(); });
          draw();
        }

        function personRow(u) {
          var tr = el('tr', 'row');
          tr.tabIndex = 0;
          tr.setAttribute('aria-label', 'Account ' + u.k);
          var k = el('td', 'nowrap');
          k.appendChild(el('span', 'key', u.k));
          if (u.x) k.appendChild(el('span', 'flag', 'test'));
          tr.appendChild(k);
          tr.appendChild(el('td', 'nowrap', u.cDay != null ? dayLabelY(u.cDay) : '—'));
          var pl = el('td', 'nowrap');
          var dot = el('i', 'dot'); dot.style.background = PLAT[u.platform].color;
          pl.appendChild(dot);
          pl.appendChild(document.createTextNode(PLAT[u.platform].name + (u.build != null ? ' · ' + u.build : '')));
          if (noOta(u)) { var b = el('span', 'flag warn', 'no OTA'); b.title = 'Build ' + u.build + ' cannot receive over-the-air updates'; pl.appendChild(b); }
          tr.appendChild(pl);
          tr.appendChild(el('td', null, label(u.provider)));
          tr.appendChild(el('td', null, u.onboarded ? 'Yes' : '—'));
          tr.appendChild(el('td', 'n', fmtN(u.nDone)));
          tr.appendChild(el('td', 'n', fmtN(u.sets)));
          tr.appendChild(el('td', 'nowrap', rel(u.ldDay)));
          tr.appendChild(el('td', 'nowrap', rel(u.seenDay)));
          tr.appendChild(el('td', 'nowrap', u.goal ? label(u.goal) : '—'));
          var fe = el('td');
          fe.appendChild(featIcons(u));
          tr.appendChild(fe);
          tr.addEventListener('click', function () { openDrawer(u, tr); });
          tr.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openDrawer(u, tr); }
          });
          return tr;
        }

        var drawerReturn = null;
        function openDrawer(u, from) {
          drawerReturn = from || document.activeElement;
          $('drawer-title').textContent = 'Account ' + u.k;
          var body = clear($('drawer-body'));
          $('scrim').hidden = false;
          $('drawer').hidden = false;

          var dl = el('dl', 'facts');
          function fact(k, v) { dl.appendChild(el('dt', null, k)); var dd = el('dd', null, v); dl.appendChild(dd); return dd; }
          fact('Joined', u.cDay != null ? dayLabelY(u.cDay) : '—');
          var pd = fact('Platform', PLAT[u.platform].name + (u.build != null ? ' · build ' + u.build + ' (' + buildVersion(u.build) + ')' : ''));
          if (noOta(u)) pd.appendChild(el('span', 'flag warn', 'no OTA'));
          fact('Sign-in', label(u.provider));
          fact('Onboarded', u.onboarded ? dayLabelY(Math.floor(u.onboarded / DAY)) : 'No');
          fact('Last seen', rel(u.seenDay));
          fact('Workouts', fmtN(u.nDone) + ' finished · ' + fmtN(u.sets) + ' sets · ' + fmt1(u.vol / 1000) + ' t');
          if (u.lost || u.abandoned) fact('Problems', (u.lost ? u.lost + ' lost' : '') + (u.lost && u.abandoned ? ' · ' : '') + (u.abandoned ? u.abandoned + ' abandoned' : ''));
          if (u.onboarded) {
            fact('Plan', [label(u.goal), label(u.exp), label(u.split)].join(' · '));
            fact('Schedule', (u.days != null ? u.days + ' days/week' : '—') + ' · ' + (u.minutes != null ? u.minutes + ' min' : '—') + ' · ' + label(u.units));
            if (u.heard) fact('Heard via', String(u.heard).split(',').map(function (s) { s = s.trim(); return SOURCE_NAMES[s] || label(s); }).join(', '));
          }
          var fl = FEATURES.filter(function (f) { return u.feat[f.id]; }).map(function (f) { return f.name; });
          fact('Features', fl.length ? fl.join(', ') : 'none yet');
          fact('Counts', u.routines + ' routines · ' + u.folders + ' folders · ' + u.custom + ' own exercises · ' + u.xnotes + ' notes');
          body.appendChild(dl);

          /* Weekly activity over the account's life. */
          var startW = weekOf(u.cDay != null ? u.cDay : M.today);
          var endW = weekOf(M.today);
          if (endW - startW > 103) startW = endW - 103;
          var wb = [];
          for (var w = startW; w <= endW; w++) wb.push({ label: 'Week of ' + dayLabelY(weekStart(w)), short: dayLabel(weekStart(w)) });
          var wv = zeros(wb.length);
          u.sess.forEach(function (s) { if (s.done && s.fDay != null) { var i = weekOf(s.fDay) - startW; if (i >= 0 && i < wv.length) wv[i]++; } });
          if (u.nDone) {
            var chartBox = el('div', 'grp');
            chartBox.appendChild(el('div', 'gh', 'Workouts per week'));
            body.appendChild(chartBox);
            plot(chartBox, { buckets: wb, series: [{ name: 'Workouts', color: 'var(--accent)', values: wv }], height: 120, label: 'Workouts per week' });
          }

          var list = u.sess.slice().reverse();
          var tl = el('ul', 'tl');
          if (!list.length) body.appendChild(el('p', 'empty', 'No workouts yet.'));
          list.slice(0, 300).forEach(function (s) {
            var li = el('li');
            li.appendChild(el('span', 'when', s.tDay != null ? dayLabelY(s.tDay) : '—'));
            var what = el('span', 'what', label(s.kind) + (s.interval ? ' (timer)' : ''));
            if (s.lost) what.appendChild(el('span', 'flag bad', 'lost'));
            else if (s.abandoned) what.appendChild(el('span', 'flag warn', 'abandoned'));
            else if (s.open) what.appendChild(el('span', 'flag', 'in progress'));
            else if (s.discarded) what.appendChild(el('span', 'flag', 'discarded'));
            else if (!s.done && s.started == null) what.appendChild(el('span', 'flag', 'planned'));
            if (s.deleted && s.done) what.appendChild(el('span', 'flag', 'deleted'));
            li.appendChild(what);
            var bits = [];
            if (s.mins != null) bits.push(Math.round(s.mins) + ' min');
            bits.push(s.sets + ' sets');
            if (s.vol) bits.push(fmtN(s.vol) + ' kg');
            li.appendChild(el('span', 'nums', bits.join(' · ')));
            tl.appendChild(li);
          });
          if (list.length) body.appendChild(tl);
          $('drawer-close').focus();
        }
        function closeDrawer() {
          if ($('drawer').hidden) return;
          $('drawer').hidden = true;
          $('scrim').hidden = true;
          tipHide();
          if (drawerReturn && drawerReturn.focus && document.body.contains(drawerReturn)) drawerReturn.focus();
        }
        $('drawer-close').addEventListener('click', closeDrawer);
        $('scrim').addEventListener('click', closeDrawer);
        document.addEventListener('keydown', function (ev) {
          if ($('drawer').hidden) return;
          if (ev.key === 'Escape') { ev.preventDefault(); closeDrawer(); return; }
          if (ev.key === 'Tab') {
            var f = $('drawer').querySelectorAll('button, [href], input, select, [tabindex]:not([tabindex="-1"])');
            if (!f.length) return;
            var first = f[0], last = f[f.length - 1];
            if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
            else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
          }
        });

        /* =================================================================
           8. Health
           ================================================================= */

        function rHealth(p, S) {
          var r1 = row(p);
          var ios = S.users.filter(function (u) { return u.platform === 'ios'; });
          var c1 = card(r1, 'iPhone builds', 'builds 13+ get over-the-air updates');
          if (!ios.length) c1.appendChild(el('p', 'empty', 'No iPhone accounts for these filters.'));
          else {
            var bc = {};
            ios.forEach(function (u) { var b = u.build == null ? 'none' : String(u.build); bc[b] = (bc[b] || 0) + 1; });
            var keys = Object.keys(bc).sort(function (a, b) { return (b === 'none' ? -1 : +b) - (a === 'none' ? -1 : +a); });
            hbars(c1, keys.map(function (b) {
              var bn = b === 'none' ? null : +b;
              var ok = bn != null && bn >= OTA_MIN_BUILD;
              return {
                label: bn == null ? 'Unknown build' : 'Build ' + bn + ' · ' + buildVersion(bn),
                value: bc[b], sub: bn == null ? '' : ok ? 'OTA' : 'no OTA',
                color: bn == null ? 'var(--other)' : ok ? 'var(--accent)' : 'var(--warn)',
                onClick: bn == null ? null : function () { goPeople({ label: 'iPhone build ' + bn, test: function (u) { return u.platform === 'ios' && u.build === bn; } }); },
              };
            }), { max: ios.length });
          }

          var c2 = card(r1, 'Data safety', 'lost = deleted with sets, never finished');
          var stuck = S.sessions.filter(function (s) { return s.abandoned; }).sort(function (a, b) { return b.started - a.started; });
          var lostAll = S.sessions.filter(function (s) { return s.lost; });
          var after = lostAll.filter(function (s) { return s.dDay >= FIX_DAY; }).length;
          var tl = el('div', 'tiles');
          c2.appendChild(tl);
          tile(tl, 'Lost since 5 Oct', fmtN(after), 'after 0.3.1', { lead: after === 0 });
          tile(tl, 'Lost before', fmtN(lostAll.length - after), 'all time');
          tile(tl, 'Stuck > 24h', fmtN(stuck.length), 'open, never finished');

          /* Lost per week: at least twelve weeks, so the 0.3.1 line has a before and after. */
          var start2 = Math.min(S.start, M.today - 83);
          var B = buckets(start2, S.end, 'week');
          var lv = zeros(B.list.length);
          lostAll.forEach(function (s) { var i = B.index(s.dDay); if (i >= 0) lv[i]++; });
          var c3 = card(p, 'Lost in-progress workouts per week', start2 < S.start ? 'last 12 weeks' : null);
          var fixAt = B.index(FIX_DAY);
          plot(c3, {
            buckets: B.list,
            series: [{ name: 'Lost', color: 'var(--bad)', values: lv }],
            markers: fixAt >= 0 ? [{ at: fixAt, label: '0.3.1', edge: true }] : [],
            height: 180, label: 'Lost workouts per week',
          });

          if (stuck.length) {
            var c4 = card(p, 'Stuck in progress', 'started more than 24 hours ago, not finished, not deleted');
            var tb = el('div', 'tablebox');
            tb.appendChild(table([
              { key: 'k', name: 'Account' }, { key: 's', name: 'Started' }, { key: 'kind', name: 'Kind' }, { key: 'sets', name: 'Sets', n: true },
            ], null, stuck.slice(0, 25), function (s) {
              var tr = el('tr', 'row');
              tr.tabIndex = 0;
              var td = el('td'); td.appendChild(el('span', 'key', s.u.k)); tr.appendChild(td);
              tr.appendChild(el('td', 'nowrap', dayLabelY(s.sDay)));
              tr.appendChild(el('td', null, label(s.kind)));
