<!doctype html>
<!--
  The dashboard.

  This file is served from GitHub Pages, so it is public and must behave as
  though a stranger has it open — because one can. Nothing here is a secret:
  the only key in the page is the publishable key that already ships inside
  the Android and iOS apps, and every number on screen arrives from the
  `stats` edge function, which checks the caller's token against a list of
  admins before the service role touches anything.

  So the worst a stranger can do with this file is look at a sign-in form.

  No Supabase client library, and not to save bytes. The site self-hosts its
  typeface rather than asking Google for it, on the grounds that a page which
  ships the reader's address to a third party in order to render itself is a
  page that contradicts the policy beside it. Two `fetch` calls do everything
  a library would do here, so there is no reason to make an exception.

  The same rule decides how the charts are drawn. A charting library from a
  CDN would tell that CDN every time this page opened, so every chart below is
  a few lines of hand-built SVG and every number is computed in this browser.
  The function sends raw rows under `v2` — one per account, under a
  six-character pseudonym with no email or name, and one per workout — and the
  page does the counting. That is what makes the filters instant: changing the
  date range, platform, test-account switch or time zone is a re-render, not a
  round trip, and nothing about the reader's choices leaves the page except as
  a value in this browser's own storage.

  Demo mode (`?demo`) renders a synthetic dataset generated in the page, so
  the layout can be worked on without signing in. It only switches on when
  the page is served from localhost; on the real domain the parameter is
  ignored and the sign-in form is all anybody sees.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grasp — dashboard</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Private dashboard for Grasp." />
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <script src="theme.js"></script>
    <style>
      /*
        Everything below is the dashboard's own. The palette, the typeface and
        the page furniture all come from style.css, so this file only adds the
        shapes that do not exist anywhere else on the site — plus the chart
        colours, which nothing else on the site needs.

        iPhone and Android are blue and orange: the pair stays apart under
        every common colour-vision deficiency in both themes. Workout kinds
        lead with the accent and keep adjacent stack colours distinguishable.
      */
      :root {
        --ios: #2a78d6;
        --android: #cc5f28;
        --other: #9aa0a6;
        --k2: #e87ba4;
        --k3: #4a3aa7;
        --k4: #eda100;
        --k5: #1baf7a;
        --bad: #c2333a;
        --warn: #8f5600;
        --warn-bg: #fbeed3;
        --shadow: rgba(13, 14, 16, 0.12);
        --up: #16803c;
        --up-soft: rgba(22, 128, 60, 0.1);
        --down: #c62f35;
        --down-soft: rgba(198, 47, 53, 0.09);
        --keep: #9cbc4a;
        --back: #6250d6;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --ios: #3987e5;
          --android: #d95926;
          --other: #5c6168;
          --k2: #d55181;
          --k3: #9085e9;
          --k4: #c98500;
          --k5: #199e70;
          --bad: #ff5a5f;
          --warn: #f0b24a;
          --warn-bg: #2e2410;
          --shadow: rgba(0, 0, 0, 0.45);
          --up: #4ade80;
          --up-soft: rgba(74, 222, 128, 0.13);
          --down: #ff6b70;
          --down-soft: rgba(255, 90, 95, 0.13);
          --keep: #7fa33a;
          --back: #b9acff;
        }
      }
      :root[data-theme='dark'] {
        --ios: #3987e5;
        --android: #d95926;
        --other: #5c6168;
        --k2: #d55181;
        --k3: #9085e9;
        --k4: #c98500;
        --k5: #199e70;
        --bad: #ff5a5f;
        --warn: #f0b24a;
        --warn-bg: #2e2410;
        --shadow: rgba(0, 0, 0, 0.45);
        --up: #4ade80;
        --up-soft: rgba(74, 222, 128, 0.13);
        --down: #ff6b70;
        --down-soft: rgba(255, 90, 95, 0.13);
        --keep: #7fa33a;
        --back: #b9acff;
      }

      /*
        `hidden` has to win. Every panel below sets a `display`, and a class
        that sets one beats the attribute on specificity alone — which showed
        as the whole empty dashboard rendering underneath the sign-in form.
      */
      [hidden] { display: none !important; }

      .num, td.n, th.n { font-variant-numeric: tabular-nums; }
      .dash li, .drawer li { margin-bottom: 0; }

      .dash { display: flex; flex-direction: column; gap: 14px; }

      .dashhead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-top: 6px; }
      .dashhead h1 { margin: 0; font-size: 1.6rem; }
      .demo {
        font-size: 0.66rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
        background: var(--warn-bg); color: var(--warn);
        border-radius: 999px; padding: 3px 10px;
      }
      .asof {
        margin-inline-start: auto;
        display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px;
        color: var(--faint); font-size: 0.82rem;
      }
      .refresh {
        font: inherit; font-size: 0.82rem;
        background: var(--surface); color: var(--text);
        border: 1px solid var(--border); border-radius: 999px;
        padding: 5px 13px; cursor: pointer;
      }
      .refresh:hover { border-color: var(--border-strong); }
      .refresh[disabled] { opacity: 0.55; cursor: default; }

      button:focus-visible, select:focus-visible, input:focus-visible,
      [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* ---- sign in ---- */

      .gate {
        max-width: 25rem; margin: 6vh auto 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 26px;
        display: flex; flex-direction: column; gap: 14px;
      }
      .gate h1 { margin: 0; font-size: 1.25rem; }
      .gate p { margin: 0; color: var(--muted); font-size: 0.9rem; }
      .gate label { display: flex; flex-direction: column; gap: 5px; font-size: 0.84rem; color: var(--muted); }
      .gate input {
        font: inherit;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 12px;
      }
      .gate input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .gate button[type='submit'] {
        font: inherit; font-weight: 600;
        background: var(--accent); color: var(--on-accent);
        border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer;
      }
      .gate button[type='submit'][disabled] { opacity: 0.6; cursor: default; }

      .problem {
        background: var(--raised);
        border-inline-start: 3px solid var(--bad);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 0.85rem;
        color: var(--text);
      }

      /* ---- control bar and tabs ---- */

      /*
        Sticky on anything wider than a phone. On a phone the bar wraps to
        three rows, and three rows pinned over a 640px-tall screen leave too
        little to read, so there it scrolls away with the page.
      */
      .controls {
        position: sticky; top: 0; z-index: 20;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        margin: 0 -24px; padding: 10px 24px 0;
      }
      .ctl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 0.8rem; }
      .seg {
        display: inline-flex; flex-wrap: wrap;
        border: 1px solid var(--border); border-radius: 999px;
        background: var(--surface); padding: 2px;
      }
      .seg button {
        font: inherit; font-size: 0.8rem; line-height: 1.3;
        border: 0; background: transparent; color: var(--muted);
        padding: 4px 11px; border-radius: 999px; cursor: pointer;
      }
      .seg button:hover { color: var(--text); }
      .seg button[aria-pressed='true'] {
        background: var(--bg); color: var(--text);
        box-shadow: inset 0 0 0 1px var(--border-strong);
      }
      .ctl-row select, .ctl-row input[type='date'], .tool input[type='search'], .tool select {
        font: inherit; font-size: 0.8rem;
        background: var(--surface); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 4px 8px;
      }
      .custom { display: inline-flex; align-items: center; gap: 6px; color: var(--faint); }
      .check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
      .check input { accent-color: var(--accent); margin: 0; }
      .tz { display: inline-flex; align-items: center; gap: 6px; color: var(--faint); }
      .tz select { max-width: 13rem; }
      .span { color: var(--faint); margin-inline-start: auto; white-space: nowrap; }

      .tabs {
        display: flex; gap: 2px; margin-top: 8px;
        overflow-x: auto; scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tabs button {
        font: inherit; font-size: 0.86rem;
        padding: 7px 11px 8px; border: 0; background: none;
        color: var(--muted); white-space: nowrap; cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      .tabs button:hover { color: var(--text); }
      .tabs button[aria-selected='true'] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
      .tabs button:focus-visible { outline-offset: -2px; }

      .panel { display: flex; flex-direction: column; gap: 16px; padding-top: 8px; }
      .panel:focus { outline: none; }

      /* ---- cards and furniture ---- */

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        min-width: 0;
      }
      .ch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 12px; }
      .ch h3 { margin: 0; font-size: 0.95rem; font-weight: 600; }
      .ch .note { color: var(--faint); font-size: 0.78rem; }
      .ch .end { margin-inline-start: auto; }
      /* ---- world map ---- */
      .map-wrap { position: relative; }
      .map { display: block; width: 100%; height: auto; max-height: 480px; touch-action: manipulation; }
      .map path { stroke: var(--bg); stroke-width: 0.4; vector-effect: non-scaling-stroke; transition: fill-opacity 0.15s; }
      .map path.on { stroke: var(--text); stroke-width: 1.4; }
      .map-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
      .map-scale { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--faint); margin-top: 8px; }
      .map-scale i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; background: var(--accent); }
      .map-scale i.zero { background: var(--raised); }
      .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
      .trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-items: start; }
      .empty { margin: 0; color: var(--faint); font-size: 0.86rem; padding: 18px 0; text-align: center; }
      .said { margin: 0; color: var(--faint); font-size: 0.8rem; }

      /* ---- KPI tiles ---- */

      .tiles {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }
      .tile {
        background: var(--surface);
        border: 1px solid var(--border); border-radius: 12px;
        padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
      }
      .tile .k { font-size: 0.68rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); }
      .tile .v { font-size: 1.7rem; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
      .tile .v small { font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-inline-start: 3px; }
      .tile .d { font-size: 0.76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
      .tile .d.up::before { content: '▲ '; font-size: 0.65rem; }
      .tile .d.down::before { content: '▼ '; font-size: 0.65rem; }
      .tile.lead .v { color: var(--accent); }
      .spark { display: block; width: 100%; height: 30px; margin-top: 6px; }

      .insights { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
      .insights li { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: baseline; font-size: 0.9rem; }
      .insights li::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); transform: translateY(-1px); }
      .insights li.warn::before { background: var(--warn); }

      /* ---- funnel ---- */

      .rung { padding: 8px 0; display: flex; flex-direction: column; gap: 5px; }
      .rung .row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
      .rung .nm { font-weight: 600; font-size: 0.88rem; }
      .rung .split { font-size: 0.74rem; color: var(--faint); font-variant-numeric: tabular-nums; }
      .rung .n { margin-inline-start: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
      .rung .pc { color: var(--faint); font-size: 0.78rem; font-variant-numeric: tabular-nums; min-width: 4ch; text-align: end; }
      .track { height: 10px; background: var(--raised); border-radius: 3px; overflow: hidden; }
      .track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
      .gap {
        display: flex; align-items: center; gap: 8px;
        margin-inline-start: 5px; padding: 2px 0 2px 10px;
        border-inline-start: 2px solid var(--border);
        font-size: 0.77rem; color: var(--muted);
      }
      .gap b { font-variant-numeric: tabular-nums; color: var(--text); }
      .gap.worst { border-inline-start-color: var(--bad); }
      .gap.worst b { color: var(--bad); }

      /* ---- charts ---- */

      .chart { width: 100%; height: auto; display: block; overflow: visible; }
      .chart text { font-size: 11px; fill: var(--faint); font-variant-numeric: tabular-nums; }
      .chart .hit { fill: transparent; cursor: crosshair; touch-action: pan-y; }
      .chart .hit.click { cursor: pointer; }
      .chart .band { fill: var(--text); fill-opacity: 0.07; pointer-events: none; }
      .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 0.78rem; color: var(--muted); }
      .legend span { display: inline-flex; align-items: center; gap: 7px; }
      .sw { width: 11px; height: 11px; border-radius: 3px; background: var(--accent); flex: none; }
      .sw.line { height: 3px; width: 16px; border-radius: 2px; }

      .donut { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 22px; }
      .donut svg { width: 128px; height: 128px; flex: none; }
      .donut svg path { cursor: default; }
      .donut .tot { font-size: 20px; font-weight: 700; fill: var(--text); }
      .donut .totl { font-size: 10px; fill: var(--faint); letter-spacing: 0.06em; }
      .dl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.84rem; flex: 1; min-width: 150px; }
      .dl li { display: grid; grid-template-columns: 11px 1fr auto auto; gap: 8px; align-items: center; }
      .dl .v { font-weight: 600; font-variant-numeric: tabular-nums; }
      .dl .p { color: var(--faint); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: end; font-size: 0.78rem; }

      .bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .bars li { display: grid; grid-template-columns: minmax(6.5rem, 38%) 1fr auto; align-items: center; gap: 10px; border-radius: 6px; }
      .bars li.click { cursor: pointer; }
      .bars li.click:hover .l { color: var(--text); }
      .bars .l { font-size: 0.84rem; color: var(--muted); overflow-wrap: anywhere; }
      .bars .b { height: 8px; background: var(--raised); border-radius: 2px; overflow: hidden; }
      .bars .b i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
      .bars .v { font-size: 0.82rem; font-variant-numeric: tabular-nums; min-width: 2.5ch; text-align: end; white-space: nowrap; }
      .bars .v span { color: var(--faint); margin-inline-start: 6px; }
      .grp + .grp { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
      .grp .gh { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
      .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 4px 28px; }
      .groups .grp + .grp { margin-top: 0; }
      .groups .grp { padding: 10px 0; border-top: 1px solid var(--border); }

      .flow { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface); margin-bottom: 12px; }
      .flow i { display: block; height: 100%; }

      /* ---- tables ---- */

      .tablebox { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
      th, td { text-align: start; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      thead th {
        font-size: 0.68rem; letter-spacing: 0.07em; text-transform: uppercase;
        color: var(--faint); font-weight: 600; white-space: nowrap;
      }
      th button {
        font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
        background: none; border: 0; padding: 0; cursor: pointer;
      }
      th button:hover, th[aria-sort] button { color: var(--text); }
      th[aria-sort='ascending'] button::after { content: ' ↑'; }
      th[aria-sort='descending'] button::after { content: ' ↓'; }
      td.n, th.n { text-align: end; }
      tbody tr:last-child td { border-bottom: 0; }
      tr.row { cursor: pointer; }
      tr.row:hover td { background: var(--raised); }
      td.nowrap { white-space: nowrap; }
      td.msg { min-width: 220px; max-width: 420px; overflow-wrap: anywhere; }
      .key { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.8rem; }
      .exbar { display: block; height: 4px; margin-top: 4px; background: var(--accent); border-radius: 2px; opacity: 0.75; }
      .cohort td, .cohort th { padding: 4px; text-align: center; }
      .cohort td:first-child, .cohort th:first-child { text-align: start; padding-inline-start: 0; white-space: nowrap; }
      .cohort td.n { text-align: end; padding-inline-end: 10px; }
      .cell {
        display: block; min-width: 3.2ch; padding: 4px 2px; border-radius: 4px;
        font-size: 0.76rem; font-variant-numeric: tabular-nums; color: var(--text);
      }
      .cell.dim { color: var(--faint); }

      .flag {
        display: inline-block; font-size: 0.66rem; font-weight: 600; letter-spacing: 0.04em;
        border-radius: 999px; padding: 0 7px; margin-inline-start: 6px; white-space: nowrap;
        background: var(--raised); color: var(--muted); vertical-align: middle; line-height: 1.6;
      }
      .flag.warn { background: var(--warn-bg); color: var(--warn); }
      .flag.bad { background: var(--warn-bg); color: var(--bad); }
      .flag.ok { background: var(--accent-muted); color: var(--accent); }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 6px; vertical-align: middle; }
      .feats { display: inline-flex; gap: 3px; color: var(--muted); }
      .feats svg { width: 14px; height: 14px; }

      .tool { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; font-size: 0.8rem; }
      .tool input[type='search'] { min-width: 0; width: 13rem; max-width: 100%; }
      .tool .count { color: var(--faint); margin-inline-start: auto; }
      .chip {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--accent-muted); color: var(--text);
        border-radius: 999px; padding: 3px 4px 3px 11px; font-size: 0.78rem;
      }
      .chip button {
        font: inherit; border: 0; background: var(--bg); color: var(--muted);
        width: 20px; height: 20px; border-radius: 50%; cursor: pointer; line-height: 1; padding: 0;
      }
      .more { margin-top: 12px; }

      /* ---- tooltip ---- */

      .tip {
        position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--border-strong); border-radius: 8px;
        box-shadow: 0 8px 24px var(--shadow);
        padding: 8px 10px; font-size: 0.78rem; line-height: 1.45;
        max-width: 260px; min-width: 120px;
      }
      .tip .t { color: var(--muted); margin-bottom: 3px; }
      .tip .r { display: flex; align-items: center; gap: 8px; }
      .tip .r i { width: 12px; height: 3px; border-radius: 2px; flex: none; }
      .tip .r b { font-variant-numeric: tabular-nums; }
      .tip .r span { color: var(--muted); }

      /* ---- drawer ---- */

      .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.35); }
      .drawer {
        position: fixed; top: 0; bottom: 0; right: 0; z-index: 41;
        width: min(480px, 100vw); overflow-y: auto;
        background: var(--bg); border-inline-start: 1px solid var(--border);
        box-shadow: -12px 0 32px var(--shadow);
        padding: 18px 20px 40px;
        display: flex; flex-direction: column; gap: 16px;
      }
      .drawer .dh { display: flex; align-items: center; gap: 10px; }
      .drawer .dh h2 { margin: 0; font-size: 1.1rem; }
      .drawer .x {
        margin-inline-start: auto; font: inherit; font-size: 1.2rem; line-height: 1;
        width: 34px; height: 34px; border-radius: 50%;
        border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer;
      }
      .facts { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0; font-size: 0.84rem; }
      .facts dt { color: var(--faint); }
      .facts dd { margin: 0; }
      .tl { list-style: none; margin: 0; padding: 0; font-size: 0.82rem; }
      .tl li { display: grid; grid-template-columns: 5.6rem 1fr auto; gap: 4px 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
      .tl li:last-child { border-bottom: 0; }
      .tl .when { color: var(--faint); font-variant-numeric: tabular-nums; }
      .tl .what { min-width: 0; }
      .tl .nums { color: var(--muted); font-variant-numeric: tabular-nums; text-align: end; white-space: nowrap; }

      .skeleton { color: var(--faint); font-size: 0.9rem; padding: 40px 0; text-align: center; }

        function legend(parent, items) {
          var lg = el('div', 'legend');
          items.forEach(function (it) {
            var s = el('span');
            var sw = el('i', 'sw' + (it.line ? ' line' : ''));
            sw.style.background = it.color;
            s.appendChild(sw);
            s.appendChild(document.createTextNode(it.name));
            lg.appendChild(s);
          });
          parent.appendChild(lg);
          return lg;
        }

        function topRounded(x, y, w, h, r) {
          r = Math.min(r, w / 2, h);
          if (r <= 0.3) return 'M' + x + ',' + (y + h) + 'V' + y + 'H' + (x + w) + 'V' + (y + h) + 'Z';
          return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
            'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
        }

        /*
          Columns over a category or time axis: optional stacked bars, optional
          lines on the same axis, optional one line on a second (right) axis.
          Hover is one hit area for the whole plot, snapped to the nearest
          column — the reader aims at a date, not at a 2px line.
        */
        /*
          Charts are sized to their box, and a box's final width is only known
          once its whole row exists (a lone card in an auto-fit grid spans the
          row until its neighbour arrives). So while a tab renders, each chart
          leaves a placeholder and is drawn after the tab's DOM is complete.
        */
        var PENDING = null;
        function deferred(box, fn) {
          var holder = el('div');
          box.appendChild(holder);
          if (PENDING) PENDING.push(function () { fn(holder); });
          else fn(holder);
        }

        function plot(box, o) {
          deferred(box, function (holder) { plotNow(holder, o); });
        }

        function plotNow(box, o) {
          var n = o.buckets.length;
          if (!n) { box.appendChild(el('p', 'empty', o.emptyText || 'Nothing in this range.')); return null; }
          var W = boxWidth(box);
          var H = o.height || 220;
          var series = o.series || [];
          var lines = o.lines || [];
          var right = o.right || null;

          var lmax = 0;
          for (var i = 0; i < n; i++) {
            var st = 0;
            for (var si = 0; si < series.length; si++) st += series[si].values[i] || 0;
            if (st > lmax) lmax = st;
            for (var li = 0; li < lines.length; li++) {
              var lv = lines[li].values[i];
              if (lv != null && lv > lmax) lmax = lv;
            }
          }
          var ys = scaleY(lmax, o.integer !== false);
          var rmax = 0;
          if (right) right.values.forEach(function (v) { if (v > rmax) rmax = v; });
          var rs = right ? scaleY(rmax, right.integer !== false) : null;
          var fy = o.yFmt || fmtTick;

          var padL = 10 + Math.max.apply(null, ys.ticks.map(function (t) { return textW(fy(t)); }));
          var padR = rs ? 12 + Math.max.apply(null, rs.ticks.map(function (t) { return textW(fmtTick(t)); })) : 8;
          var padT = o.markers && o.markers.length ? 18 : 10;
          var padB = 24;
          var pw = W - padL - padR, ph = H - padT - padB;
          var slot = pw / n;
          var gap = slot > 8 ? Math.min(slot * 0.28, 10) : slot > 3 ? 1 : 0;
          var bw = Math.max(0.8, slot - gap);
          function y(v) { return padT + ph - (v / ys.max) * ph; }
          function yr(v) { return padT + ph - (v / rs.max) * ph; }
          function cx(i) { return padL + i * slot + slot / 2; }

          var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart', role: 'img' });
          if (o.label) root.setAttribute('aria-label', o.label);

          ys.ticks.forEach(function (t) {
            root.appendChild(svg('line', { x1: padL, x2: W - padR, y1: y(t), y2: y(t), stroke: 'var(--border)', 'stroke-width': 1 }));
            root.appendChild(svgText({ x: padL - 7, y: y(t) + 4, 'text-anchor': 'end' }, fy(t)));
          });
          if (rs) {
            rs.ticks.forEach(function (t) {
              root.appendChild(svgText({ x: W - padR + 7, y: yr(t) + 4, 'text-anchor': 'start' }, fmtTick(t)));
            });
          }

          var band = svg('rect', { class: 'band', x: 0, y: padT, width: slot, height: ph, visibility: 'hidden' });
          root.appendChild(band);

          /* Bars, stacked bottom-up, with a hairline of surface between segments. */
          for (i = 0; i < n; i++) {
            var acc = 0, topSi = -1;
            for (si = 0; si < series.length; si++) if (series[si].values[i]) topSi = si;
            var first = true;
            for (si = 0; si < series.length; si++) {
              var v = series[si].values[i] || 0;
              if (!v) continue;
              var y1 = y(acc + v), y0 = y(acc);
              acc += v;
              if (!first && y0 - y1 > 2) y0 -= 1.5;
              first = false;
              var h = Math.max(0.5, y0 - y1);
              root.appendChild(svg('path', {
                d: si === topSi ? topRounded(padL + i * slot + gap / 2, y1, bw, h, bw > 6 ? 3 : 1) :
                  'M' + (padL + i * slot + gap / 2) + ',' + y0 + 'V' + y1 + 'h' + bw + 'V' + y0 + 'Z',
                fill: series[si].color,
              }));
            }
          }

          function drawLine(values, color, yfn, width, dash, opacity) {
            var d = '', pen = false;
            for (var j = 0; j < n; j++) {
              var val = values[j];
              if (val == null) { pen = false; continue; }
              d += (pen ? 'L' : 'M') + cx(j).toFixed(1) + ',' + yfn(val).toFixed(1);
              pen = true;
            }
            if (!d) return;
            var p = svg('path', {
              d: d, fill: 'none', stroke: color, 'stroke-width': width || 2,
              'stroke-linejoin': 'round', 'stroke-linecap': 'round',
            });
            if (dash) p.setAttribute('stroke-dasharray', dash);
            if (opacity) p.setAttribute('stroke-opacity', opacity);
            root.appendChild(p);
            if (n === 1) root.appendChild(svg('circle', { cx: cx(0), cy: yfn(values[0] || 0), r: 3, fill: color }));
          }
          lines.forEach(function (l) { drawLine(l.values, l.color, y, l.width, l.dash, l.opacity); });
          if (right) drawLine(right.values, right.color, yr, right.width || 2, right.dash, right.opacity);

          root.appendChild(svg('line', { x1: padL, x2: W - padR, y1: y(0), y2: y(0), stroke: 'var(--border-strong)', 'stroke-width': 1 }));

          (o.markers || []).forEach(function (mk) {
            if (mk.at < 0 || mk.at >= n) return;
            var mx = padL + mk.at * slot + (mk.edge ? 0 : slot / 2);
            root.appendChild(svg('line', { x1: mx, x2: mx, y1: padT - 4, y2: padT + ph, stroke: 'var(--muted)', 'stroke-dasharray': '3 3', 'stroke-width': 1 }));
            var anchor = mx > W - 80 ? 'end' : 'start';
            root.appendChild(svgText({ x: mx + (anchor === 'end' ? -4 : 4), y: padT - 6, 'text-anchor': anchor }, mk.label));
          });

          /* X labels, thinned so they never overlap. */
          var labels = o.buckets.map(function (b) { return b.short != null ? b.short : b.label; });
          var lw = Math.max.apply(null, labels.map(textW)) + 10;
          var step = Math.max(1, Math.ceil(lw / slot));
          for (i = 0; i < n; i += step) {
            var tw = textW(labels[i]);
            var x = Math.min(Math.max(cx(i), padL + tw / 2), W - padR - tw / 2);
            root.appendChild(svgText({ x: x, y: H - 6, 'text-anchor': 'middle' }, labels[i]));
          }

          /* Line dots for the hovered column. */
          var dots = [];
          lines.concat(right ? [right] : []).forEach(function (l, k) {
            var c = svg('circle', { r: 3.5, fill: l.color, stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' });
            dots.push({ c: c, l: l, yfn: right && k === lines.length ? yr : y });
            root.appendChild(c);
          });

          var hit = svg('rect', { class: 'hit' + (o.onClick ? ' click' : ''), x: padL, y: 0, width: pw, height: padT + ph });
          root.appendChild(hit);

          function idxAt(ev) {
            var r = root.getBoundingClientRect();
            var px = (ev.clientX - r.left) * (W / r.width);
            return Math.max(0, Math.min(n - 1, Math.floor((px - padL) / slot)));
          }
          function defaultTip(j) {
            var rows = [];
            for (var s2 = series.length - 1; s2 >= 0; s2--) {
              var sv = series[s2].values[j] || 0;
              if (series.length > 1 && !sv && !series[s2].keep) continue;
              rows.push({ color: series[s2].color, value: (series[s2].fmt || fmtN)(sv), label: series[s2].name });
            }
            lines.forEach(function (l) {
              if (l.values[j] != null) rows.push({ color: l.color, value: (l.fmt || fmtN)(l.values[j]), label: l.name });
            });
            if (right && right.values[j] != null) rows.push({ color: right.color, value: (right.fmt || fmtN)(right.values[j]), label: right.name });
            return { title: o.buckets[j].label, rows: rows };
          }
          function hover(j, ev) {
            band.setAttribute('x', padL + j * slot);
            band.setAttribute('visibility', 'visible');
            dots.forEach(function (d) {
              var v2 = d.l.values[j];
              if (v2 == null) { d.c.setAttribute('visibility', 'hidden'); return; }
              d.c.setAttribute('cx', cx(j));
              d.c.setAttribute('cy', d.yfn(v2));
              d.c.setAttribute('visibility', 'visible');
            });
            var c = o.tip ? o.tip(j) : defaultTip(j);
            if (o.onClick && c) c.rows = c.rows.concat([{ value: '', label: ev.pointerType === 'mouse' ? 'Click for people' : 'Tap again for people' }]);
            if (c) tipShow(ev, c.title, c.rows);
          }
          function unhover() {
            band.setAttribute('visibility', 'hidden');
            dots.forEach(function (d) { d.c.setAttribute('visibility', 'hidden'); });
            tipHide();
          }
          var lastTap = -1;
          hit.setAttribute('data-tip', '');
          hit.addEventListener('pointermove', function (ev) { if (ev.pointerType === 'mouse') hover(idxAt(ev), ev); });
          hit.addEventListener('pointerleave', function (ev) { if (ev.pointerType === 'mouse') unhover(); });
          hit.addEventListener('pointerdown', function (ev) {
            var j = idxAt(ev);
            if (ev.pointerType === 'mouse') return;
            if (o.onClick && lastTap === j) { lastTap = -1; unhover(); o.onClick(j); return; }
            lastTap = j;
            hover(j, ev);
          });
          hit.addEventListener('pointerup', function (ev) {
            if (ev.pointerType === 'mouse' && ev.button === 0 && o.onClick) { unhover(); o.onClick(idxAt(ev)); }
          });

          box.appendChild(root);

          if (o.legend !== false) {
            var items = [];
            series.forEach(function (s) { items.push({ name: s.name, color: s.color }); });
            lines.forEach(function (l) { items.push({ name: l.name, color: l.color, line: true }); });
            if (right) items.push({ name: right.name + (right.axisNote ? ' (' + right.axisNote + ')' : ' (right axis)'), color: right.color, line: true });
            if (items.length >= 2) legend(box, items);
          }
          return root;
        }

        function arcPath(c, r0, r1, a0, a1) {
          var large = a1 - a0 > Math.PI ? 1 : 0;
          function p(r, a) { return (c + r * Math.cos(a)).toFixed(2) + ',' + (c + r * Math.sin(a)).toFixed(2); }
          return 'M' + p(r1, a0) + 'A' + r1 + ',' + r1 + ' 0 ' + large + ' 1 ' + p(r1, a1) +
            'L' + p(r0, a1) + 'A' + r0 + ',' + r0 + ' 0 ' + large + ' 0 ' + p(r0, a0) + 'Z';
        }

        function donut(box, items, centerLabel) {
          items = items.filter(function (it) { return it.value > 0; });
          var total = sum(items.map(function (it) { return it.value; }));
          if (!total) { box.appendChild(el('p', 'empty', 'Nobody in this range.')); return; }
          var wrap = el('div', 'donut');
          var root = svg('svg', { viewBox: '0 0 128 128', role: 'img' });
          root.setAttribute('aria-label', items.map(function (it) { return it.label + ' ' + it.value; }).join(', '));
          var a = -Math.PI / 2;
          items.forEach(function (it) {
            var span = (it.value / total) * Math.PI * 2;
            var a1 = a + span;
            if (span >= Math.PI * 2 - 1e-6) a1 = a + Math.PI * 2 - 0.0001;
            var path = svg('path', { d: arcPath(64, 40, 60, a, a1), fill: it.color, stroke: 'var(--surface)', 'stroke-width': items.length > 1 ? 2 : 0 });
            bindTip(path, function () {
              return { title: it.label, rows: [{ color: it.color, value: fmtN(it.value), label: pctS(it.value, total) }] };
            });
            root.appendChild(path);
            a = a1;
          });
          root.appendChild(svgText({ x: 64, y: 66, 'text-anchor': 'middle', class: 'tot' }, fmtN(total)));
          root.appendChild(svgText({ x: 64, y: 80, 'text-anchor': 'middle', class: 'totl' }, (centerLabel || 'TOTAL').toUpperCase()));
          wrap.appendChild(root);
          var ul = el('ul', 'dl');
          items.forEach(function (it) {
            var li = el('li');
            var sw = el('i', 'sw'); sw.style.background = it.color;
            li.appendChild(sw);
            li.appendChild(el('span', null, it.label));
            li.appendChild(el('span', 'v', fmtN(it.value)));
            li.appendChild(el('span', 'p', pctS(it.value, total)));
            ul.appendChild(li);
          });
          wrap.appendChild(ul);
          box.appendChild(wrap);
        }

        /* Horizontal bars in HTML: labels wrap, values align, rows can be buttons. */
        function hbars(box, rows, o) {
          o = o || {};
          if (!rows.length) { box.appendChild(el('p', 'empty', o.emptyText || 'Nothing in this range.')); return; }
          var max = o.max || Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([1]));
          var ul = el('ul', 'bars');
          rows.forEach(function (r) {
            var li = el('li', r.onClick ? 'click' : null);
            li.appendChild(el('span', 'l', r.label));
            var b = el('span', 'b');
            var i = el('i');
            i.style.width = Math.max(0, Math.min(100, (r.value / max) * 100)) + '%';
            if (r.color) i.style.background = r.color;
            b.appendChild(i);
            li.appendChild(b);
            var v = el('span', 'v', r.display != null ? r.display : fmtN(r.value));
            if (r.sub) v.appendChild(el('span', null, r.sub));
            li.appendChild(v);
            if (r.onClick) {
              li.tabIndex = 0;
              li.setAttribute('role', 'button');
              li.addEventListener('click', r.onClick);
              li.addEventListener('keydown', function (ev) {
                if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); r.onClick(); }
              });
            }
            if (r.title) li.title = r.title;
            ul.appendChild(li);
          });
          box.appendChild(ul);
        }

        function heatmap(box, matrix, o) {
          deferred(box, function (holder) { heatmapNow(holder, matrix, o); });
        }

        function heatmapNow(box, matrix, o) {
          var W = boxWidth(box);
          var labW = 34, padB = 20;
          var cw = (W - labW) / 24;
          var ch = Math.max(14, Math.min(26, cw * 0.8));
          var H = ch * 7 + padB;
          var max = 0;
          matrix.forEach(function (row) { row.forEach(function (v) { if (v > max) max = v; }); });
          var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart', role: 'img' });
          root.setAttribute('aria-label', o.label || 'Heatmap');
          var order = [1, 2, 3, 4, 5, 6, 0]; /* Monday first */
          order.forEach(function (wd, r) {
            root.appendChild(svgText({ x: 0, y: r * ch + ch / 2 + 4 }, WD[wd]));
            for (var h = 0; h < 24; h++) {
              var v = matrix[wd][h];
              var rect = svg('rect', {
                x: labW + h * cw + 1, y: r * ch + 1, width: Math.max(1, cw - 2), height: ch - 2, rx: 2,
                fill: v ? 'var(--accent)' : 'var(--raised)',
              });
              if (v) rect.setAttribute('fill-opacity', (0.14 + 0.86 * (v / max)).toFixed(3));
              (function (wd2, h2, v2) {
                bindTip(rect, function () {
                  return {
                    title: WD_LONG[wd2] + ', ' + pad2(h2) + ':00–' + pad2((h2 + 1) % 24) + ':00',
                    rows: [{ color: 'var(--accent)', value: fmtN(v2), label: plural(v2, o.unit || 'workout') }],
                  };
                });
              }(wd, h, v));
              root.appendChild(rect);
            }
          });
          var hstep = cw * 3 >= 26 ? 3 : 6;
          for (var hh = 0; hh < 24; hh += hstep) {
            root.appendChild(svgText({ x: labW + hh * cw + 1, y: H - 5 }, pad2(hh)));
          }
          box.appendChild(root);
        }
        function pad2(n) { return (n < 10 ? '0' : '') + n; }

        function featIcons(u) {
          var span = el('span', 'feats');
          var names = [];
          FEATURES.forEach(function (f) {
            if (!u.feat[f.id] || f.id === 'warmups' || f.id === 'cardio') return;
            names.push(f.name);
            var s = svg('svg', { viewBox: '0 0 16 16', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' });
            s.appendChild(svg('path', { d: ICONS[f.id] }));
            span.appendChild(s);
          });
          if (names.length) { span.title = names.join(', '); span.setAttribute('aria-label', names.join(', ')); }
          return span;
        }

        /* ---- page furniture ---- */

        function card(parent, title, note, extra) {
          var c = el('div', 'card');
          if (title) {
            var h = el('div', 'ch');
            h.appendChild(el('h3', null, title));
            if (note) h.appendChild(el('span', 'note', note));
            if (extra) { extra.classList.add('end'); h.appendChild(extra); }
            c.appendChild(h);
          }
          parent.appendChild(c);
          return c;
        }
        function row(parent, cls) { var r = el('div', cls || 'pair'); parent.appendChild(r); return r; }
        function segmented(options, value, onPick, labelText) {
          var g = el('div', 'seg');
          g.setAttribute('role', 'group');
          if (labelText) g.setAttribute('aria-label', labelText);
          options.forEach(function (op) {
            var b = el('button', null, op[1]);
            b.type = 'button';
            b.setAttribute('aria-pressed', op[0] === value ? 'true' : 'false');
            b.addEventListener('click', function () { onPick(op[0]); });
            g.appendChild(b);
          });
          return g;
        }
        function tile(parent, k, v, d, o) {
          o = o || {};
          var t = el('div', 'tile' + (o.lead ? ' lead' : ''));
          t.appendChild(el('span', 'k', k));
          var vv = el('span', 'v', v);
          if (o.unit) vv.appendChild(el('small', null, o.unit));
          t.appendChild(vv);
          if (d) t.appendChild(el('span', 'd' + (o.dir ? ' ' + o.dir : ''), d));
          if (o.spark) t.appendChild(o.spark);
          parent.appendChild(t);
          return t;
        }

        /* =================================================================
           Shared computations.
           ================================================================= */

        var FUNNEL = [
          ['Created account', 'account', function () { return true; }],
          ['Finished onboarding', 'onboarding', function (u) { return u.onboarded != null; }],
          ['Started a workout', 'first workout', function (u) { return u.firstStart != null || u.nDone > 0; }],
          ['Finished 1', 'first finish', function (u) { return u.nDone >= 1; }],
          ['Finished 2', 'second workout', function (u) { return u.nDone >= 2; }],
          ['Finished 5', 'fifth workout', function (u) { return u.nDone >= 5; }],
        ];
        function funnelOf(users) {
          return FUNNEL.map(function (f) {
            var by = { ios: 0, android: 0, unknown: 0 }, n = 0;
            users.forEach(function (u) { if (f[2](u)) { n++; by[u.platform]++; } });
            return { stage: f[0], short: f[1], people: n, by: by };
          });
        }
        function worstStep(steps) {
          var worst = -1, lost = 0;
          steps.forEach(function (s, i) {
            if (!i) return;
            var l = steps[i - 1].people - s.people;
            if (l > lost) { lost = l; worst = i; }
          });
          return worst;
        }

        function doneIn(S, fn) {
          var out = [];
          S.sessions.forEach(function (s) { if (s.done && S.inR(s.fDay)) out.push(s); });
          return fn ? out.filter(fn) : out;
        }

        function heatOf(sessions) {
          var m = [];
          for (var w = 0; w < 7; w++) m.push(zeros(24));
          sessions.forEach(function (s) { if (s.wd != null) m[s.wd][s.hour]++; });
          return m;
        }

        function goPeople(filter) {
          ui.peopleFilter = filter;
          ui.peopleQuick = 'all';
          ui.peopleLimit = 100;
          selectTab('people', true);
        }

        /*
          The Overview reads downloads, accounts and workouts side by side.

          Downloads are store counts per day and country — no names, about a
          day late from Apple and several days late from Google Play. A
          store's last reported day is the newest day it has any row for;
          the days after it are "pending": hatched in the chart, left out of
          every conversion rate, and named under the Downloads card. No
          value is ever filled in for them.
        */
        var STORE_NAME = { apple: 'App Store', google: 'Google Play' };
        var SRC_PLAT = { apple: 'ios', google: 'android' };
        var PLAT_SRC = { ios: 'apple', android: 'google' };
        var MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        /* The platform filter picks the store: iPhone means the App Store, Android Google Play. */
        function storeSources() {
          return ctl.platform === 'all' ? ['apple', 'google'] : ctl.platform === 'ios' ? ['apple'] : ctl.platform === 'android' ? ['google'] : [];
        }
        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }
        function monthStartOf(d) { var x = new Date(d * DAY); return Math.floor(Date.UTC(x.getUTCFullYear(), x.getUTCMonth(), 1) / DAY); }
        function monthEndOf(d) { var x = new Date(d * DAY); return Math.floor(Date.UTC(x.getUTCFullYear(), x.getUTCMonth() + 1, 1) / DAY) - 1; }
        function monthName(d) { return MONTHS_LONG[new Date(d * DAY).getUTCMonth()]; }
        function spanLabel(a, b) { return a === b ? dayLabel(a) : dayLabel(a) + ' – ' + dayLabel(b); }
        function ccName(cc) { return !cc || cc === '??' || cc === 'ZZ' ? 'Unknown' : countryName(cc); }
        /* Is any value of the sorted array inside [a, b]? */
        function hasIn(arr, a, b) {
          var lo = 0, hi = arr.length;
          while (lo < hi) { var mid = (lo + hi) >> 1; if (arr[mid] < a) lo = mid + 1; else hi = mid; }

        }

        /*
          Per-day counts for the current filters, as running sums, so any
          span of days is two lookups. Built once per scope.
        */
        function growthModel(S) {
          if (S.g) return S.g;
          var A0 = Math.min(M.minDay, S.start - S.len, S.end - 70, M.today - 70);
          var B0 = Math.max(M.today, S.end);
          var N = B0 - A0 + 1;
          var srcs = storeSources();
          var last = { apple: null, google: null };
          M.store.forEach(function (r) {
            if (!Object.prototype.hasOwnProperty.call(last, r.source)) return;
            if (last[r.source] == null || r.day > last[r.source]) last[r.source] = r.day;
          });
          /*
            A day nobody downloaded has no row, so the newest row can sit
            behind what Apple has actually reported. Apple's daily report is
            out by the next day; two days before the last good sync is safely
            reported, zero or not. Google's monthly file has no such promise,
            so it keeps the newest row.
          */
          (M.storeSync || []).forEach(function (s) {
            if (s.source !== 'apple' || !s.last_ok_at || last.apple == null) return;
            var safe = Math.floor(parseT(s.last_ok_at) / DAY) - 2;
            if (safe > last.apple) last.apple = safe;
          });
          var conn = srcs.filter(function (s) { return last[s] != null; });
          var lastFull = conn.length ? Math.min.apply(null, conn.map(function (s) { return last[s]; })) : null;
          var lastAny = conn.length ? Math.max.apply(null, conn.map(function (s) { return last[s]; })) : null;

          var dl = { apple: zeros(N), google: zeros(N) };
          M.store.forEach(function (r) {
            var i = r.day - A0;
            if (dl[r.source] && i >= 0 && i < N) dl[r.source][i] += r.n;
          });
          var ac = { ios: zeros(N), android: zeros(N), unknown: zeros(N) };
          S.users.forEach(function (u) {
            var i = u.cDay == null ? -1 : u.cDay - A0;
            if (i >= 0 && i < N) ac[u.platform][i]++;
          });

          /* Each trainer's distinct days with a finished workout, sorted. */
          var byU = new Map(), wo = zeros(N);
          S.sessions.forEach(function (s) {
            if (!s.done || s.fDay == null) return;
            var i = s.fDay - A0;
            if (i >= 0 && i < N) wo[i]++;
            var list = byU.get(s.u);
            if (!list) { list = []; byU.set(s.u, list); }
            list.push(s.fDay);
          });
          var TU = [], DD = new Map();
          var tr = { ios: zeros(N), android: zeros(N), unknown: zeros(N) };
          byU.forEach(function (list, u) {
            list.sort(function (x, y) { return x - y; });
            var dd = [];
            list.forEach(function (d) { if (!dd.length || dd[dd.length - 1] !== d) dd.push(d); });
            TU.push(u);
            DD.set(u, dd);
            dd.forEach(function (d) { var i = d - A0; if (i >= 0 && i < N) tr[u.platform][i]++; });
          });

          var P = {
            dl: { apple: prefix(dl.apple), google: prefix(dl.google) },
            ac: { ios: prefix(ac.ios), android: prefix(ac.android), unknown: prefix(ac.unknown) },
            tr: { ios: prefix(tr.ios), android: prefix(tr.android), unknown: prefix(tr.unknown) },
            wo: prefix(wo),
          };
          function rs(p, a, b) {
            a = Math.max(a, A0); b = Math.min(b, B0);
            return b < a ? 0 : p[b - A0 + 1] - p[a - A0];
          }
          function byPlat(table, a, b, pl) {
            if (pl) return rs(table[pl], a, b);
            return rs(table.ios, a, b) + rs(table.android, a, b) + rs(table.unknown, a, b);
          }
          var G = {
            A0: A0, B0: B0, srcs: srcs, conn: conn, last: last, lastFull: lastFull, lastAny: lastAny, TU: TU, DD: DD,
            dlIn: function (a, b, src) {
              var t = 0;
              (src ? [src] : srcs).forEach(function (s) { if (srcs.indexOf(s) >= 0) t += rs(P.dl[s], a, b); });
              return t;
            },
            acIn: function (a, b, pl) { return byPlat(P.ac, a, b, pl); },
            /* People who trained on day d (distinct per day). */
            trDay: function (d, pl) { return byPlat(P.tr, d, d, pl); },
            /* Distinct people with a finished workout anywhere in [a, b]. */
            trIn: function (a, b, pl) {
              var n = 0;
              for (var i = 0; i < TU.length; i++) {
                if (pl && TU[i].platform !== pl) continue;
                if (hasIn(DD.get(TU[i]), a, b)) n++;
              }
              return n;
            },
            /* People whose first finished workout was on or before day b. */
            everIn: function (b, pl) {
              var n = 0;
              for (var i = 0; i < TU.length; i++) {

            },
            woIn: function (a, b) { return rs(P.wo, a, b); },

            },
            /* Stores that have not reported up to day d. */
            pendingAt: function (d) { return conn.filter(function (s) { return last[s] < d; }); },

          S.g = G;
          return G;
        }

        /* ---- small builders ---- */

        function gCard(parent, title, sub) {
          var c = el('div', 'card');

        function gSeg(options, value, onPick, labelText) {

        function gSect(p, title, sub) {
          var h = el('h2', 'g-sect', title);

        }
        function deltaPill(cur, prev, pts) {
          if (cur == null) return '<span class="g-delta flat">—</span>';
          if (prev == null) return '<span class="g-delta flat">no earlier data</span>';
          var d = cur - prev, c = d > 0 ? 'up' : d < 0 ? 'down' : 'flat', arrow = d > 0 ? '▲ ' : d < 0 ? '▼ ' : '';
          if (pts) return '<span class="g-delta ' + c + '">' + arrow + Math.abs(d) + ' pts</span>';

        /* A sparkline as markup. Nulls break the line (pending days, nothing to divide by). */
        function sparkSvg(vals) {
          var W = 260, H = 44, n = vals.length;

          vals.forEach(function (v) { if (v != null && v > mx) mx = v; });

          function y(v) { return H - 3 - (v / mx) * (H - 8); }
          var line = '', pen = false, gaps = false, lastI = -1;
          vals.forEach(function (v, i) {
            if (v == null) { pen = false; gaps = true; return; }

            pen = true; lastI = i;

          var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
            '<line x1="0" x2="' + W + '" y1="' + (H - 0.5) + '" y2="' + (H - 0.5) + '" stroke="var(--border)" vector-effect="non-scaling-stroke"/>';

          return out + '</svg>';
        }
        /* One hover band and hit area over n equal slots; show(j) returns a tooltip. */
        function gHover(root, W, padL, padT, pw, ph, n, show) {

          root.insertBefore(band, root.firstChild);

          function on(ev) {
            var j = at(ev);
            band.setAttribute('x', padL + j * slot);

        function yAxis(root, ys, padL, W, padR, y, fmt) {
          ys.ticks.forEach(function (t) {

            if (t) ln.setAttribute('stroke-dasharray', '2 4');

            else { key = monthStartOf(d); short = MONTHS[new Date(d * DAY).getUTCMonth()]; title = monthName(d) + ' ' + new Date(d * DAY).getUTCFullYear(); }

        /* =================================================================

        function rOverview(p, S) {
          var G = growthModel(S);

          var main = el('div', 'g-main');

          gSect(p, 'Activity and retention', 'Are people training, and do they keep coming back?');
          ovActivityTiles(p, S, G);

          var r2 = el('div', 'g-two');

          ovCountries(r2, S, G);
          var r3 = el('div', 'g-two');
          p.appendChild(r3);
          ovPace(r3, S, G);
          ovCohorts(r3, S, G);

          var au = [new Set(), new Set()], wo = [0, 0];
          S.sessions.forEach(function (s) {
            if (!s.done) return;
            if (S.inR(s.fDay)) { au[0].add(s.u); wo[0]++; } else if (S.inP(s.fDay)) { au[1].add(s.u); wo[1]++; }
          });

          else {

          p.appendChild(el('p', 'g-foot', 'Downloads come from Apple and Google as counts per day and country, so they have no names. Accounts are people and show a pseudonym. Google Play reports arrive a few days late; those days are marked and left out of conversion.'));
        }

        /* ---- the four headline cards ---- */

        function ovKpis(p, S, G) {
          var T = M.today;
          var noStore = !M.store.length;
          var hasPrev = ctl.range !== 'all' && S.pend >= M.minDay;
          function val(m, a, b) {
            /* Nothing reported yet for any day of the span is unknown, not zero. */
            if (m === 'dl') return G.lastAny != null && a <= G.lastAny ? G.dlIn(a, b) : null;
            if (m === 'ac') return G.acIn(a, b);
            if (m === 'tr') return G.trIn(a, b);
            return G.cvIn(a, b);
          }
          function waiting(a) {
            var late = G.pendingAt(a);
            return late.length === 1 ? 'waiting on ' + (late[0] === 'google' ? 'Google' : 'Apple') : 'waiting on stores';
          }
          function quick(m) {
            return [['Today', T, T], ['7 days', T - 6, T], ['30 days', T - 29, T]].map(function (q) {
              var a = q[1], b = q[2], len = b - a + 1;

              if (m === 'cv' && (G.lastFull == null || a > G.lastFull)) return '<div>' + q[0] + '<b>—<em>' + (G.lastFull == null ? 'no store data' : waiting(a)) + '</em></b></div>';
              var cur = val(m, a, b), prev = val(m, a - len, b - len);

              var d = prev == null ? 0 : cur - prev, cls = d > 0 ? 'up' : d < 0 ? 'down' : '', ch = '';
              if (m === 'cv') ch = prev == null || !d ? '' : (d > 0 ? '+' : '−') + Math.abs(d) + ' pts';
              else ch = prev ? (d >= 0 ? '+' : '−') + Math.abs(Math.round((d / prev) * 100)) + '%' : '';
              var shown = m === 'cv' ? cur + '%' : m === 'tr' ? fmtN(cur) : '+' + fmtN(cur);

            }).join('');
          }
          function series(m) {
            var out = [];
            for (var d = S.start; d <= S.end; d++) {

              else if (m === 'ac') out.push(G.acIn(d, d));
              else if (m === 'tr') out.push(G.trDay(d));

                var x = G.lastFull == null || d > G.lastFull ? 0 : G.dlIn(d - 6, d);

            return '<article class="card g-kpi"><div class="lab">' + k.label + '</div>' +
              '<div class="val">' + (cur == null ? '—' : fmtN(cur) + (k.unit ? '<small>' + k.unit + '</small>' : '')) + '</div>' +
              '<div class="g-dl">' + pill + (vs ? '<span class="g-vs">' + esc(vs) + '</span>' : '') + '</div>' +

        /* ---- the growth chart: one measure, stacked by platform, one axis ---- */

        function ovGrowth(parent, S, G) {
          var k = gCard(parent, 'Growth', '');
          k.h.appendChild(gSeg([['dl', 'Downloads'], ['ac', 'Accounts'], ['tr', 'Trained']], ui.gMetric, function (v) { ui.gMetric = v; redraw(); }, 'Measure'));
          k.h.appendChild(gSeg([['auto', 'Auto'], ['day', 'Day'], ['week', 'Week'], ['month', 'Month']], ui.gGran, function (v) { ui.gGran = v; redraw(); }, 'Group by'));
          k.h.appendChild(gSeg([['new', 'New'], ['cum', 'Running total']], ui.gCum ? 'cum' : 'new', function (v) { ui.gCum = v === 'cum'; redraw(); }, 'Chart style'));

          function draw() {
            clear(holder);

            k.sub.textContent = fmtN(total) + (m === 'tr' ? ' ' + plural(total, 'person', 'people') : cum ? ' so far' : ' in total') + ' · by ' + g + (cum ? ' · running total' : '');

            else {
              plats = ctl.platform === 'all' ? PLATS.slice() : [ctl.platform];
              if (ctl.platform === 'all' && !G.acIn(G.A0, G.B0, 'unknown')) plats = ['ios', 'android'];
            }
            var bk = gBuckets(S.start, S.end, g);
            var n = bk.length;
            function v1(pl, b) {
              if (m === 'dl') return cum ? G.dlIn(G.A0, b.b, PLAT_SRC[pl]) : G.dlIn(b.a, b.b, PLAT_SRC[pl]);
              if (m === 'ac') return cum ? G.acIn(G.A0, b.b, pl) : G.acIn(b.a, b.b, pl);
              return cum ? G.everIn(b.b, pl) : G.trIn(b.a, b.b, pl);

          });
          function keys(node, kind) {
            node.addEventListener('keydown', function (ev) {

              else if (kind === 'b') b = Math.min(sp.b, Math.max(a, b + d));

            });
          }
          keys($('ctl-g0'), 'a');
          keys($('ctl-g1'), 'b');

        function fillMonths() {

        }

        function insights(S, k) {
          var out = [];
          var period = ctl.range === 'all' ? 'overall' : 'in this period';

          var stale = S.users.filter(noOta).length;
          if (stale) {
            out.push({
              warn: true,

            });
          }

          var lost = S.sessions.filter(function (s) { return s.lost && S.inR(s.dDay); }).length;
          if (lost) out.push({ warn: true, text: lost + ' ' + plural(lost, 'workout') + ' in progress ' + (lost === 1 ? 'was' : 'were') + ' lost ' + period });
          else if (S.end >= FIX_DAY && S.start >= FIX_DAY && k.wo[0] > 0) out.push({ text: 'No in-progress workouts lost since 0.3.1' });

          var stuck = S.sessions.filter(function (s) { return s.abandoned && S.inR(s.sDay); }).length;
          if (stuck) out.push({ text: stuck + ' ' + plural(stuck, 'workout') + ' started ' + period + ' ' + (stuck === 1 ? 'was' : 'were') + ' never finished' });

          var J = S.joined;
          if (J.length >= 5) {
            var steps = funnelOf(J);
            var w = worstStep(steps);
            if (w > 0) {
              var a = steps[w - 1], b = steps[w];
              out.push({ text: 'Biggest drop-off: ' + a.short + ' → ' + b.short + ' (' + pct(a.people - b.people, a.people) + '% of ' + a.people + ' stop)' });
            }
            var act = J.filter(function (u) { return u.nDone > 0; }).length;

            if (ctl.platform === 'all') {

              if (top !== 'unknown') out.push({ text: PLAT[top].name + ' is ' + pct(by[top], J.length) + '% of new accounts ' + period });

          }

          var done = doneIn(S);
          if (done.length >= 10) {

            var bw = wdc.indexOf(Math.max.apply(null, wdc));
            var bh = hc.indexOf(Math.max.apply(null, hc));

          }

          var crashes = S.crashes.filter(function (c) { return S.inR(c.day); });
          if (crashes.length) {
            var vers = {};
            crashes.forEach(function (c) { var v = c.ver || 'unknown'; vers[v] = (vers[v] || 0) + 1; });
            var tv = Object.keys(vers).sort(function (x, y) { return vers[y] - vers[x]; })[0];
            out.push({ warn: true, text: crashes.length + ' ' + plural(crashes.length, 'crash', 'crashes') + ' ' + period + ', most on version ' + tv });
          }

          var inst = { apple: 0, google: 0 };
          M.store.forEach(function (r) { if (S.inR(r.day) && inst[r.source] != null) inst[r.source] += r.n; });
          if (inst.apple + inst.google) {
            out.push({ text: fmtN(inst.apple + inst.google) + ' ' + plural(inst.apple + inst.google, 'download') + ' ' + period + ' (App Store ' + fmtN(inst.apple) + ' · Google Play ' + fmtN(inst.google) + ')' });
          }
          if (!M.store.length) out.push({ text: 'Store downloads aren\'t connected' });

        }
        function showDeltaOK() { return ctl.range !== 'all'; }

        /* =================================================================

        function rGrowth(p, S) {
          var mode = ui.growthMode || autoMode(S.len);
          var B = buckets(S.start, S.end, mode);
          var n = B.list.length;

          });
          var cum = [], run = base;

              });

          var r1 = row(p);
          var c1 = card(r1, 'Platform', 'new accounts');
          var pc = { ios: 0, android: 0, unknown: 0 };
          S.joined.forEach(function (u) { pc[u.platform]++; });
          donut(c1, PLATS.map(function (pl) { return { label: PLAT[pl].name, value: pc[pl], color: PLAT[pl].color }; }), 'accounts');

          var c2 = card(r1, 'Sign-in method', 'new accounts');
          var prov = {};
          S.joined.forEach(function (u) { prov[u.provider] = (prov[u.provider] || 0) + 1; });
          var provColors = { google: 'var(--k5)', apple: 'var(--text)', email: 'var(--k4)' };
          donut(c2, Object.keys(prov).sort(function (a, b) { return prov[b] - prov[a]; }).map(function (pv) {
            return { label: label(pv), value: prov[pv], color: provColors[pv] || 'var(--other)' };
          }), 'accounts');

          var r2 = row(p);
          var c3 = card(r2, 'Activation funnel', 'accounts created in range');

          S.joined.forEach(function (u) {

              heard[h] = (heard[h] || 0) + 1;
            });
          });
          var answered = S.joined.filter(function (u) { return u.heard; }).length;
          hbars(c4, Object.keys(heard).sort(function (a, b) { return heard[b] - heard[a]; }).map(function (h) {
            return { label: SOURCE_NAMES[h] || label(h), value: heard[h], sub: pctS(heard[h], answered) };
          }), { emptyText: 'No answers in this range.' });

          var c5 = card(p, 'Time to first workout', 'new accounts');
          var TT = [['< 1 hour', HOUR], ['1–24 hours', DAY], ['1–3 days', 3 * DAY], ['3–7 days', 7 * DAY], ['1–2 weeks', 14 * DAY], ['2–4 weeks', 28 * DAY], ['4 weeks +', Infinity]];
          var tt = zeros(TT.length + 1);

          });
          if (!S.joined.length) c5.appendChild(el('p', 'empty', 'Nobody joined in this range.'));
          else {
            hbars(c5, TT.map(function (t, j) { return { label: t[0], value: tt[j], sub: pctS(tt[j], S.joined.length) }; })
              .concat([{ label: 'Not yet', value: tt[TT.length], sub: pctS(tt[TT.length], S.joined.length), color: 'var(--other)' }]));
          }

          mapBox(p, S);
          storeBox(p, S);
        }

        /*
          Where installs come from, on a map.

        */
        var WORLD = null, WORLD_LOADING = null;
        function loadWorld() {
          if (WORLD) return Promise.resolve(WORLD);
          if (!WORLD_LOADING) {
            WORLD_LOADING = fetch('world.json').then(function (r) { return r.json(); })
              .then(function (w) { WORLD = w; return w; })
              .catch(function () { WORLD_LOADING = null; return null; });
          }
          return WORLD_LOADING;
        }

        function mapCounts(S) {
          var by = {}, split = {};
          function add(cc, n, part) {
            if (!cc || cc === '??' || cc === 'ZZ') cc = '??';
            by[cc] = (by[cc] || 0) + n;
            if (!split[cc]) split[cc] = { a: 0, b: 0 };
            split[cc][part] += n;
          }
          M.store.forEach(function (r) {
            if (!S.inR(r.day)) return;
            if (ctl.platform === 'ios' && r.source !== 'apple') return;

            if (ctl.platform === 'unknown') return;

          });
          return { by: by, split: split };
        }

        function mapBox(p, S) {
          var data = mapCounts(S);

          c.appendChild(tools);

          function tipFor(cc) {
            var n = data.by[cc] || 0, sp = data.split[cc] || { a: 0, b: 0 };
            var rows = [{ value: fmtN(n), label: (n ? pctS(n, total) + ' of all' : 'none in this range') }];

            Object.keys(w.c).forEach(function (cc) {
              var n = data.by[cc] || 0;

              if (n) path.style.fillOpacity = String(0.28 + 0.72 * Math.sqrt(n / max));
              if (cc === ui.mapPick) path.classList.add('on');
              bindTip(path, function () { return tipFor(cc); });
              path.addEventListener('click', function () { pick(cc); });
              paths[cc] = path;
              root.appendChild(path);
            });
            wrap.appendChild(root);
            var sc = el('div', 'map-scale');
            sc.appendChild(el('i', 'zero'));
            sc.appendChild(el('span', null, 'none'));
            [0.35, 0.65, 1].forEach(function (o) { var i = el('i'); i.style.opacity = String(o); sc.appendChild(i); });
            sc.appendChild(el('span', null, max ? 'up to ' + fmtN(max) : ''));

          var keys = Object.keys(data.by).sort(function (a, b) { return data.by[b] - data.by[a]; });
          if (keys.length) {
            hbars(listBox, keys.slice(0, 12).map(function (cc) {
              var sp = data.split[cc] || { a: 0, b: 0 };
              return {
                label: cc === '??' ? 'Unknown' : countryName(cc), value: data.by[cc], sub: pctS(data.by[cc], total),
                title: ctl.platform === 'all' ? partA + ' ' + sp.a + ' · ' + partB + ' ' + sp.b : null,

        function funnelBox(box, users) {

        /* =================================================================

        function rActivity(p, S) {
          var mode = autoMode(S.len);
          var B = buckets(S.start, S.end, mode);
          var n = B.list.length;
          var done = doneIn(S);

          /* Active trainers: distinct people per bucket, plus a 7-day rolling mean of the daily count. */
          var sets = [];

              if (!s.done || s.fDay < S.start - 6 || s.fDay > S.end) return;
              var set = daily.get(s.fDay);

            buckets: B.list,
            series: KGROUPS.map(function (g, j) { return { name: g.name, color: g.color, values: byKind[j] }; }),
            label: 'Workouts finished by kind',
          });

          if (!done.length) c3.appendChild(el('p', 'empty', 'No workouts in this range.'));

          var c4 = card(r1, 'Workout length', 'active minutes');
          var LB = [[15, '<15'], [30, '15–30'], [45, '30–45'], [60, '45–60'], [75, '60–75'], [90, '75–90'], [120, '90–120'], [Infinity, '120+']];

          else plot(c4, {
            buckets: LB.map(function (b) { return { label: b[1] + ' min', short: b[1] }; }),
