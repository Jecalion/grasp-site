<!doctype html>
<!--
  The dashboard.

  This file is served from GitHub Pages, so it is public and must behave as
  though a stranger has it open — because one can. Nothing here is a secret:
  the only key in the page is the publishable key that already ships inside
  the Android and iOS apps, and every number on screen arrives from the
  `stats` edge function, which checks the caller's token against a list of
  admins before the service role touches anything.

  So the worst a stranger can do with this file is look at a sign-in form.

  No Supabase client library, and not to save bytes. The site self-hosts its
  typeface rather than asking Google for it, on the grounds that a page which
  ships the reader's address to a third party in order to render itself is a
  page that contradicts the policy beside it. Two `fetch` calls do everything
  a library would do here, so there is no reason to make an exception.

  The same rule decides how the charts are drawn. A charting library from a
  CDN would tell that CDN every time this page opened, so every chart below is
  a few lines of hand-built SVG and every number is computed in this browser.
  The function sends raw rows under `v2` — one per account, under a
  six-character pseudonym with no email or name, and one per workout — and the
  page does the counting. That is what makes the filters instant: changing the
  date range, platform, test-account switch or time zone is a re-render, not a
  round trip, and nothing about the reader's choices leaves the page except as
  a value in this browser's own storage.

  Demo mode (`?demo`) renders a synthetic dataset generated in the page, so
  the layout can be worked on without signing in. It only switches on when
  the page is served from localhost; on the real domain the parameter is
  ignored and the sign-in form is all anybody sees.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grasp — dashboard</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Private dashboard for Grasp." />
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <script src="theme.js"></script>
    <style>
      /*
        Everything below is the dashboard's own. The palette, the typeface and
        the page furniture all come from style.css, so this file only adds the
        shapes that do not exist anywhere else on the site — plus the chart
        colours, which nothing else on the site needs.

        iPhone and Android are blue and orange: the pair stays apart under
        every common colour-vision deficiency in both themes. Workout kinds
        lead with the accent and keep adjacent stack colours distinguishable.
      */
      :root {
        --ios: #2a78d6;
        --android: #cc5f28;
        --other: #9aa0a6;
        --k2: #e87ba4;
        --k3: #4a3aa7;
        --k4: #eda100;
        --k5: #1baf7a;
        --bad: #c2333a;
        --warn: #8f5600;
        --warn-bg: #fbeed3;
        --shadow: rgba(13, 14, 16, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --ios: #3987e5;
          --android: #d95926;
          --other: #5c6168;
          --k2: #d55181;
          --k3: #9085e9;
          --k4: #c98500;
          --k5: #199e70;
          --bad: #ff5a5f;
          --warn: #f0b24a;
          --warn-bg: #2e2410;
          --shadow: rgba(0, 0, 0, 0.45);
        }
      }
      :root[data-theme='dark'] {
        --ios: #3987e5;
        --android: #d95926;
        --other: #5c6168;
        --k2: #d55181;
        --k3: #9085e9;
        --k4: #c98500;
        --k5: #199e70;
        --bad: #ff5a5f;
        --warn: #f0b24a;
        --warn-bg: #2e2410;
        --shadow: rgba(0, 0, 0, 0.45);
      }

      /*
        `hidden` has to win. Every panel below sets a `display`, and a class
        that sets one beats the attribute on specificity alone — which showed
        as the whole empty dashboard rendering underneath the sign-in form.
      */
      [hidden] { display: none !important; }

      .num, td.n, th.n { font-variant-numeric: tabular-nums; }
      .dash li, .drawer li { margin-bottom: 0; }

      .dash { display: flex; flex-direction: column; gap: 14px; }

      .dashhead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-top: 6px; }
      .dashhead h1 { margin: 0; font-size: 1.6rem; }
      .demo {
        font-size: 0.66rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
        background: var(--warn-bg); color: var(--warn);
        border-radius: 999px; padding: 3px 10px;
      }
      .asof {
        margin-inline-start: auto;
        display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px;
        color: var(--faint); font-size: 0.82rem;
      }
      .refresh {
        font: inherit; font-size: 0.82rem;
        background: var(--surface); color: var(--text);
        border: 1px solid var(--border); border-radius: 999px;
        padding: 5px 13px; cursor: pointer;
      }
      .refresh:hover { border-color: var(--border-strong); }
      .refresh[disabled] { opacity: 0.55; cursor: default; }

      button:focus-visible, select:focus-visible, input:focus-visible,
      [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* ---- sign in ---- */

      .gate {
        max-width: 25rem; margin: 6vh auto 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 26px;
        display: flex; flex-direction: column; gap: 14px;
      }
      .gate h1 { margin: 0; font-size: 1.25rem; }
      .gate p { margin: 0; color: var(--muted); font-size: 0.9rem; }
      .gate label { display: flex; flex-direction: column; gap: 5px; font-size: 0.84rem; color: var(--muted); }
      .gate input {
        font: inherit;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 12px;
      }
      .gate input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .gate button[type='submit'] {
        font: inherit; font-weight: 600;
        background: var(--accent); color: var(--on-accent);
        border: 0; border-radius: 999px; padding: 11px 18px; cursor: pointer;
      }
      .gate button[type='submit'][disabled] { opacity: 0.6; cursor: default; }

      .problem {
        background: var(--raised);
        border-inline-start: 3px solid var(--bad);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 0.85rem;
        color: var(--text);
      }

      /* ---- control bar and tabs ---- */

      /*
        Sticky on anything wider than a phone. On a phone the bar wraps to
        three rows, and three rows pinned over a 640px-tall screen leave too
        little to read, so there it scrolls away with the page.
      */
      .controls {
        position: sticky; top: 0; z-index: 20;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        margin: 0 -24px; padding: 10px 24px 0;
      }
      .ctl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 0.8rem; }
      .seg {
        display: inline-flex; flex-wrap: wrap;
        border: 1px solid var(--border); border-radius: 999px;
        background: var(--surface); padding: 2px;
      }
      .seg button {
        font: inherit; font-size: 0.8rem; line-height: 1.3;
        border: 0; background: transparent; color: var(--muted);
        padding: 4px 11px; border-radius: 999px; cursor: pointer;
      }
      .seg button:hover { color: var(--text); }
      .seg button[aria-pressed='true'] {
        background: var(--bg); color: var(--text);
        box-shadow: inset 0 0 0 1px var(--border-strong);
      }
      .ctl-row select, .ctl-row input[type='date'], .tool input[type='search'], .tool select {
        font: inherit; font-size: 0.8rem;
        background: var(--surface); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 4px 8px;
      }
      .custom { display: inline-flex; align-items: center; gap: 6px; color: var(--faint); }
      .check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
      .check input { accent-color: var(--accent); margin: 0; }
      .tz { display: inline-flex; align-items: center; gap: 6px; color: var(--faint); }
      .tz select { max-width: 13rem; }
      .span { color: var(--faint); margin-inline-start: auto; white-space: nowrap; }

      .tabs {
        display: flex; gap: 2px; margin-top: 8px;
        overflow-x: auto; scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tabs button {
        font: inherit; font-size: 0.86rem;
        padding: 7px 11px 8px; border: 0; background: none;
        color: var(--muted); white-space: nowrap; cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      .tabs button:hover { color: var(--text); }
      .tabs button[aria-selected='true'] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
      .tabs button:focus-visible { outline-offset: -2px; }

      .panel { display: flex; flex-direction: column; gap: 16px; padding-top: 8px; }
      .panel:focus { outline: none; }

      /* ---- cards and furniture ---- */

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        min-width: 0;
      }
      .ch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 12px; }
      .ch h3 { margin: 0; font-size: 0.95rem; font-weight: 600; }
      .ch .note { color: var(--faint); font-size: 0.78rem; }
      .ch .end { margin-inline-start: auto; }
      /* ---- world map ---- */
      .map-wrap { position: relative; }
      .map { display: block; width: 100%; height: auto; max-height: 480px; touch-action: manipulation; }
      .map path { stroke: var(--bg); stroke-width: 0.4; vector-effect: non-scaling-stroke; transition: fill-opacity 0.15s; }
      .map path.on { stroke: var(--text); stroke-width: 1.4; }
      .map-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
      .map-scale { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--faint); margin-top: 8px; }
      .map-scale i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; background: var(--accent); }
      .map-scale i.zero { background: var(--raised); }
      .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
      .trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-items: start; }
      .empty { margin: 0; color: var(--faint); font-size: 0.86rem; padding: 18px 0; text-align: center; }
      .said { margin: 0; color: var(--faint); font-size: 0.8rem; }

      /* ---- KPI tiles ---- */

      .tiles {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }
      .tile {
        background: var(--surface);
        border: 1px solid var(--border); border-radius: 12px;
        padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
      }
      .tile .k { font-size: 0.68rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); }
      .tile .v { font-size: 1.7rem; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
      .tile .v small { font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-inline-start: 3px; }
      .tile .d { font-size: 0.76rem; color: var(--muted); font-variant-numeric: tabular-nums; }
      .tile .d.up::before { content: '▲ '; font-size: 0.65rem; }
      .tile .d.down::before { content: '▼ '; font-size: 0.65rem; }
      .tile.lead .v { color: var(--accent); }
      .tiles.kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .spark { display: block; width: 100%; height: 30px; margin-top: 6px; }

      .insights { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
      .insights li { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: baseline; font-size: 0.9rem; }
      .insights li::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); transform: translateY(-1px); }
      .insights li.warn::before { background: var(--warn); }

      /* ---- funnel ---- */

      .rung { padding: 8px 0; display: flex; flex-direction: column; gap: 5px; }
      .rung .row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
      .rung .nm { font-weight: 600; font-size: 0.88rem; }
      .rung .split { font-size: 0.74rem; color: var(--faint); font-variant-numeric: tabular-nums; }
      .rung .n { margin-inline-start: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
      .rung .pc { color: var(--faint); font-size: 0.78rem; font-variant-numeric: tabular-nums; min-width: 4ch; text-align: end; }
      .track { height: 10px; background: var(--raised); border-radius: 3px; overflow: hidden; }
      .track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
      .gap {
        display: flex; align-items: center; gap: 8px;
        margin-inline-start: 5px; padding: 2px 0 2px 10px;
        border-inline-start: 2px solid var(--border);
        font-size: 0.77rem; color: var(--muted);
      }
      .gap b { font-variant-numeric: tabular-nums; color: var(--text); }
      .gap.worst { border-inline-start-color: var(--bad); }
      .gap.worst b { color: var(--bad); }

      /* ---- charts ---- */

      .chart { width: 100%; height: auto; display: block; overflow: visible; }
      .chart text { font-size: 11px; fill: var(--faint); font-variant-numeric: tabular-nums; }
      .chart .hit { fill: transparent; cursor: crosshair; touch-action: pan-y; }
      .chart .hit.click { cursor: pointer; }
      .chart .band { fill: var(--text); fill-opacity: 0.07; pointer-events: none; }
      .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 0.78rem; color: var(--muted); }
      .legend span { display: inline-flex; align-items: center; gap: 7px; }
      .sw { width: 11px; height: 11px; border-radius: 3px; background: var(--accent); flex: none; }
      .sw.line { height: 3px; width: 16px; border-radius: 2px; }

      .donut { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 22px; }
      .donut svg { width: 128px; height: 128px; flex: none; }
      .donut svg path { cursor: default; }
      .donut .tot { font-size: 20px; font-weight: 700; fill: var(--text); }
      .donut .totl { font-size: 10px; fill: var(--faint); letter-spacing: 0.06em; }
      .dl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.84rem; flex: 1; min-width: 150px; }
      .dl li { display: grid; grid-template-columns: 11px 1fr auto auto; gap: 8px; align-items: center; }
      .dl .v { font-weight: 600; font-variant-numeric: tabular-nums; }
      .dl .p { color: var(--faint); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: end; font-size: 0.78rem; }

      .bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .bars li { display: grid; grid-template-columns: minmax(6.5rem, 38%) 1fr auto; align-items: center; gap: 10px; border-radius: 6px; }
      .bars li.click { cursor: pointer; }
      .bars li.click:hover .l { color: var(--text); }
      .bars .l { font-size: 0.84rem; color: var(--muted); overflow-wrap: anywhere; }
      .bars .b { height: 8px; background: var(--raised); border-radius: 2px; overflow: hidden; }
      .bars .b i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
      .bars .v { font-size: 0.82rem; font-variant-numeric: tabular-nums; min-width: 2.5ch; text-align: end; white-space: nowrap; }
      .bars .v span { color: var(--faint); margin-inline-start: 6px; }
      .grp + .grp { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
      .grp .gh { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
      .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 4px 28px; }
      .groups .grp + .grp { margin-top: 0; }
      .groups .grp { padding: 10px 0; border-top: 1px solid var(--border); }

      .flow { display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface); margin-bottom: 12px; }
      .flow i { display: block; height: 100%; }

      /* ---- tables ---- */

      .tablebox { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
      th, td { text-align: start; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      thead th {
        font-size: 0.68rem; letter-spacing: 0.07em; text-transform: uppercase;
        color: var(--faint); font-weight: 600; white-space: nowrap;
      }
      th button {
        font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
        background: none; border: 0; padding: 0; cursor: pointer;
      }
      th button:hover, th[aria-sort] button { color: var(--text); }
      th[aria-sort='ascending'] button::after { content: ' ↑'; }
      th[aria-sort='descending'] button::after { content: ' ↓'; }
      td.n, th.n { text-align: end; }
      tbody tr:last-child td { border-bottom: 0; }
      tr.row { cursor: pointer; }
      tr.row:hover td { background: var(--raised); }
      td.nowrap { white-space: nowrap; }
      td.msg { min-width: 220px; max-width: 420px; overflow-wrap: anywhere; }
      .key { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.8rem; }
      .exbar { display: block; height: 4px; margin-top: 4px; background: var(--accent); border-radius: 2px; opacity: 0.75; }
      .cohort td, .cohort th { padding: 4px; text-align: center; }
      .cohort td:first-child, .cohort th:first-child { text-align: start; padding-inline-start: 0; white-space: nowrap; }
      .cohort td.n { text-align: end; padding-inline-end: 10px; }
      .cell {
        display: block; min-width: 3.2ch; padding: 4px 2px; border-radius: 4px;
        font-size: 0.76rem; font-variant-numeric: tabular-nums; color: var(--text);
      }
      .cell.dim { color: var(--faint); }

      .flag {
        display: inline-block; font-size: 0.66rem; font-weight: 600; letter-spacing: 0.04em;
        border-radius: 999px; padding: 0 7px; margin-inline-start: 6px; white-space: nowrap;
        background: var(--raised); color: var(--muted); vertical-align: middle; line-height: 1.6;
      }
      .flag.warn { background: var(--warn-bg); color: var(--warn); }
      .flag.bad { background: var(--warn-bg); color: var(--bad); }
      .flag.ok { background: var(--accent-muted); color: var(--accent); }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 6px; vertical-align: middle; }
      .feats { display: inline-flex; gap: 3px; color: var(--muted); }
      .feats svg { width: 14px; height: 14px; }

      .tool { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; font-size: 0.8rem; }
      .tool input[type='search'] { min-width: 0; width: 13rem; max-width: 100%; }
      .tool .count { color: var(--faint); margin-inline-start: auto; }
      .chip {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--accent-muted); color: var(--text);
        border-radius: 999px; padding: 3px 4px 3px 11px; font-size: 0.78rem;
      }
      .chip button {
        font: inherit; border: 0; background: var(--bg); color: var(--muted);
        width: 20px; height: 20px; border-radius: 50%; cursor: pointer; line-height: 1; padding: 0;
      }
      .more { margin-top: 12px; }

      /* ---- tooltip ---- */

      .tip {
        position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--border-strong); border-radius: 8px;
        box-shadow: 0 8px 24px var(--shadow);
        padding: 8px 10px; font-size: 0.78rem; line-height: 1.45;
        max-width: 260px; min-width: 120px;
      }
      .tip .t { color: var(--muted); margin-bottom: 3px; }
      .tip .r { display: flex; align-items: center; gap: 8px; }
      .tip .r i { width: 12px; height: 3px; border-radius: 2px; flex: none; }
      .tip .r b { font-variant-numeric: tabular-nums; }
      .tip .r span { color: var(--muted); }

      /* ---- drawer ---- */

      .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.35); }
      .drawer {
        position: fixed; top: 0; bottom: 0; right: 0; z-index: 41;
        width: min(480px, 100vw); overflow-y: auto;
        background: var(--bg); border-inline-start: 1px solid var(--border);
        box-shadow: -12px 0 32px var(--shadow);
        padding: 18px 20px 40px;
        display: flex; flex-direction: column; gap: 16px;
      }
      .drawer .dh { display: flex; align-items: center; gap: 10px; }
      .drawer .dh h2 { margin: 0; font-size: 1.1rem; }
      .drawer .x {
        margin-inline-start: auto; font: inherit; font-size: 1.2rem; line-height: 1;
        width: 34px; height: 34px; border-radius: 50%;
        border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer;
      }
      .facts { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0; font-size: 0.84rem; }
      .facts dt { color: var(--faint); }
      .facts dd { margin: 0; }
      .tl { list-style: none; margin: 0; padding: 0; font-size: 0.82rem; }
      .tl li { display: grid; grid-template-columns: 5.6rem 1fr auto; gap: 4px 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
      .tl li:last-child { border-bottom: 0; }
      .tl .when { color: var(--faint); font-variant-numeric: tabular-nums; }
      .tl .what { min-width: 0; }
      .tl .nums { color: var(--muted); font-variant-numeric: tabular-nums; text-align: end; white-space: nowrap; }

      .skeleton { color: var(--faint); font-size: 0.9rem; padding: 40px 0; text-align: center; }

      @media (prefers-reduced-motion: no-preference) {
        .track i, .bars .b i { transition: width 0.4s cubic-bezier(0.22, 0.61, 0.36, 1); }
        .drawer { animation: slidein 0.18s ease-out; }
        @keyframes slidein { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
      }

      @media (max-width: 640px) {
        .controls { position: static; margin: 0 -16px; padding: 8px 16px 0; }
        .span { margin-inline-start: 0; }
        .pair, .trio { grid-template-columns: minmax(0, 1fr); }
        .card { padding: 14px; }
        .tile .v { font-size: 1.45rem; }
