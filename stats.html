          var sh = zeros(SB.length);
          done.forEach(function (s) { for (var j = 0; j < SB.length; j++) if (s.sets < SB[j][0]) { sh[j]++; break; } });
          if (!done.length) c5.appendChild(el('p', 'empty', 'No workouts in this range.'));
          else plot(c5, {
            buckets: SB.map(function (b) { return { label: b[1] + ' sets', short: b[1] }; }),
            series: [{ name: 'Workouts', color: 'var(--accent)', values: sh }],
            height: 180, label: 'Sets per workout histogram',
          });

          var r2 = row(p);
          var c6 = card(r2, 'What happens to started workouts', 'started in range');
          var flow = { finished: 0, abandoned: 0, lost: 0, discarded: 0, open: 0 };
          S.sessions.forEach(function (s) {
            if (!S.inR(s.sDay)) return;
            if (s.done) flow.finished++;
            else if (s.lost) flow.lost++;
            else if (s.discarded) flow.discarded++;
            else if (s.abandoned) flow.abandoned++;
            else if (s.open) flow.open++;
          });
          var FL = [
            ['finished', 'Finished', 'var(--accent)'],
            ['abandoned', 'Abandoned (open > 24h)', 'var(--k4)'],
            ['lost', 'Lost (deleted with sets)', 'var(--bad)'],
            ['discarded', 'Discarded empty', 'var(--other)'],
            ['open', 'In progress now', 'var(--k3)'],
          ];
          var started = sum(FL.map(function (f) { return flow[f[0]]; }));
          if (!started) c6.appendChild(el('p', 'empty', 'No workouts started in this range.'));
          else {
            var bar = el('div', 'flow');
            FL.forEach(function (f) {
              if (!flow[f[0]]) return;
              var seg = el('i');
              seg.style.width = (flow[f[0]] / started) * 100 + '%';
              seg.style.background = f[2];
              bindTip(seg, function () { return { title: f[1], rows: [{ color: f[2], value: fmtN(flow[f[0]]), label: pctS(flow[f[0]], started) }] }; });
              bar.appendChild(seg);
            });
            c6.appendChild(bar);
            hbars(c6, FL.filter(function (f) { return flow[f[0]] || f[0] === 'finished'; }).map(function (f) {
              return { label: f[1], value: flow[f[0]], sub: pctS(flow[f[0]], started), color: f[2] };
            }), { max: started });
          }

          var c7 = card(r2, 'Last workout', 'accounts, as of range end');
          var RB = [['≤ 7 days', 0, 7], ['8–14 days', 8, 14], ['15–30 days', 15, 30], ['30+ days', 31, Infinity]];
          var pool = S.users.filter(function (u) { return u.cDay != null && u.cDay <= S.end; });
          var lastBy = new Map();
          S.sessions.forEach(function (s) {
            if (!s.done || s.fDay > S.end) return;
            var prev = lastBy.get(s.u);
            if (prev == null || s.fDay > prev) lastBy.set(s.u, s.fDay);
          });
          var rows = RB.map(function (b) {
            var test = function (u) { var l = lastBy.get(u); if (l == null) return false; var a = S.end - l; return a >= b[1] && a <= b[2]; };
            var cnt = pool.filter(test).length;
            return { label: b[0], value: cnt, sub: pctS(cnt, pool.length), onClick: function () { goPeople({ label: 'Last workout ' + b[0] + ' before ' + dayLabel(S.end), test: test }); } };
          });
          var never = function (u) { return !lastBy.has(u); };
          var nv = pool.filter(never).length;
          rows.push({ label: 'Never', value: nv, sub: pctS(nv, pool.length), color: 'var(--other)', onClick: function () { goPeople({ label: 'Never finished a workout', test: never }); } });
          hbars(c7, rows, { max: Math.max(1, pool.length) });
        }

        /* =================================================================
           4. Training
           ================================================================= */

        function rTraining(p, S) {
          var c = card(p, 'Top exercises', 'all time · all accounts');
          var tool = el('div', 'tool');
          var q = el('input');
          q.type = 'search'; q.placeholder = 'Search exercises'; q.value = ui.exQuery;
          q.setAttribute('aria-label', 'Search exercises');
          tool.appendChild(q);
          var count = el('span', 'count num');
          tool.appendChild(count);
          c.appendChild(tool);
          var tb = el('div', 'tablebox');
          c.appendChild(tb);
          var moreBox = el('div', 'more');
          c.appendChild(moreBox);
          var COLS = [
            { key: 'name', name: 'Exercise', get: function (r) { return r.name.toLowerCase(); } },
            { key: 'sets', name: 'Sets', n: true, get: function (r) { return r.sets; } },
            { key: 'people', name: 'People', n: true, get: function (r) { return r.people; } },
            { key: 'workouts', name: 'Workouts', n: true, get: function (r) { return r.workouts; } },
            { key: 'last', name: 'Last done', n: true, get: function (r) { return r.last || 0; } },
          ];
          var maxSets = Math.max.apply(null, M.exercises.map(function (r) { return r.sets; }).concat([1]));
          function draw() {
            clear(tb); clear(moreBox);
            var qq = ui.exQuery.trim().toLowerCase();
            var rows = M.exercises.filter(function (r) { return !qq || r.name.toLowerCase().indexOf(qq) >= 0 || r.slug.indexOf(qq) >= 0; });
            count.textContent = rows.length + ' of ' + M.exercises.length;
            if (!M.exercises.length) { tb.appendChild(el('p', 'empty', 'No exercises logged yet.')); return; }
            var col = COLS.filter(function (x) { return x.key === ui.exSort.key; })[0] || COLS[1];
            rows.sort(function (a, b) { var x = col.get(a), y = col.get(b); return (x < y ? -1 : x > y ? 1 : 0) * ui.exSort.dir; });
            var all = rows.length;
            if (!ui.exAll && !qq) rows = rows.slice(0, 25);
            if (rows.length < all) {
              var more = el('button', 'refresh', 'Show all ' + all);
              more.type = 'button';
              more.addEventListener('click', function () { ui.exAll = true; draw(); });
              moreBox.appendChild(more);
            }
            tb.appendChild(table(COLS, ui.exSort, rows, function (r) {
              var tr = el('tr');
              var td = el('td');
              td.appendChild(el('span', null, r.name));
              if (/^custom_/.test(r.slug)) td.appendChild(el('span', 'flag', 'own'));
              var bar = el('span', 'exbar');
              bar.style.width = Math.max(1, (r.sets / maxSets) * 100) + '%';
              td.appendChild(bar);
              tr.appendChild(td);
              tr.appendChild(el('td', 'n', fmtN(r.sets)));
              tr.appendChild(el('td', 'n', fmtN(r.people)));
              tr.appendChild(el('td', 'n', fmtN(r.workouts)));
              tr.appendChild(el('td', 'n nowrap', r.last ? dayLabelY(Math.floor(r.last / DAY)) : '—'));
              return tr;
            }, function (key) {
              ui.exSort = { key: key, dir: ui.exSort.key === key ? -ui.exSort.dir : (key === 'name' ? 1 : -1) };
              draw();
            }));
          }
          q.addEventListener('input', function () { ui.exQuery = q.value; draw(); });
          draw();

          var mode = autoMode(S.len);
          var B = buckets(S.start, S.end, mode);
          var done = doneIn(S);
          var vol = zeros(B.list.length);
          done.forEach(function (s) { vol[B.index(s.fDay)] += s.vol / 1000; });
          var c2 = card(p, 'Volume lifted', fmt1(sum(vol)) + ' t in range');
          plot(c2, {
            buckets: B.list, integer: false, yFmt: function (v) { return fmtTick(v) + ' t'; },
            series: [{ name: 'Tonnes', color: 'var(--accent)', values: vol, fmt: function (v) { return fmt1(v) + ' t'; } }],
            label: 'Volume lifted over time',
          });

          var r1 = row(p);
          var c3 = card(r1, 'Set types', 'workouts in range');
          var tot = { sets: 0, warm: 0, drops: 0, fails: 0, rated: 0 }, used = { warm: 0, drops: 0, fails: 0, rated: 0 };
          done.forEach(function (s) {
            tot.sets += s.sets; tot.warm += s.warm; tot.drops += s.drops; tot.fails += s.fails; tot.rated += s.rated;
            if (s.warm) used.warm++; if (s.drops) used.drops++; if (s.fails) used.fails++; if (s.rated) used.rated++;
          });
          if (!done.length) c3.appendChild(el('p', 'empty', 'No workouts in this range.'));
          else {
            hbars(c3, [
              { label: 'Warm-up sets', value: used.warm, display: pctS(used.warm, done.length), sub: fmtN(tot.warm) + ' sets', title: 'Share of workouts with at least one warm-up set' },
              { label: 'Drop sets', value: used.drops, display: pctS(used.drops, done.length), sub: fmtN(tot.drops) + ' sets' },
              { label: 'To failure', value: used.fails, display: pctS(used.fails, done.length), sub: fmtN(tot.fails) + ' sets' },
              { label: 'Effort rated', value: used.rated, display: pctS(used.rated, done.length), sub: pctS(tot.rated, tot.sets) + ' of sets' },
            ], { max: done.length });
            c3.appendChild(el('p', 'said', 'Share of workouts using each'));
            c3.lastChild.style.marginTop = '10px';
          }

          var c4 = card(r1, 'Supersets');
          var withSS = done.filter(function (s) { return s.ss > 0; });
          var ssTiles = el('div', 'tiles');
          c4.appendChild(ssTiles);
          tile(ssTiles, 'Workouts with', pctS(withSS.length, done.length), fmtN(withSS.length) + ' of ' + fmtN(done.length));
          tile(ssTiles, 'Per such workout', withSS.length ? fmt1(sum(withSS.map(function (s) { return s.ss; })) / withSS.length) : '—', 'supersets on average');
          var ssPeople = new Set(withSS.map(function (s) { return s.u; })).size;
          var activePeople = new Set(done.map(function (s) { return s.u; })).size;
          tile(ssTiles, 'People using', pctS(ssPeople, activePeople), fmtN(ssPeople) + ' of ' + fmtN(activePeople) + ' active');

          var c5 = card(p, 'Onboarding answers', 'onboarded accounts created in range');
          var ob = S.joined.filter(function (u) { return u.onboarded != null; });
          if (!ob.length) { c5.appendChild(el('p', 'empty', 'Nobody finished onboarding in this range.')); return; }
          var year = new Date(M.now).getUTCFullYear();
          var Q = [
            ['Goal', function (u) { return label(u.goal); }],
            ['Experience', function (u) { return label(u.exp); }],
            ['Split', function (u) { return label(u.split); }],
            ['Days per week', function (u) { return u.days == null ? 'Not answered' : u.days + ' ' + plural(+u.days, 'day'); }],
            ['Session length', function (u) { return u.minutes == null ? 'Not answered' : u.minutes + ' min'; }],
            ['Units', function (u) { return label(u.units); }],
            ['Sex', function (u) { return label(u.sex); }],
            ['Age', function (u) {
              if (!u.born) return 'Not answered';
              var a = year - u.born;
              return a < 18 ? 'Under 18' : a < 25 ? '18–24' : a < 35 ? '25–34' : a < 45 ? '35–44' : a < 55 ? '45–54' : '55+';
            }],
            ['Warm-ups', function (u) { return u.warmups ? 'On' : 'Off'; }],
            ['Cardio', function (u) { return label(u.cardio || 'off'); }],
          ];
          var groups = el('div', 'groups');
          c5.appendChild(groups);
          var ORDERED = { 'Days per week': true, 'Session length': true, Age: true };
          Q.forEach(function (qq) {
            var cnt = {};
            ob.forEach(function (u) { var v = qq[1](u); cnt[v] = (cnt[v] || 0) + 1; });
            var keys = Object.keys(cnt);
            if (ORDERED[qq[0]]) keys.sort(function (a, b) { return (parseInt(a.replace(/\D+/, ''), 10) || 999) - (parseInt(b.replace(/\D+/, ''), 10) || 999) || (a < b ? -1 : 1); });
            else keys.sort(function (a, b) { return cnt[b] - cnt[a]; });
            var g = el('div', 'grp');
            g.appendChild(el('div', 'gh', qq[0]));
            hbars(g, keys.map(function (kk) {
              return { label: kk, value: cnt[kk], sub: pctS(cnt[kk], ob.length), color: kk === 'Not answered' ? 'var(--other)' : null };
            }), { max: ob.length });
            groups.appendChild(g);
          });
        }

        function table(cols, sortState, rows, makeRow, onSort) {
          var t = el('table');
          var thead = el('thead');
          var hr = el('tr');
          cols.forEach(function (c) {
            var th = el('th', c.n ? 'n' : null);
            th.setAttribute('scope', 'col');
            if (c.sortable === false || !onSort) th.textContent = c.name;
            else {
              var b = el('button', null, c.name);
              b.type = 'button';
              b.addEventListener('click', function () { onSort(c.key); });
              th.appendChild(b);
              if (sortState && sortState.key === c.key) th.setAttribute('aria-sort', sortState.dir > 0 ? 'ascending' : 'descending');
            }
            hr.appendChild(th);
          });
          thead.appendChild(hr);
          t.appendChild(thead);
          var tb = el('tbody');
          rows.forEach(function (r) { tb.appendChild(makeRow(r)); });
          t.appendChild(tb);
          return t;
        }

        /* =================================================================
           5. Features
           ================================================================= */

        function rFeatures(p, S) {
          var base = S.users.filter(function (u) { return u.onboarded != null && u.cDay != null && u.cDay <= S.end; });
          var c = card(p, 'Feature adoption', fmtN(base.length) + ' onboarded accounts that joined by ' + dayLabel(S.end));
          if (!base.length) { c.appendChild(el('p', 'empty', 'No onboarded accounts for these filters.')); return; }
          var rows = FEATURES.map(function (f) {
            var cnt = base.filter(function (u) { return u.feat[f.id]; }).length;
            return { f: f, cnt: cnt };
          }).sort(function (a, b) { return b.cnt - a.cnt; });
          hbars(c, rows.map(function (r) {
            return {
              label: r.f.name, value: r.cnt, display: pctS(r.cnt, base.length), sub: fmtN(r.cnt),
              onClick: function () {
                goPeople({ label: r.f.name, test: function (u) { return u.onboarded != null && u.feat[r.f.id]; } });
              },
            };
          }), { max: base.length });

          var r1 = row(p);
          var c2 = card(r1, 'Features per account');
          var dist = zeros(6);
          base.forEach(function (u) {
            var nf = FEATURES.filter(function (f) { return f.id !== 'warmups' && f.id !== 'cardio' && u.feat[f.id]; }).length;
            dist[Math.min(5, nf)]++;
          });
          plot(c2, {
            buckets: ['0', '1', '2', '3', '4', '5+'].map(function (x) { return { label: x + ' features', short: x }; }),
            series: [{ name: 'Accounts', color: 'var(--accent)', values: dist }],
            height: 170, label: 'Number of features used per account',
          });

          var c3 = card(r1, 'Depth', 'among accounts using it');
          function avg(field) {
            var us = base.filter(function (u) { return u[field] > 0; });
            return us.length ? fmt1(sum(us.map(function (u) { return u[field]; })) / us.length) : '—';
          }
          var tl = el('div', 'tiles');
          c3.appendChild(tl);
          tile(tl, 'Routines', avg('routines'), 'per person');
          tile(tl, 'Folders', avg('folders'), 'per person');
          tile(tl, 'Own exercises', avg('custom'), 'per person');
          tile(tl, 'Exercise notes', avg('xnotes'), 'per person');
        }

        /* =================================================================
           6. Retention
           ================================================================= */

        function rRetention(p, S) {
          var J = S.joined;
          var tiles = el('div', 'tiles');
          p.appendChild(tiles);
          [1, 7, 30].forEach(function (nd) {
            var eligible = J.filter(function (u) { return M.today - u.cDay >= nd; });
            var kept = eligible.filter(function (u) {
              return u.sess.some(function (s) { return s.done && s.fDay - u.cDay >= nd; });
            });
            tile(tiles, 'Day ' + nd, eligible.length ? pct(kept.length, eligible.length) + '%' : '—',
              eligible.length ? fmtN(kept.length) + ' of ' + fmtN(eligible.length) + ' trained on day ' + nd + '+' : 'nobody old enough yet', { lead: nd === 7 });
          });

          var c = card(p, 'Weekly cohorts', '% of each sign-up week that finished a workout in week n');
          if (!J.length) { c.appendChild(el('p', 'empty', 'Nobody joined in this range.')); return; }
          var COLN = 9;
          var cohorts = new Map();
          J.forEach(function (u) {
            var w = weekOf(u.cDay);
            var co = cohorts.get(w);
            if (!co) { co = { w: w, users: 0, cols: [] }; for (var i = 0; i < COLN; i++) co.cols.push(new Set()); cohorts.set(w, co); }
            co.users++;
            u.sess.forEach(function (s) {
              if (!s.done || s.fDay == null) return;
              var off = weekOf(s.fDay) - w;
              if (off < 0) return;
              co.cols[Math.min(off, COLN - 1)].add(u);
            });
          });
          var list = Array.from(cohorts.values()).sort(function (a, b) { return b.w - a.w; });
          var nowW = weekOf(M.today);
          var tb = el('div', 'tablebox');
          var t = el('table', 'cohort');
          var thead = el('thead'), hr = el('tr');
          hr.appendChild(el('th', null, 'Week of'));
          hr.appendChild(el('th', 'n', 'People'));
          for (var i = 0; i < COLN; i++) hr.appendChild(el('th', null, i === COLN - 1 ? (COLN - 1) + '+' : String(i)));
          thead.appendChild(hr); t.appendChild(thead);
          var body = el('tbody');
          list.forEach(function (co) {
            var tr = el('tr');
            tr.appendChild(el('td', null, dayLabelY(weekStart(co.w))));
            tr.appendChild(el('td', 'n', fmtN(co.users)));
            for (var j = 0; j < COLN; j++) {
              var td = el('td');
              if (co.w + j > nowW) { tr.appendChild(td); continue; }
              var cnt = co.cols[j].size;
              var share = cnt / co.users;
              var cell = el('span', 'cell' + (cnt ? '' : ' dim'), cnt ? Math.round(share * 100) + '%' : '0');
              if (cnt) {
                var mix = Math.round(14 + share * 86);
                cell.style.background = 'color-mix(in srgb, var(--accent) ' + mix + '%, transparent)';
                if (mix > 55) cell.style.color = 'var(--on-accent)';
              }
              (function (co2, j2, cnt2) {
                bindTip(cell, function () {
                  return {
                    title: 'Joined week of ' + dayLabel(weekStart(co2.w)) + ' · week ' + (j2 === COLN - 1 ? (COLN - 1) + ' or later' : j2),
                    rows: [{ color: 'var(--accent)', value: fmtN(cnt2) + ' of ' + fmtN(co2.users), label: 'trained' }],
                  };
                });
              }(co, j, cnt));
              td.appendChild(cell);
              tr.appendChild(td);
            }
            body.appendChild(tr);
          });
          t.appendChild(body);
          tb.appendChild(t);
          c.appendChild(tb);
        }

        /* =================================================================
           7. People
           ================================================================= */

        var PCOLS = [
          { key: 'k', name: 'Key', get: function (u) { return u.k; } },
          { key: 'joined', name: 'Joined', get: function (u) { return u.created || 0; } },
          { key: 'platform', name: 'Platform', get: function (u) { return u.platform + (u.build != null ? pad2(u.build) : ''); } },
          { key: 'provider', name: 'Sign-in', get: function (u) { return u.provider; } },
          { key: 'onboarded', name: 'Onboarded', get: function (u) { return u.onboarded ? 1 : 0; } },
          { key: 'workouts', name: 'Workouts', n: true, get: function (u) { return u.nDone; } },
          { key: 'sets', name: 'Sets', n: true, get: function (u) { return u.sets; } },
          { key: 'last', name: 'Last workout', get: function (u) { return u.lastDone || 0; } },
          { key: 'seen', name: 'Last seen', get: function (u) { return u.seen || 0; } },
          { key: 'goal', name: 'Goal', get: function (u) { return u.goal || ''; } },
          { key: 'feat', name: 'Features', get: function (u) { return u.featCount; } },
        ];

        function rPeople(p, S) {
          var c = card(p);
          var tool = el('div', 'tool');
          var q = el('input');
          q.type = 'search'; q.placeholder = 'Search key, goal, platform'; q.value = ui.peopleQuery;
          q.setAttribute('aria-label', 'Search people');
          tool.appendChild(q);
          var trainedIn = new Set();
          S.sessions.forEach(function (s) { if (s.done && S.inR(s.fDay)) trainedIn.add(s.u); });
          var QUICK = {
            all: ['All', function () { return true; }],
            joined: ['Joined in range', function (u) { return S.inR(u.cDay); }],
            trained: ['Trained in range', function (u) { return trainedIn.has(u); }],
            stale: ['No OTA', noOta],
            lost: ['Lost a workout', function (u) { return u.lost > 0; }],
          };
          tool.appendChild(segmented(Object.keys(QUICK).map(function (k) { return [k, QUICK[k][0]]; }), ui.peopleQuick, function (v) {
            ui.peopleQuick = v; ui.peopleLimit = 100; renderActive();
          }, 'Quick filter'));
          if (ui.peopleFilter) {
            var chip = el('span', 'chip', ui.peopleFilter.label);
            var x = el('button', null, '×');
            x.type = 'button';
            x.setAttribute('aria-label', 'Clear filter');
            x.addEventListener('click', function () { ui.peopleFilter = null; renderActive(); });
            chip.appendChild(x);
            tool.appendChild(chip);
          }
          var count = el('span', 'count num');
          tool.appendChild(count);
          c.appendChild(tool);
          var tb = el('div', 'tablebox');
          c.appendChild(tb);
          var moreBox = el('div', 'more');
          c.appendChild(moreBox);

          function draw() {
            clear(tb); clear(moreBox);
            var qq = ui.peopleQuery.trim().toLowerCase();
            var quick = (QUICK[ui.peopleQuick] || QUICK.all)[1];
            var f = ui.peopleFilter;
            var rows = S.users.filter(function (u) {
              if (!quick(u)) return false;
              if (f && !f.test(u)) return false;
              if (!qq) return true;
              return (u.k + ' ' + label(u.goal) + ' ' + PLAT[u.platform].name + ' ' + u.provider + (u.build != null ? ' build ' + u.build : '')).toLowerCase().indexOf(qq) >= 0;
            });
            var col = PCOLS.filter(function (x2) { return x2.key === ui.peopleSort.key; })[0] || PCOLS[1];
            rows.sort(function (a, b) { var x1 = col.get(a), y1 = col.get(b); return (x1 < y1 ? -1 : x1 > y1 ? 1 : 0) * ui.peopleSort.dir; });
            count.textContent = fmtN(rows.length) + ' ' + plural(rows.length, 'account');
            if (!rows.length) { tb.appendChild(el('p', 'empty', 'Nobody matches.')); return; }
            var shown = rows.slice(0, ui.peopleLimit);
            tb.appendChild(table(PCOLS, ui.peopleSort, shown, personRow, function (key) {
              ui.peopleSort = { key: key, dir: ui.peopleSort.key === key ? -ui.peopleSort.dir : (key === 'k' || key === 'goal' || key === 'provider' || key === 'platform' ? 1 : -1) };
              draw();
            }));
            if (rows.length > shown.length) {
              var more = el('button', 'refresh', 'Show ' + Math.min(200, rows.length - shown.length) + ' more');
              more.type = 'button';
              more.addEventListener('click', function () { ui.peopleLimit += 200; draw(); });
              moreBox.appendChild(more);
            }
          }
          q.addEventListener('input', function () { ui.peopleQuery = q.value; ui.peopleLimit = 100; draw(); });
          draw();
        }

        function personRow(u) {
          var tr = el('tr', 'row');
          tr.tabIndex = 0;
          tr.setAttribute('aria-label', 'Account ' + u.k);
          var k = el('td', 'nowrap');
          k.appendChild(el('span', 'key', u.k));

            var len = r.end - r.start + 1;
            var sp = $('ctl-span');
            clear(sp);
            sp.appendChild(el('b', null, spanLabel(r.start, r.end)));
            if (len > 1) sp.appendChild(document.createTextNode(' · ' + len + ' ' + plural(len, 'day')));
            /* The month picker shows a month only while the range is exactly that month. */
            var ms = monthStartOf(r.start);
            $('ctl-month').value = ctl.range === 'custom' && r.start === ms && r.end === Math.min(monthEndOf(ms), M.today) ? String(ms) : '';
            placeWindow();
          }
        }

        function controlsChanged() {
          clearTimeout(tlTimer);
          saveCtl();
          syncControls();
          drawTimeline();
          SC = null;
          renderActive();
        }

        (function wireControls() {
          var tz = $('ctl-tz');
          TZS.forEach(function (t) {
            var o = el('option', null, t.v === 'local' ? t.name + ' (' + LOCAL_TZ + ')' : t.name);
            o.value = t.v;
            tz.appendChild(o);
          });
          $('ctl-range').addEventListener('click', function (ev) {
            var b = ev.target.closest('button[data-v]');
            if (!b) return;
            ctl.range = b.getAttribute('data-v');
            controlsChanged();
          });
          $('ctl-platform').addEventListener('click', function (ev) {
            var b = ev.target.closest('button[data-v]');
            if (!b) return;
            ctl.platform = b.getAttribute('data-v');
            controlsChanged();
          });
          $('ctl-test').addEventListener('change', function () { ctl.test = $('ctl-test').checked; controlsChanged(); });
          tz.addEventListener('change', function () {
            ctl.tz = tz.value;
            saveCtl();
            if (M) { applyTz(M); fillMonths(); }
            controlsChanged();
          });
          syncControls();
        }());

        /* ---- rendering a response ---- */

        function render(data) {
          RAW = data;
          M = build(data);
          applyTz(M);
          SC = null;
          var prob = $('dash-problem');
          if (!M.hasV2) {
            prob.textContent = 'The stats function is not sending v2 data yet, so only the Website tab has numbers.';
            prob.hidden = false;
          } else prob.hidden = true;
          $('asof').textContent = 'as of ' + new Date(M.hasV2 && data.v2.generated_at ? data.v2.generated_at : data.generated_at || Date.now()).toLocaleString();
          fillMonths();
          syncControls();
          drawTimeline();
          var id = location.hash.slice(1);
          selectTab(TAB_BY[id] ? id : ui.tab, false);
        }

        /* =================================================================
           Demo data. Synthetic, generated here, seeded so it is the same on
           every load. Never reachable off localhost (see DEMO above).
           ================================================================= */

        function demoData() {
          var seed = 20261006;
          function rnd() {
            seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
            var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          }
          function wpick(pairs) {
            var tot = 0, i;
            for (i = 0; i < pairs.length; i++) tot += pairs[i][1];
            var r = rnd() * tot;
            for (i = 0; i < pairs.length; i++) { r -= pairs[i][1]; if (r <= 0) return pairs[i][0]; }
            return pairs[pairs.length - 1][0];
          }
          function between(a, b) { return a + rnd() * (b - a); }
          function int(a, b) { return Math.floor(between(a, b + 1)); }
          function iso(ms) { return new Date(ms).toISOString(); }

          var now = Date.now();
          var fix = Date.UTC(2026, 9, 5, 9);
          var RIYADH = 3 * HOUR;
          var keys = new Set();
          function key() {
            var k;
            do { k = ('00000' + Math.floor(rnd() * 0xffffff).toString(16)).slice(-6); } while (keys.has(k));
            keys.add(k);
            return k;
          }
          var users = [], sessions = [], crashRows = [];
          var SPLIT_KINDS = {
            full_body: ['full_body'], upper_lower: ['upper', 'lower'], push_pull_legs: ['push', 'pull', 'legs'],
            auto: ['full_body', 'upper', 'lower', 'push', 'pull', 'legs'],
          };
          var SETTINGS = ['gyms', 'intervals', 'supersets.mode', 'timers', 'rest', 'plates'];
          /* Country, weight, and the share of its downloads that are iPhones. */
          var CC = [['SA', 30, 0.78], ['EG', 17, 0.25], ['BD', 8, 0.08], ['US', 8, 0.62], ['KW', 6, 0.8], ['AE', 6, 0.72], ['IN', 5, 0.15],
            ['ID', 4, 0.2], ['TR', 4, 0.35], ['DE', 3, 0.5], ['GB', 3, 0.6], ['PK', 3, 0.12], ['MA', 2, 0.3], ['JO', 2, 0.45]];
          function demoCountry(pl) {
            return wpick(CC.map(function (c) { return [c[0], c[1] * (pl === 'ios' ? c[2] : pl === 'android' ? 1 - c[2] : 0.5)]; }));
          }
          var seeds = [];

          for (var i = 0; i < 120; i++) {
            var founder = i < 3;
            var age = founder ? between(85, 90) : 90 * Math.pow(rnd(), 1.25);
            var created = now - age * DAY - between(0, HOUR);
            var platform = founder ? 'ios' : wpick([['android', 50], ['ios', 44], ['unknown', 6]]);
            var build = null;
            if (platform === 'ios') {
              build = age > 55 ? wpick([[7, 2], [9, 3], [10, 3], [12, 4], [13, 3], [14, 2]])
                : age > 20 ? wpick([[10, 1], [12, 3], [13, 4], [14, 4], [15, 1]])
                  : wpick([[12, 1], [13, 2], [14, 5], [15, 3]]);
            }
            var provider = platform === 'ios' ? wpick([['apple', 45], ['google', 25], ['email', 30]])
              : platform === 'android' ? wpick([['google', 70], ['email', 30]]) : wpick([['email', 60], ['google', 40]]);
            var onboardedOk = founder || rnd() < 0.82;
            var onboarded = onboardedOk ? created + between(2, 12) * 60000 : null;
            var split = wpick([['auto', 40], ['full_body', 20], ['upper_lower', 15], ['push_pull_legs', 25]]);
            var warm = rnd() < 0.55;
            var rater = rnd() < 0.3;
            var cardioPref = wpick([['off', 60], ['after', 30], ['separate', 10]]);
            var u = {
              k: key(), created: iso(created), provider: provider, platform: platform, build: build,
              seen: null, x: founder,
              onboarded: onboarded ? iso(onboarded) : null,
              goal: onboarded ? wpick([['hypertrophy', 45], ['strength', 25], ['fat_loss', 20], ['general_fitness', 10]]) : null,
              exp: onboarded ? wpick([['beginner', 45], ['intermediate', 40], ['advanced', 15]]) : null,
              split: onboarded ? split : null,
              days: onboarded ? int(2, 6) : null,
              minutes: onboarded ? wpick([[30, 2], [45, 4], [60, 5], [75, 2], [90, 1]]) : null,
              units: onboarded ? wpick([['kg', 80], ['lb', 20]]) : null,
              heard: onboarded && rnd() < 0.85 ? wpick([['tiktok', 30], ['instagram', 15], ['app store', 18], ['friend', 14], ['google', 10], ['reddit', 5], ['product hunt', 4], ['other', 4]]) : null,
              reasons: onboarded ? wpick([['strength,habit', 1], ['muscle', 2], ['health,weight', 1], ['habit', 1]]) : null,
              sex: onboarded ? wpick([['male', 65], ['female', 30], [null, 5]]) : null,
              born: onboarded && rnd() < 0.9 ? int(1972, 2008) : null,
              warmups: !!onboarded && warm,
              cardio: onboarded ? cardioPref : null,
              routines: 0, folders: 0, custom: 0, xnotes: 0, settings: [],
            };
            if (onboarded) {
              if (rnd() < 0.3 || founder) u.routines = int(1, 4);
              if (u.routines > 1 && rnd() < 0.45) u.folders = int(1, 2);
              if (rnd() < 0.22 || founder) u.custom = int(1, 5);
              if (rnd() < 0.25) u.xnotes = int(1, 8);
              SETTINGS.forEach(function (s) { if (rnd() < 0.18) u.settings.push(s); });
            }
            var last = onboarded || created;

            var activated = onboarded && (founder || rnd() < 0.66);
            if (activated) {
              var kinds = u.routines && rnd() < 0.4 ? ['routine'] : SPLIT_KINDS[split];
              var delay = wpick([[0.02, 30], [0.4, 15], [1.5, 15], [3, 12], [6, 12], [12, 8], [22, 8]]);
              var t = created + delay * DAY * between(0.6, 1.3);
              var gapDays = founder ? 1.6 : between(1.6, 5);
              var churn = founder ? 0.01 : between(0.05, 0.25);
              var timer = rnd() < 0.18;
              var supers = rnd() < 0.25;
              var noter = rnd() < 0.2;
              var n = 0;
              while (t < now && n < 200) {
                var localDay = Math.floor((t + RIYADH) / DAY) * DAY - RIYADH;
                var hour = wpick([[5, 2], [6, 5], [7, 6], [8, 3], [10, 2], [12, 2], [14, 2], [16, 4], [17, 7], [18, 9], [19, 9], [20, 8], [21, 6], [22, 3], [23, 1]]);
                var start = localDay + hour * HOUR + between(0, HOUR);
                if (start > now) break;
                var isTimer = timer && rnd() < 0.2;
                var mins = isTimer ? between(8, 30) : Math.max(12, between(25, 95));
                var paused = rnd() < 0.3 ? int(30, 600) : 0;
                var finish = start + mins * 60000 + paused * 1000;
                var ex = isTimer ? 1 : int(4, 8);
                var setsN = isTimer ? 0 : Math.max(1, ex * 3 + int(-4, 4));
                var kind = isTimer ? 'cardio' : kinds[n % kinds.length];
                var fate = wpick([['done', 92], ['lost', start < fix ? 4 : 0.2], ['abandoned', 2.5], ['discarded', 1.5]]);
                var finished = fate === 'done' ? finish : null;
                var deleted = fate === 'lost' || fate === 'discarded' ? start + between(5, 60) * 60000 : null;
                if (fate === 'discarded') setsN = 0;
                if (fate === 'lost') setsN = int(2, setsN || 4);
                if (finished && finished > now) { finished = null; deleted = null; fate = 'open'; }
                sessions.push([
                  u.k, iso(start - between(0, 20) * 60000), iso(start), finished ? iso(finished) : null, deleted ? iso(deleted) : null,
                  paused, kind, kind === 'routine', ex, setsN,
                  u.warmups && !isTimer ? int(1, 4) : 0,
                  rnd() < 0.18 ? int(1, 3) : 0,
                  rnd() < 0.22 ? int(1, 4) : 0,
                  rater ? setsN : rnd() < 0.1 ? int(1, setsN || 1) : 0,
                  isTimer ? 0 : Math.round(setsN * between(180, 650)),
                  supers && rnd() < 0.5 ? int(1, 3) : 0,
                  noter && rnd() < 0.3, noter && rnd() < 0.4,
                  isTimer ? 'manual' : wpick([['generated', 70], ['manual', 30]]),
                ]);
                last = Math.max(last, finished || start);
                n++;
                if (rnd() < churn) break;
                t = start + gapDays * DAY * between(0.5, 1.6);
              }
            }
            var seen = Math.min(now, last + between(0, 4) * DAY);
            u.seen = rnd() < 0.05 ? null : iso(seen);
            /* Most accounts carry their store country; a few do not, as old builds will not. */
            u.country = rnd() < 0.9 ? demoCountry(platform) : null;
            seeds.push([platform, created, u.country]);
            users.push(u);
          }

          /* One workout in progress right now. */
          var live = users[5];
          sessions.push([live.k, iso(now - 50 * 60000), iso(now - 40 * 60000), null, null, 0, 'push', false, 5, 9, 2, 0, 0, 0, 3400, 0, false, false, 'generated']);

          var SLUGS = ['barbell_bench_press', 'barbell_back_squat', 'conventional_deadlift', 'lat_pulldown', 'dumbbell_shoulder_press',
            'seated_cable_row', 'leg_press', 'romanian_deadlift', 'incline_dumbbell_press', 'pull_up', 'dumbbell_curl',
            'triceps_pushdown', 'lateral_raise', 'leg_extension', 'lying_leg_curl', 'hip_thrust', 'standing_calf_raise',
            'chest_fly_machine', 'face_pull', 'bulgarian_split_squat', 'hammer_curl', 'overhead_triceps_extension',
            'barbell_row', 'goblet_squat', 'push_up', 'dip', 'cable_crunch', 'plank', 'walking_lunge', 'hack_squat',
            'preacher_curl', 'smith_machine_squat', 'pec_deck', 'rear_delt_fly', 'treadmill_run', 'rowing_machine',
            'custom_8f2a1c', 'custom_b71e09', 'custom_03d4aa'];
          var exercises = SLUGS.map(function (s, j) {
            var sets = Math.round(900 * Math.pow(0.9, j) * between(0.85, 1.15));
            return [s, sets, Math.max(1, Math.round(sets / between(16, 26))), Math.max(1, Math.round(sets / between(3, 4.5))), iso(now - between(0, 20) * DAY)];
          }).sort(function (a, b) { return b[1] - a[1]; });

          var MSG = [
            ['js', 'TypeError: Cannot read property \'id\' of undefined'],
            ['native', 'SQLiteException: database is locked (code 5)'],
            ['js', 'RangeError: Maximum call stack size exceeded'],
            ['native', 'EXC_BAD_ACCESS in RNSScreen'],
          ];
          for (var c = 0; c < 9; c++) {
            var cu = users[int(3, users.length - 1)];
            var m = MSG[int(0, MSG.length - 1)];
            var when = now - between(0, 60) * DAY;
            var cpl = cu.platform === 'unknown' ? 'android' : cu.platform;
            crashRows.push([
              iso(when), m[0], m[1], when < fix ? wpick([['0.3.0', 3], ['0.2.0', 1]]) : '0.3.1', cpl,
              cpl === 'ios' ? wpick([['18.6', 2], ['26.0', 3]]) : wpick([['14', 2], ['15', 3]]),
              cpl === 'ios' ? wpick([['iPhone15,3', 1], ['iPhone16,2', 1], ['iPhone13,2', 1]]) : wpick([['SM-S918B', 1], ['Pixel 7', 1], ['22101316G', 1]]),
              rnd() < 0.6 ? 'b7c1e2d4-' + int(1000, 9999) + '-4c1a-9e0d-' + int(100000, 999999) + '000000' : null,
              cu.k,
            ]);
          }

          var daily = [];
          var todayUtc = Math.floor(now / DAY);
          /*
            Store downloads, per store, day and country: one for each account,
            plus people who download and never sign up, plus quiet days.
            Apple has reported up to yesterday, Google Play up to four days ago.
          */
          var agg = {};
          function addDl(src, day, cc, nn) { var key = src + '|' + day + '|' + cc; agg[key] = (agg[key] || 0) + nn; }
          seeds.forEach(function (sd) {
            var src = sd[0] === 'ios' ? 'apple' : sd[0] === 'android' ? 'google' : (rnd() < 0.5 ? 'apple' : 'google');
            var pl = src === 'apple' ? 'ios' : 'android';
            var day = Math.floor(sd[1] / DAY);
            addDl(src, day, sd[2] || demoCountry(pl), 1);
            var extra = (rnd() < 0.55 ? 1 : 0) + (rnd() < 0.15 ? 1 : 0);
            if (extra) addDl(src, day, demoCountry(pl), extra);
          });
          for (var bd = 92; bd >= 0; bd--) {
            if (rnd() < 0.4) { var bs = rnd() < 0.45 ? 'apple' : 'google'; addDl(bs, todayUtc - bd, demoCountry(bs === 'apple' ? 'ios' : 'android'), int(1, 2)); }
          }
          var demoStore = [];
          Object.keys(agg).forEach(function (key) {
            var part = key.split('|'), day = +part[1];
            if (part[0] === 'apple' && day > todayUtc - 1) return;
            if (part[0] === 'google' && day > todayUtc - 4) return;
            demoStore.push([part[0], isoDay(day), part[2], agg[key]]);
          });
          demoStore.sort(function (a, b) { return a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0; });
          for (var d = 29; d >= 0; d--) daily.push({ day: isoDay(todayUtc - d), views: int(20, 140), clicks: int(0, 9) });
          var views30 = sum(daily.map(function (x) { return x.views; }));
          var clicks30 = sum(daily.map(function (x) { return x.clicks; }));
          return {
            generated_at: iso(now),
            store_sync: [],
            web: {
              totals: {
                views_today: daily[29].views, views_7d: sum(daily.slice(-7).map(function (x) { return x.views; })), views_30d: views30,
                clicks_7d: sum(daily.slice(-7).map(function (x) { return x.clicks; })), clicks_30d: clicks30, since: daily[0].day,
              },
              daily: daily,
              sources: [{ name: 'tiktok', views: 610, clicks: 38 }, { name: 'direct', views: 540, clicks: 21 }, { name: 'google', views: 220, clicks: 9 }, { name: 'product hunt', views: 140, clicks: 6 }, { name: 'reddit', views: 60, clicks: 2 }],
              countries: [{ name: 'SA', views: 700, clicks: 40 }, { name: 'US', views: 300, clicks: 12 }, { name: 'GB', views: 160, clicks: 5 }, { name: 'AE', views: 120, clicks: 7 }, { name: '??', views: 40, clicks: 0 }],
              pages: [{ name: '/', views: 900, clicks: 50 }, { name: '/ar/', views: 410, clicks: 22 }, { name: '/get/', views: 120, clicks: 0 }, { name: '/support.html', views: 60, clicks: 0 }],
              devices: [{ name: 'iphone', views: 820, clicks: 51 }, { name: 'android', views: 560, clicks: 18 }, { name: 'desktop', views: 190, clicks: 7 }],
            },
            v2: { generated_at: iso(now), users: users, sessions: sessions, exercises: exercises, store_daily: demoStore, crash_rows: crashRows },
          };
        }

        /* ---- wiring ---- */

        /**
         * A message worth reading.
         *
         * `fetch` rejects with "Failed to fetch" for every reason a request
         * never left the browser — offline, a blocked domain, a CORS header
         * one word short — and none of those are things the reader did.
         */
        function readable(error) {
          var message = (error && error.message) || String(error);
          if (/failed to fetch|networkerror|load failed/i.test(message)) {
            return navigator.onLine === false
              ? 'You appear to be offline.'
              : 'Could not reach the server. This is not your password — the ' +
                'request never left the browser. An ad blocker or a VPN will ' +
                'do it; so will the server being down.';
          }
          return message;
        }

        function attempt() {
          $('loading').hidden = false;
          loadStats(false)
            .then(function (data) {
              showDash();
              render(data);
              /* hit.js reads this: the owner's own visits stop counting on this browser. */
              if (!DEMO) {
                try { localStorage.setItem('grasp-no-count', '1'); } catch (e) { /* private mode */ }
              }
            })
            .catch(function (error) {
              if (DEMO) { if (window.console) console.error(error); showGate(readable(error)); return; }
              if (error.message === 'signed-out') { showGate(null); return; }
              /*
                Signed in but refused, or the server is unreachable. Say which,
                in words that suggest what to do about it. A browser reports a
                blocked or failed request as "Failed to fetch", which reads to
                anybody sensible as "your password was wrong" — it is the one
                message here that must not be passed through untranslated.
              */
              showGate(readable(error));
              clearSession();
            });
        }

        $('gate').addEventListener('submit', function (event) {
          event.preventDefault();
          var button = $('gate-go');
          button.disabled = true;
          button.textContent = 'Signing in…';
          signIn($('email').value.trim(), $('password').value)
            .then(function (out) {
              button.disabled = false;
              button.textContent = 'Sign in';
              if (!out.ok || !out.body.access_token) {
                showGate(out.body.error_description || out.body.msg || 'That did not work.');
                return;
              }
              saveSession(out.body);
              $('password').value = '';
              attempt();
            })
            .catch(function (error) {
              button.disabled = false;
              button.textContent = 'Sign in';
              showGate(readable(error));
            });
        });

        $('refresh').addEventListener('click', function () {
          var b = $('refresh');
          b.disabled = true;
          b.textContent = 'Refreshing…';
          loadStats(false)
            .then(function (data) { render(data); })
            .catch(function (error) {
              var p = $('dash-problem');
              p.textContent = error.message === 'signed-out' ? 'Signed out.' : readable(error);
              p.hidden = false;
            })
            .then(function () { b.disabled = false; b.textContent = 'Refresh'; });
        });

        $('signout').addEventListener('click', function () {
          clearSession();
          showGate(null);
        });

        if (DEMO) {
          $('demo-badge').hidden = false;
          $('signout').hidden = true;
        }

        attempt();
      })();
    </script>
  </body>
